name: colocalization-reference-diagnostic
on: workflow_dispatch
permissions:
  contents: read
  actions: read
env:
  BASELINE_RUN: '40270607172'
  BASELINE_REVISION: '0135305a02f8ca9f9efd3b2f6d0853ad95ba42c2'
  CANDIDATE_RUN: '40273141051'
  CANDIDATE_REVISION: 'c53198aff0a502fdfe236c6b46834bbc58547abd'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  OMP_WAIT_POLICY: PASSIVE
  PYTHONOPTIMIZE: '0'
  PYTHONNOUSERSITE: '1'
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
      - uses: actions/checkout@v4
        with:
          ref: '0135305a02f8ca9f9efd3b2f6d0853ad95ba42c2'
          path: snapshots/baseline
      - uses: actions/checkout@v4
        with:
          ref: 'c53198aff0a502fdfe236c6b46834bbc58547abd'
          path: snapshots/candidate
      - name: Authenticate fixed runs and prepared artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir results
          test "$(git -C controller rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import hashlib, json, os, re, stat, subprocess, zipfile
          from pathlib import Path, PurePosixPath
          for role, conclusion in (('baseline', 'success'), ('candidate', 'failure')):
              run, revision = (os.environ[role.upper() + suffix] for suffix in ('_RUN', '_REVISION'))
              assert re.fullmatch('[1-9][0-9]*', run) and re.fullmatch('[0-9a-f]{40}', revision)
              base = 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/'
              def api(endpoint, label):
                  raw = subprocess.check_output(['gh', 'api', base + endpoint])
                  Path('results', role + '-' + label + '.json').write_bytes(raw)
                  return json.loads(raw)
              record = api('runs/' + run, 'run')
              assert str(record['id']) == run and record['head_sha'] == revision
              assert record['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
              assert record['path'] == '.github/workflows/phase3-public-benchmark.yml'
              assert record['status'] == 'completed' and record['conclusion'] == conclusion
              listing = api('runs/' + run + '/artifacts?per_page=100', 'artifacts')
              assert listing['total_count'] == len(listing['artifacts'])
              selected = [a for a in listing['artifacts'] if a['name'] == 'phase3-prepared-minimum-linux']
              assert len(selected) == 1
              item = selected[0]
              assert not item['expired'] and 0 < item['size_in_bytes'] < 512 * 1024**2
              assert item['workflow_run']['id'] == int(run) and item['workflow_run']['head_sha'] == revision
              assert re.fullmatch('sha256:[0-9a-f]{64}', item['digest'])
              archive = Path(os.environ['RUNNER_TEMP'], role + '-prepared.zip')
              with archive.open('xb') as stream:
                  subprocess.run(['gh', 'api', base + 'artifacts/' + str(item['id']) + '/zip'], stdout=stream, check=True)
              actual = dict(bytes=archive.stat().st_size, sha256=hashlib.sha256(archive.read_bytes()).hexdigest(), selection=item)
              Path('results', role + '-archive.json').write_text(json.dumps(actual, indent=2) + '\n')
              assert actual['bytes'] == item['size_in_bytes'] and 'sha256:' + actual['sha256'] == item['digest']
              folder = Path('snapshots', role, 'build/prepared')
              with zipfile.ZipFile(archive) as z:
                  assert len(z.namelist()) == len(set(z.namelist())) and sum(i.file_size for i in z.infolist()) < 2 * 1024**3
                  for i in z.infolist():
                      name = PurePosixPath(i.filename)
                      assert not name.is_absolute() and '..' not in name.parts and '\\' not in i.filename
                      assert not stat.S_ISLNK(i.external_attr >> 16)
                  z.extractall(folder)
              with zipfile.ZipFile(folder / 'preparation/source.zip') as z:
                  assert z.comment.decode() == revision
                  for name in z.namelist():
                      if not name.endswith('/'): assert z.read(name) == (Path('snapshots', role) / name).read_bytes(), name
          old, new = (json.loads(Path('snapshots', r, 'build/prepared/preparation/measurement.json').read_bytes()) for r in ('baseline', 'candidate'))
          for key in ('python', 'implementation', 'cache_tag', 'machine', 'system', 'dependency_libraries_sha256'):
              assert old['runtime'][key] == new['runtime'][key], key
          for name in ('numpy', 'scipy', 'skimage'):
              assert old['runtime']['packages_sha256'][name] == new['runtime']['packages_sha256'][name], name
          assert {k: v for k, v in old['wheels'].items() if v['name'] != 'scikit-imagexx'} == {k: v for k, v in new['wheels'].items() if v['name'] != 'scikit-imagexx'}
          PY
      - name: Install both exact runtimes offline before diagnostic calls
        shell: bash
        run: |
          set -euo pipefail
          for role in baseline candidate; do
            python -m venv "$RUNNER_TEMP/env-$role"
            "$RUNNER_TEMP/env-$role/bin/python" -m pip install --no-index --no-deps --only-binary=:all: --require-hashes --find-links "snapshots/$role/build/prepared/wheels" -r "snapshots/$role/build/prepared/preparation/runtime-lock.txt" 2>&1 | tee "results/$role-install.log"
          done
          for file in tests/colocalization_cases.py tests/colocalization_reference.py tests/test_colocalization_public.py tests/data/colocalization_public_semantics.json.gz coverage/contracts/colocalization.json tools/ci_measurement_artifacts.py; do cmp "snapshots/baseline/$file" "snapshots/candidate/$file"; done
      - name: Capture original then installed observations in four fresh processes
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME PYTEST_ADDOPTS PYTEST_PLUGINS SKIMAGEXX_DISABLE_SIMD
          overall=0
          for role in baseline candidate; do
            for mode in normal scalar; do
              if [ "$mode" = scalar ]; then export SKIMAGEXX_DISABLE_SIMD=1; else unset SKIMAGEXX_DISABLE_SIMD; fi
              py="$RUNNER_TEMP/env-$role/bin/python"; output="$GITHUB_WORKSPACE/results/$role-$mode"; mkdir "$output"
              cd "$GITHUB_WORKSPACE/snapshots/$role"
              "$py" tools/ci_measurement_artifacts.py verify --wheel-dir build/prepared/wheels --artifact build/prepared/preparation/measurement.json 2>&1 | tee "$output/identity-before.log" || { overall=1; continue; }
              status=0
              "$py" "$GITHUB_WORKSPACE/controller/tools/colocalization_reference_diagnostic.py" --root "$PWD" --role "$role" --output "$output/raw" 2>&1 | tee "$output/diagnostic.log" || status=$?
              echo "$status" > "$output/diagnostic-exit.txt"
              "$py" tools/ci_measurement_artifacts.py verify --wheel-dir build/prepared/wheels --artifact build/prepared/preparation/measurement.json 2>&1 | tee "$output/identity-after.log" || overall=1
              if [ "$status" -ne 0 ]; then overall=1; fi
            done
          done
          exit "$overall"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colocalization-reference-diagnostic-minimum
          path: results/
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error
