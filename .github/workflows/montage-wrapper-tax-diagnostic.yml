name: montage-wrapper-tax-diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  OMP_WAIT_POLICY: PASSIVE
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONNOUSERSITE: '1'
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  GH_TOKEN: ${{ github.token }}
jobs:
  prepare-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      binary_sha256: ${{ steps.pin.outputs.binary_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
      - uses: actions/checkout@v4
        with:
          ref: 61b4f79821b0c7fd0d224e2a12d4263d14308cb7
          path: product
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - name: Authenticate the existing genuine producer and retain its exact artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir bundle
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          base='repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/'
          def api(path):return json.loads(subprocess.check_output(['gh','api',base+path]))
          run=api('runs/40766081804')
          assert run['head_sha']=='61b4f79821b0c7fd0d224e2a12d4263d14308cb7'
          assert run['head_repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          assert run['path']=='.github/workflows/ci.yml' and run['status']=='completed' and run['conclusion']=='success'
          jobs=api('runs/40766081804/jobs?per_page=100')['jobs']
          measure=[j for j in jobs if j['name']=='measure-minimum'];assert len(measure)==1 and measure[0]['conclusion']=='success'
          timings=[s for s in measure[0]['steps']if s['name'].startswith('Run python benchmarks/')]
          assert len(timings)==27 and all(s['conclusion']=='skipped'for s in timings)
          listing=api('runs/40766081804/artifacts?per_page=100')
          assert listing['total_count']==len(listing['artifacts'])
          selected=[a for a in listing['artifacts']if a['name']=='ci-performance-minimum'];assert len(selected)==1
          item=selected[0];assert item['id']==12849749460 and not item['expired']
          assert item['workflow_run']['head_sha']==run['head_sha'] and item['workflow_run']['id']==40766081804
          assert item['digest']=='sha256:c4420f7d4e95d4cb85ffcbd66e24ac7ee8c0f5684b8619b061663a2b98697989'
          data=subprocess.check_output(['gh','api',base+'artifacts/12849749460/zip'])
          assert len(data)==item['size_in_bytes']==84885842
          assert hashlib.sha256(data).hexdigest()==item['digest'].removeprefix('sha256:')
          Path('bundle/candidate.zip').write_bytes(data)
          Path('bundle/producer-selection.json').write_text(json.dumps(item,indent=2)+'\n')
          PY
      - name: Verify source, wheels, SDK and every retained parity XML before adapter preparation
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,stat,zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path,PurePosixPath
          with zipfile.ZipFile('bundle/candidate.zip')as z:
              names=z.namelist();assert len(names)==len(set(names))==92
              assert sum(i.file_size for i in z.infolist())<2*1024**3
              for i in z.infolist():
                  p=PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..'not in p.parts and '\\'not in i.filename and not stat.S_ISLNK(i.external_attr>>16)
              z.extractall('product/build')
          prepared=Path('product/build/prepared');m=json.loads((prepared/'ci-artifacts/measurement.json').read_bytes())
          assert m['schema']=='ci-offline-measurement-v1' and m['source']['revision']=='61b4f79821b0c7fd0d224e2a12d4263d14308cb7'
          for name,pin in m['source']['files_sha256'].items():assert hashlib.sha256(Path('product',name).read_bytes().replace(b'\r\n',b'\n')).hexdigest()==pin,name
          assert len(m['wheels'])==14 and len(m['runtime']['sdk_sha256'])==81
          products=[name for name,v in m['wheels'].items()if v['name']=='scikit-imagexx'];assert len(products)==1
          for name,v in m['wheels'].items():assert hashlib.sha256((prepared/'wheels'/name).read_bytes()).hexdigest()==v['sha256']
          with zipfile.ZipFile(prepared/'wheels'/products[0])as w:
              assert len([n for n in w.namelist()if not n.endswith('/')])==172
              core=[n for n in w.namelist()if n.startswith('skimagexx/_core.')and n.endswith('.so')];assert len(core)==1
              assert hashlib.sha256(w.read(core[0])).hexdigest()=='4ae7f9622f3e702d0aa18e1342a67d0bddd4648d4cd1c046d8c70c039a257dc7'
          expected={'block-reduce-normal.xml': 145, 'block-reduce-integer-width.xml': 9, 'block-reduce-scalar.xml': 145, 'blur-effect-intake.xml': 4, 'blur-effect-normal.xml': 121, 'blur-effect-scalar.xml': 121, 'butterworth-normal.xml': 175, 'butterworth-scalar.xml': 175, 'color-transforms-regression-normal.xml': 1848, 'color-transforms-regression-scalar.xml': 1848, 'compare-images-normal.xml': 109, 'compare-images-scalar.xml': 109, 'euler-number-intake.xml': 4, 'euler-number-normal.xml': 91, 'euler-number-scalar.xml': 91, 'immutable-bytes-normal.xml': 134, 'immutable-bytes-scalar.xml': 134, 'inertia-eigvals-normal.xml': 69, 'inertia-eigvals-scalar.xml': 69, 'inertia-tensor-normal.xml': 115, 'inertia-tensor-scalar.xml': 115, 'label-points-normal.xml': 99, 'label-points-pipeline-normal.xml': 100, 'label-points-pipeline-scalar.xml': 100, 'label-points-scalar.xml': 99, 'level-set-normal.xml': 161, 'level-set-pipeline-normal.xml': 163, 'level-set-pipeline-scalar.xml': 163, 'level-set-scalar.xml': 161, 'lpi-scalar.xml': 161, 'lpi-normal.xml': 161, 'map-array-normal.xml': 103, 'map-array-pipeline-normal.xml': 103, 'map-array-pipeline-scalar.xml': 103, 'map-array-scalar.xml': 103, 'mesh-surface-area-normal.xml': 89, 'mesh-surface-area-scalar.xml': 89, 'moments-coords-normal.xml': 98, 'moments-coords-scalar.xml': 98, 'moments-derived-normal.xml': 155, 'moments-derived-scalar.xml': 155, 'moments-normal.xml': 203, 'moments-scalar.xml': 203, 'montage-normal.xml': 322, 'montage-scalar.xml': 322, 'normalized-layouts-normal.xml': 22, 'normalized-layouts-scalar.xml': 22, 'perimeter-crofton-normal.xml': 101, 'perimeter-crofton-scalar.xml': 101, 'perimeter-normal.xml': 111, 'perimeter-scalar.xml': 111, 'polygon-intake.xml': 4, 'polygon-normal.xml': 86, 'polygon-scalar.xml': 86, 'profile-coordinates-normal.xml': 51, 'profile-coordinates-scalar.xml': 51, 'profile-line-normal.xml': 93, 'profile-line-scalar.xml': 93, 'regular-seeds-normal.xml': 109, 'regular-seeds-pipeline-normal.xml': 109, 'regular-seeds-pipeline-scalar.xml': 109, 'regular-seeds-scalar.xml': 109, 'rgb2yuv-storage-normal.xml': 37, 'rgb2yuv-storage-scalar.xml': 37, 'rolling-ball-kernels-normal.xml': 230, 'rolling-ball-kernels-scalar.xml': 230, 'shannon-entropy-normal.xml': 61, 'shannon-entropy-scalar.xml': 61, 'unique-rows-normal.xml': 107, 'unique-rows-pipeline-normal.xml': 107, 'unique-rows-pipeline-scalar.xml': 107, 'unique-rows-scalar.xml': 107, 'window-normal.xml': 179, 'window-scalar.xml': 179}
          assert {p.name for p in (prepared/'ci-artifacts').glob('*.xml')}==set(expected)
          for name,count in expected.items():
              tree=ET.fromstring((prepared/'ci-artifacts'/name).read_bytes())
              assert len(tree.findall('.//testcase'))==count
              assert not any(tree.findall('.//'+tag)for tag in ('failure','error','skipped'))
          smoke=json.loads((prepared/'ci-artifacts/feature-smoke.json').read_bytes())
          assert smoke['status']=='passed' and smoke['exit_code']==0 and smoke['outcomes']=={'passed':1443} and len(smoke['results'])==1443
          assert smoke['implementations']['native-partial']==245 and smoke['implementations']['metadata']==3
          PY
      - name: Install the frozen runtime offline and compile only the adapter TU
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/runtime"
          py="$RUNNER_TEMP/runtime/bin/python"
          "$py" -m pip install --no-index --no-deps --only-binary=:all: --require-hashes --find-links product/build/prepared/wheels -r product/build/prepared/ci-artifacts/runtime-lock.txt > bundle/install.log 2>&1
          "$py" product/tools/ci_measurement_artifacts.py verify --wheel-dir product/build/prepared/wheels --artifact product/build/prepared/ci-artifacts/measurement.json > bundle/identity-before.log
          "$py" - <<'PY'
          import hashlib,json,subprocess,sys,sysconfig
          from pathlib import Path
          code=Path('controller/tools/diagnostics/montage_wrapper_tax');c=json.loads((code/'diagnostic-contract.json').read_bytes())
          for name,key in [('adapter.cpp','adapter_sha256'),('run_diagnostic.py','runner_sha256')]:assert hashlib.sha256((code/name).read_bytes()).hexdigest()==c[key]
          assert sys.version.startswith('3.11.17 ')
          binary=Path('bundle')/('_montage_diagnostic'+sysconfig.get_config_var('EXT_SUFFIX'))
          argv=['g++','-std=c++17','-O3','-fPIC','-shared','-I'+sysconfig.get_path('include'),'-I'+str(Path(sysconfig.get_path('purelib'))/'include'),str(code/'adapter.cpp'),'-o',str(binary),'-ldl']
          Path('bundle/compile-command.json').write_text(json.dumps(argv,indent=2)+'\n')
          with Path('bundle/compile.log').open('w')as log:subprocess.run(argv,stdout=log,stderr=subprocess.STDOUT,check=True)
          Path('bundle/adapter-pin.json').write_text(json.dumps(dict(binary=binary.name,sha256=hashlib.sha256(binary.read_bytes()).hexdigest(),contract_sha256=hashlib.sha256((code/'diagnostic-contract.json').read_bytes()).hexdigest(),python=sys.version),indent=2)+'\n')
          PY
          PYTHONPATH="$GITHUB_WORKSPACE/bundle" "$py" controller/tools/diagnostics/montage_wrapper_tax/run_diagnostic.py --source-root product --preflight-only --output bundle/preflight.json
          "$py" product/tools/ci_measurement_artifacts.py verify --wheel-dir product/build/prepared/wheels --artifact product/build/prepared/ci-artifacts/measurement.json > bundle/identity-after.log
          cmp bundle/identity-before.log bundle/identity-after.log
      - id: pin
        shell: bash
        run: echo "binary_sha256=$(python -c 'import json;print(json.load(open("bundle/adapter-pin.json"))["sha256"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: montage-wrapper-tax-prepared-adapter
          path: bundle/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: montage-wrapper-tax-preparation-logs
          path: |
            bundle/*.log
            bundle/*.json
          if-no-files-found: warn
  diagnose:
    needs: prepare-adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
      - uses: actions/checkout@v4
        with:
          ref: 61b4f79821b0c7fd0d224e2a12d4263d14308cb7
          path: product
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - name: Authenticate the prebuilt adapter artifact and the unchanged genuine core
        shell: bash
        env:
          ADAPTER_ID: ${{ needs.prepare-adapter.outputs.artifact_id }}
          ADAPTER_DIGEST: ${{ needs.prepare-adapter.outputs.artifact_digest }}
          ADAPTER_BINARY_SHA: ${{ needs.prepare-adapter.outputs.binary_sha256 }}
        run: |
          set -euo pipefail
          mkdir results bundle
          python - <<'PY'
          import hashlib,json,os,stat,subprocess,zipfile,io
          from pathlib import Path,PurePosixPath
          base='repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/artifacts/'+os.environ['ADAPTER_ID']
          item=json.loads(subprocess.check_output(['gh','api',base]))
          assert item['name']=='montage-wrapper-tax-prepared-adapter' and not item['expired']
          assert item['workflow_run']['id']==int(os.environ['GITHUB_RUN_ID']) and item['workflow_run']['head_sha']==os.environ['GITHUB_SHA']
          expected=os.environ['ADAPTER_DIGEST'].removeprefix('sha256:')
          data=subprocess.check_output(['gh','api',base+'/zip'])
          assert hashlib.sha256(data).hexdigest()==expected and item['digest']=='sha256:'+expected and len(data)==item['size_in_bytes']
          Path('results/adapter-artifact-selection.json').write_text(json.dumps(item,indent=2)+'\n')
          with zipfile.ZipFile(io.BytesIO(data))as z:
              assert len(z.namelist())==len(set(z.namelist()))
              for i in z.infolist():
                  p=PurePosixPath(i.filename);assert not p.is_absolute()and '..'not in p.parts and '\\'not in i.filename and not stat.S_ISLNK(i.external_attr>>16)
              z.extractall('bundle')
          pin=json.loads(Path('bundle/adapter-pin.json').read_bytes());code=Path('controller/tools/diagnostics/montage_wrapper_tax')
          assert pin['sha256']==os.environ['ADAPTER_BINARY_SHA']==hashlib.sha256(Path('bundle',pin['binary']).read_bytes()).hexdigest()
          assert pin['contract_sha256']==hashlib.sha256((code/'diagnostic-contract.json').read_bytes()).hexdigest()
          preflight=json.loads(Path('bundle/preflight.json').read_bytes())
          assert preflight['status']=='PREFLIGHT_ONLY_PASS' and preflight['case_count']==9 and preflight['oracle_route_checks']==18 and preflight['timing_calls']==0 and preflight['raw_sample_count']==0
          archive=Path('bundle/candidate.zip');assert hashlib.sha256(archive.read_bytes()).hexdigest()=='c4420f7d4e95d4cb85ffcbd66e24ac7ee8c0f5684b8619b061663a2b98697989'
          # This exact immutable producer ZIP was path-checked before the adapter upload.
          with zipfile.ZipFile(archive)as z:z.extractall('product/build')
          PY
          python -m venv "$RUNNER_TEMP/runtime"
          py="$RUNNER_TEMP/runtime/bin/python"
          "$py" -m pip install --no-index --no-deps --only-binary=:all: --require-hashes --find-links product/build/prepared/wheels -r product/build/prepared/ci-artifacts/runtime-lock.txt > results/install.log 2>&1
          "$py" product/tools/ci_measurement_artifacts.py verify --wheel-dir product/build/prepared/wheels --artifact product/build/prepared/ci-artifacts/measurement.json > results/identity-before.log
          cmp bundle/identity-before.log results/identity-before.log
          lscpu > results/cpu.txt
          uname -a > results/platform.txt
      - name: Run oracle preflight then the fixed paired diagnostic without builds or tests
        shell: bash
        run: |
          set -euo pipefail
          py="$RUNNER_TEMP/runtime/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/bundle"
          "$py" controller/tools/diagnostics/montage_wrapper_tax/run_diagnostic.py --source-root product --preflight-only --output results/preflight.json
          status=0
          "$py" controller/tools/diagnostics/montage_wrapper_tax/run_diagnostic.py --source-root product --authorize-diagnostic-timing --output results/diagnostic.json > results/diagnostic.log 2>&1 || status=$?
          echo "$status" > results/diagnostic-exit.txt
          "$py" product/tools/ci_measurement_artifacts.py verify --wheel-dir product/build/prepared/wheels --artifact product/build/prepared/ci-artifacts/measurement.json > results/identity-after.log
          cmp results/identity-before.log results/identity-after.log
          test "$status" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: montage-wrapper-tax-diagnostic-raw
          path: results/
          if-no-files-found: warn
