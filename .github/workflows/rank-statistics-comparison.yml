name: rank-statistics-comparison
on:
  workflow_dispatch:
    inputs:
      experiment_run:
        description: Run containing root-sealed immutable external experiment config
        type: string
        required: true
      experiment_artifact:
        description: Immutable experiment artifact containing experiment.json
        type: string
        default: rank-statistics-experiment
      experiment_sha256:
        description: Independently reviewed raw SHA256 of experiment.json
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: windows
            os: windows-latest
            python: '3.13'
          - profile: modern
            os: ubuntu-latest
            python: '3.13'
          - profile: minimum
            os: ubuntu-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.experiment_run }}
          name: ${{ inputs.experiment_artifact }}
          path: build/experiment
      - name: Authenticate external config and derive exact qualified run/artifact selectors
        id: experiment
        shell: bash
        run: |
          python benchmarks/rank_statistics_compare.py selectors --profile ${{ matrix.profile }} --experiment build/experiment/experiment.json --experiment-sha256 '${{ inputs.experiment_sha256 }}' >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.experiment.outputs.before_run }}
          name: ${{ steps.experiment.outputs.before_artifact }}
          path: build/prepared/before
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.experiment.outputs.after_run }}
          name: ${{ steps.experiment.outputs.after_artifact }}
          path: build/prepared/after
      - name: Authenticate accepted public sources and complete artifacts before fixtures
        shell: bash
        run: |
          python benchmarks/rank_statistics_compare.py verify-product --role before --profile ${{ matrix.profile }} --product build/prepared/before --experiment build/experiment/experiment.json --experiment-sha256 '${{ inputs.experiment_sha256 }}'
          python benchmarks/rank_statistics_compare.py verify-product --role after --profile ${{ matrix.profile }} --product build/prepared/after --experiment build/experiment/experiment.json --experiment-sha256 '${{ inputs.experiment_sha256 }}'
      - name: Install exact offline products into separate ordinary-name prefixes
        shell: bash
        run: |
          python -m venv build/before-env
          python -m venv build/after-env
          if [ "$RUNNER_OS" = Windows ]; then PYSUB=Scripts/python.exe; else PYSUB=bin/python; fi
          build/before-env/$PYSUB -m pip install --no-index --no-deps --require-hashes --only-binary=:all: --no-compile --find-links build/prepared/before/wheels -r build/prepared/before/runtime-lock.txt
          build/after-env/$PYSUB -m pip install --no-index --no-deps --require-hashes --only-binary=:all: --no-compile --find-links build/prepared/after/wheels -r build/prepared/after/runtime-lock.txt
          printf 'BEFORE_PY=%s\nAFTER_PY=%s\n' "build/before-env/$PYSUB" "build/after-env/$PYSUB" >> "$GITHUB_ENV"
      - name: Mandatory1379 plus4alias parity workers1and4 normalandscalar
        shell: bash
        run: |
          python benchmarks/rank_statistics_compare.py compare --experiment build/experiment/experiment.json --experiment-sha256 '${{ inputs.experiment_sha256 }}' --check-only --profile ${{ matrix.profile }} --before build/prepared/before --after build/prepared/after --before-python "$BEFORE_PY" --after-python "$AFTER_PY" --output build/prepared/checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank-statistics-compare-prepared-${{ matrix.profile }}
          include-hidden-files: true
          retention-days: 90
          path: |
            build/prepared/before/
            build/prepared/after/
            build/prepared/checks/
      - uses: actions/upload-artifact@v4
        with:
          name: rank-statistics-compare-receipt-${{ matrix.profile }}
          retention-days: 90
          path: |
            build/prepared/checks/preparation.json
            build/prepared/checks/report.json
  barrier:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.experiment_run }}
          name: ${{ inputs.experiment_artifact }}
          path: build/experiment
      - uses: actions/download-artifact@v4
        with:
          pattern: rank-statistics-compare-receipt-*
          path: build/receipts
      - name: receipt_barrier rejects missing stale reused or reference-only receipts
        shell: bash
        run: |
          python benchmarks/rank_statistics_compare.py barrier --experiment build/experiment/experiment.json --experiment-sha256 '${{ inputs.experiment_sha256 }}' --receipts build/receipts/rank-statistics-compare-receipt-windows/preparation.json build/receipts/rank-statistics-compare-receipt-modern/preparation.json build/receipts/rank-statistics-compare-receipt-minimum/preparation.json
      - uses: actions/upload-artifact@v4
        with:
          name: rank-statistics-compare-barrier
          retention-days: 90
          path: build/receipts/
  measure:
    # Allthree preparation profiles and full receipt_barrier complete BEFORE
    # these fresh hosts exist. These hosts install only exact offline artifacts.
    needs: [prepare, barrier]
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: windows
            os: windows-latest
            python: '3.13'
          - profile: modern
            os: ubuntu-latest
            python: '3.13'
          - profile: minimum
            os: ubuntu-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.experiment_run }}
          name: ${{ inputs.experiment_artifact }}
          path: build/experiment
      - uses: actions/download-artifact@v4
        with:
          name: rank-statistics-compare-prepared-${{ matrix.profile }}
          path: build/prepared
      - uses: actions/download-artifact@v4
        with:
          name: rank-statistics-compare-barrier
          path: build/receipts
      - name: Install frozen artifacts only; no resolver builds or source overlays
        shell: bash
        run: |
          python -m venv build/before-env
          python -m venv build/after-env
          if [ "$RUNNER_OS" = Windows ]; then PYSUB=Scripts/python.exe; else PYSUB=bin/python; fi
          build/before-env/$PYSUB -m pip install --no-index --no-deps --require-hashes --only-binary=:all: --no-compile --find-links build/prepared/before/wheels -r build/prepared/before/runtime-lock.txt
          build/after-env/$PYSUB -m pip install --no-index --no-deps --require-hashes --only-binary=:all: --no-compile --find-links build/prepared/after/wheels -r build/prepared/after/runtime-lock.txt
          printf 'BEFORE_PY=%s\nAFTER_PY=%s\n' "build/before-env/$PYSUB" "build/after-env/$PYSUB" >> "$GITHUB_ENV"
      - name: Controlled one-worker sequential triads from exact independent products
        shell: bash
        run: |
          python benchmarks/rank_statistics_compare.py compare --experiment build/experiment/experiment.json --experiment-sha256 '${{ inputs.experiment_sha256 }}' --profile ${{ matrix.profile }} --before build/prepared/before --after build/prepared/after --before-python "$BEFORE_PY" --after-python "$AFTER_PY" --repeat 7 --receipts build/receipts/rank-statistics-compare-receipt-windows/preparation.json build/receipts/rank-statistics-compare-receipt-modern/preparation.json build/receipts/rank-statistics-compare-receipt-minimum/preparation.json --output build/results/rank-statistics-comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank-statistics-comparison-${{ matrix.profile }}
          include-hidden-files: true
          retention-days: 90
          path: |
            build/experiment/
            build/results/
            build/receipts/
            build/prepared/
