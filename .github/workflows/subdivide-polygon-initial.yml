name: subdivide-polygon-initial
on:
  workflow_dispatch:
    inputs:
      producer_run:
        type: string
        required: true
      producer_revision:
        type: string
        required: true
      artifact_id:
        type: string
        required: true
      artifact_sha256:
        type: string
        required: true
permissions:
  contents: read
  actions: read
env:
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  OMP_WAIT_POLICY: PASSIVE
  PYTHONOPTIMIZE: '0'
  PYTHONNOUSERSITE: '1'
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCER_RUN: ${{ inputs.producer_run }}
      PRODUCER_REVISION: ${{ inputs.producer_revision }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - name: Authenticate the exact successful producer
        shell: bash
        run: |
          set -euo pipefail
          mkdir results
          lscpu > results/cpu.txt
          uname -a > results/platform.txt
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          run, revision, artifact, digest = (os.environ[k] for k in ('PRODUCER_RUN', 'PRODUCER_REVISION', 'ARTIFACT_ID', 'ARTIFACT_SHA256'))
          assert re.fullmatch('[1-9][0-9]*', run) and re.fullmatch('[1-9][0-9]*', artifact)
          assert re.fullmatch('[0-9a-f]{40}', revision) and re.fullmatch('[0-9a-f]{64}', digest)
          base = 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/'
          def api(endpoint, name):
              raw = subprocess.check_output(['gh', 'api', base + endpoint])
              Path('results', name + '.json').write_bytes(raw)
              return json.loads(raw)
          record = api('runs/' + run, 'producer-run')
          assert str(record['id']) == run and record['head_sha'] == revision
          assert record['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert record['path'] == '.github/workflows/ci.yml'
          assert record['status'] == 'completed' and record['conclusion'] == 'success'
          listing = api('runs/' + run + '/artifacts?per_page=100', 'producer-artifacts')
          assert listing['total_count'] == len(listing['artifacts'])
          matches = [a for a in listing['artifacts'] if a['name'] == 'ci-performance-minimum']
          assert len(matches) == 1
          selected = matches[0]
          assert str(selected['id']) == artifact and selected['digest'] == 'sha256:' + digest
          assert not selected['expired'] and 0 < selected['size_in_bytes'] < 512 * 1024**2
          assert selected['workflow_run']['id'] == int(run) and selected['workflow_run']['head_sha'] == revision
          Path('results/selection.json').write_text(json.dumps(selected, indent=2) + '\n')
          jobs = api('runs/' + run + '/jobs?filter=latest&per_page=100', 'producer-jobs')
          assert jobs['total_count'] == len(jobs['jobs'])
          required = {name: [j for j in jobs['jobs'] if j['name'] == name] for name in ('numpy-minimum', 'measure-minimum')}
          assert all(len(values) == 1 and values[0]['conclusion'] == 'success' for values in required.values())
          timing = [step for step in required['measure-minimum'][0]['steps'] if step['name'].startswith('Run python benchmarks/')]
          assert len(timing) == 29 and all(step['conclusion'] == 'skipped' for step in timing)

          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.producer_revision }}
          path: snapshot
          fetch-depth: 1
      - name: Install the authenticated product offline
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/prepared.zip"
          python - <<'PY'
          import hashlib, json, os, re, runpy, stat, subprocess, zipfile
          from collections import Counter
          import xml.etree.ElementTree as ET
          from pathlib import Path, PurePosixPath
          selected = json.loads(Path('results/selection.json').read_bytes())
          archive = Path(os.environ['RUNNER_TEMP'], 'prepared.zip')
          actual = dict(bytes=archive.stat().st_size, sha256=hashlib.sha256(archive.read_bytes()).hexdigest())
          Path('results/archive.json').write_text(json.dumps(actual, indent=2) + '\n')
          assert actual['bytes'] == selected['size_in_bytes'] and actual['sha256'] == os.environ['ARTIFACT_SHA256']
          with zipfile.ZipFile(archive) as z:
              names = z.namelist(); assert len(names) == len(set(names))
              assert sum(i.file_size for i in z.infolist()) < 2 * 1024**3
              for i in z.infolist():
                  p = PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in i.filename
                  assert not stat.S_ISLNK(i.external_attr >> 16)
              z.extractall('snapshot/build')
          prepared = Path('snapshot/build/prepared/ci-artifacts')
          manifest = json.loads((prepared / 'measurement.json').read_bytes())
          assert manifest['schema'] == 'ci-offline-measurement-v1'
          Path('results/measurement.json').write_bytes((prepared / 'measurement.json').read_bytes())
          Path('results/runtime-lock.txt').write_bytes((prepared / 'runtime-lock.txt').read_bytes())
          assert manifest['source']['revision'] == os.environ['PRODUCER_REVISION']
          assert len(manifest['wheels']) == 14
          source_root = Path('snapshot')
          names = subprocess.check_output(['git', '-C', str(source_root), 'ls-files', '-z']).decode().split('\0')
          layout = runpy.run_path(str(source_root / 'tools/public_qualification.py'))['current_install_layout'](
              lambda name: (source_root / name).read_bytes(), [name for name in names if name], 'minimum')
          assert layout['product_count'] == 176 and layout['SDK_count'] == 83
          assert set(manifest['runtime']['sdk_sha256']) == set(layout['SDK_members'])
          products = [n for n, v in manifest['wheels'].items() if v['name'] == 'scikit-imagexx']
          assert len(products) == 1 and len(manifest['wheels']) - len(products) == 13
          wheel = products[0]
          with zipfile.ZipFile(Path('snapshot/build/prepared/wheels', wheel)) as z:
              members = {n for n in z.namelist() if not n.endswith('/')}
              cores = {n for n in members if n.startswith('skimagexx/_core.') and n.endswith('.so')}
              assert len(cores) == 1 and members == set(layout['members_without_core']) | cores
              assert len(members) == layout['product_count']
          inventory = json.loads(Path('snapshot/coverage/api.json').read_bytes())['entries']
          assert sum(e['implementation'] == 'native-partial' for e in inventory) == 247
          assert sum(e['implementation'] == 'metadata' for e in inventory) == 3
          frozen_cases = json.loads(Path('snapshot/coverage/contracts/subdivide-polygon.json').read_bytes())['cases']
          factory_cases = runpy.run_path('snapshot/tests/subdivide_polygon_contract.py')['cases']()
          assert [c['id'] for c in factory_cases] == [c['id'] for c in frozen_cases]
          assert len(factory_cases) == 60
          # The frozen reference pre-capture fixtures are intentionally not runtime selectors.
          expected_files = {'test_subdivide_polygon_integration': len(factory_cases) * 2 + 23,
                            'test_subdivide_polygon_pipeline': len(factory_cases) * 2 + 16}
          for name in ('subdivide-polygon-normal.xml', 'subdivide-polygon-scalar.xml'):
              tree = ET.fromstring((prepared / name).read_bytes())
              cases = tree.findall('.//testcase')
              assert len(cases) == sum(expected_files.values()) == 279
              actual_files = Counter(case.attrib['classname'].rsplit('.', 1)[-1] for case in cases)
              assert dict(actual_files) == expected_files
              assert not any(tree.findall('.//' + tag) for tag in ('failure', 'error', 'skipped'))
          minimum_source = Path('snapshot/.github/workflows/ci.yml').read_text().split('  numpy-minimum:', 1)[1].split('  measure:', 1)[0]
          xml_names = re.findall(r'--junitxml=build/ci-artifacts/([^ ]+-(?:normal|scalar)\.xml)', minimum_source)
          focused_names = [name for name in xml_names if not name.startswith('color-transforms-regression-')]
          assert len(focused_names) == len(set(focused_names)) and len(focused_names) > 0
          focused_count = 0
          for name in focused_names:
              tree = ET.fromstring((prepared / name).read_bytes())
              assert not any(tree.findall('.//' + tag) for tag in ('failure', 'error', 'skipped'))
              focused_count += len(tree.findall('.//testcase'))
          assert focused_count == 9346
          smoke = json.loads((prepared / 'feature-smoke.json').read_bytes())
          assert smoke['status'] == 'passed' and smoke['exit_code'] == 0
          assert set(smoke['outcomes']) == {'passed'}
          assert smoke['implementations']['native-partial'] == 247 and smoke['implementations']['metadata'] == 3
          assert smoke['outcomes']['passed'] == len(smoke['results']) == 1447
          for name, expected in (('benchmarks/subdivide_polygon.py', '101265e40bdd2c7026cdbb396f9670e2c07d5e32502be55de2411eea623faa38'), ('coverage/contracts/subdivide-polygon-benchmark.json', '2cdfe4191810ee7ae2de72a11fc921ced6edec72cb5ac282bdc4ae32780dd8da')):
              assert manifest['source']['files_sha256'][name] == expected
              assert hashlib.sha256(Path('snapshot', name).read_bytes().replace(b'\r\n', b'\n')).hexdigest() == expected
          PY
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/bin/python" -m pip install --no-index --no-deps --only-binary=:all: --require-hashes --find-links snapshot/build/prepared/wheels -r snapshot/build/prepared/ci-artifacts/runtime-lock.txt 2>&1 | tee results/offline-install.log
          "$RUNNER_TEMP/runtime/bin/python" snapshot/tools/ci_measurement_artifacts.py verify --wheel-dir snapshot/build/prepared/wheels --artifact snapshot/build/prepared/ci-artifacts/measurement.json 2>&1 | tee results/original-identity.log
      - name: Measure fourteen unchanged subdivision public calls
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME SKIMAGEXX_DISABLE_SIMD
          output="$GITHUB_WORKSPACE/results"
          cd snapshot
          py="$RUNNER_TEMP/runtime/bin/python"
          "$py" tools/ci_measurement_artifacts.py verify --wheel-dir build/prepared/wheels --artifact build/prepared/ci-artifacts/measurement.json 2>&1 | tee "$output/identity-before.log"
          cat > "$output/launch.py" <<'PY'
          import hashlib,json,runpy,sys,traceback,os
          from pathlib import Path
          source,output=map(lambda x:Path(x).resolve(),sys.argv[1:])
          manifest=json.loads((source/'build/prepared/ci-artifacts/measurement.json').read_bytes())
          contract_path=source/'coverage/contracts/subdivide-polygon-benchmark.json'
          contract=json.loads(contract_path.read_bytes());case_ids=[x['case_id']for x in contract['cases']]
          assert len(case_ids)==14
          initial=dict(status='STARTED',pid=os.getpid(),source_revision=manifest['source']['revision'],contract_sha256=hashlib.sha256(contract_path.read_bytes()).hexdigest())
          (output/'process-before.json').write_text(json.dumps(initial,indent=2)+'\n')
          completed=0;failure=None
          try:
              sys.path.insert(0,str(source/'benchmarks'))
              import run
              assert hashlib.sha256(Path(run.__file__).read_bytes().replace(b'\r\n',b'\n')).hexdigest()==manifest['source']['files_sha256']['benchmarks/run.py']
              delegate=run.measure
              def retain_measure(*args,**kwargs):
                  global completed
                  assert len(args)==4 and args[2:]==(7,19) and not kwargs
                  result=delegate(*args,**kwargs)
                  with(output/'returned-measures.jsonl').open('a')as stream:
                      stream.write(json.dumps(dict(case_index=completed,case_id=case_ids[completed],status='PENDING_FINAL_HARNESS_VALIDATION',timing=result))+'\n');stream.flush()
                  completed+=1
                  return result
              run.measure=retain_measure
              sys.argv=[str(source/'benchmarks/subdivide_polygon.py'),'--threads','1','--repeat','7','--output',str(output/'subdivide-polygon.json')]
              runpy.run_path(sys.argv[0],run_name='__main__')
              assert completed==14
          except BaseException as error:
              failure=dict(type=type(error).__name__,text=str(error),traceback=traceback.format_exc())
              raise
          finally:
              final=dict(initial,status='FAILED'if failure else'COMPLETE',completed_measures=completed,failure=failure,report_exists=(output/'subdivide-polygon.json').is_file(),unreturned_measure_samples='Unavailable if current measure fails; all previously returned timing dictionaries retained')
              (output/'process-after.json').write_text(json.dumps(final,indent=2)+'\n')
          PY
          status=0
          "$py" "$output/launch.py" "$PWD" "$output" 2>&1 | tee "$output/subdivide-polygon.log" || status=$?
          echo "$status" > "$output/benchmark-exit.txt"
          "$py" tools/ci_measurement_artifacts.py verify --wheel-dir build/prepared/wheels --artifact build/prepared/ci-artifacts/measurement.json 2>&1 | tee "$output/identity-after.log"
          test "$status" -eq 0
      - name: Retain every result and loss
        shell: bash
        run: |
          python - <<'PY'
          import ast, hashlib, json, math, os, runpy, statistics, struct
          from pathlib import Path
          def validate_report(report, contract, manifest, expected_source, pure, frozen_masks):
              meta = report['metadata']
              assert meta['source_before'] == expected_source
              assert {k: meta[k] for k in expected_source} == expected_source
              assert meta['threads'] == 1 and meta['repeat'] == 7 and meta['target_ms'] == 19 and meta['raw_samples'] == 196
              assert meta['reference_pool_limits'] == {key: '1' for key in ('OPENBLAS_NUM_THREADS', 'MKL_NUM_THREADS', 'OMP_NUM_THREADS', 'BLIS_NUM_THREADS')}
              assert meta['python'] == manifest['runtime']['python']
              assert (meta['numpy'], meta['scipy'], meta['reference']) == ('1.24.4', '1.15.3', '0.26.0')
              assert meta['provider_frontier'] == contract['provider_frontier'] + ' ' + contract['timed_boundary'] and meta['fallback_enabled'] is False
              assert meta['selected_apis'] == contract['apis']
              assert set(meta['numpy_error_policy']) == {'divide', 'over', 'under', 'invalid'}
              assert set(meta['numpy_error_policy'].values()) <= {'ignore', 'warn', 'raise', 'call', 'print', 'log'}
              assert meta['numpy_error_handler_type'] == 'NoneType'
              assert type(meta['numpy_buffer_elements']) is int and meta['numpy_buffer_elements'] > 0
              assert meta['harness_sha256'] == manifest['source']['files_sha256']['benchmarks/subdivide_polygon.py']
              assert meta['original_source_sha256'] == contract['original_python_source_sha256']
              cores = {v for k, v in manifest['runtime']['packages_sha256']['skimagexx'].items() if k.startswith('_core.') and k.endswith('.so')}
              assert cores == {meta['core_sha256']}
              assert len(report['results']) == len(contract['cases']) == 14
              samples = 0
              for row, spec in zip(report['results'], contract['cases']):
                  assert {k: row[k] for k in spec} == spec
                  assert row['threads'] == 1 and row['native_accepted'] is True and row['backend'] == 'native'
                  entry = 'subdivide_polygon_apply'
                  assert spec['api'] == 'measure.subdivide_polygon'
                  assert row['actual_C_returns'] == [entry] and row['native_entry_module'] == 'skimagexx._core'
                  assert row['max_abs_error'] == 0 and row['output_sha256'] == row['reference_sha256'] == row['oracle_sha256']
                  count, degree = spec['points'], spec['degree']
                  assert 1 <= degree <= 7 and 2 <= count <= contract['max_points']
                  assert type(spec['closed']) is bool and type(spec['preserve_ends']) is bool
                  assert count == spec['base_points'] + int(spec['closed'])
                  even, odd = pure['integer_masks'](degree)
                  assert [even, odd] == frozen_masks[str(degree)]
                  assert sum(even) == sum(odd) == 1 << degree
                  values = pure['points'](spec)
                  assert len(values) == count and (values[0] == values[-1]) == spec['closed']
                  oracle = pure['subdivision_oracle'](values, degree, spec['preserve_ends'])
                  output_count = 2 * (spec['base_points'] if spec['closed'] else spec['base_points'] - (degree + 1) // 2)
                  output_count += 1 if spec['closed'] else 2 if spec['preserve_ends'] else 0
                  assert len(oracle) == output_count and spec['expected_output_shape'] == [output_count, 2]
                  expected_hash = hashlib.sha256(b''.join(struct.pack('<dd', *point) for point in oracle)).hexdigest()
                  assert row['oracle_sha256'] == expected_hash
                  expected_input_hash = hashlib.sha256(b''.join(struct.pack('<dd', *point) for point in values)).hexdigest()
                  assert row['input_sha256'] == expected_input_hash
                  layout = spec['layout']
                  strides, own, c, f, base = {
                      'C': ([16, 8], True, True, False, 'NoneType'),
                      'F': ([8, count*8], True, False, True, 'NoneType'),
                      'reverse-rows': ([-16, 8], False, False, False, 'ndarray'),
                      'step-rows': ([32, 8], False, False, False, 'ndarray'),
                      'step-columns': ([32, 16], False, False, False, 'ndarray')}[layout]
                  assert row['input_metadata'] == dict(dtype='<f8', dtype_metadata=None, shape=[count, 2],
                      strides=strides, own=own, writeable=True, c=c, f=f, base_type=base)
                  assert count*(4 if layout in ('step-rows', 'step-columns') else 2) <= contract['max_backing_elements']
                  descriptor = row['output_metadata']
                  shape = descriptor['shape']
                  assert shape == spec['expected_output_shape']
                  assert descriptor == dict(dtype='<f8', dtype_metadata=None, shape=shape, strides=[16, 8],
                      own=True, writeable=True, c=True, f=False, base_type='NoneType')
                  assert list(map(len, row['samples_ms'])) == [7, 7]
                  assert all(math.isfinite(v) and v > 0 for part in row['samples_ms'] for v in part)
                  assert all(isinstance(v, int) and v > 0 for v in row['loops']) and len(row['loops']) == 2
                  assert row['reference_ms'] == statistics.median(row['samples_ms'][0])
                  assert row['cpp_ms'] == statistics.median(row['samples_ms'][1])
                  assert row['speedup'] == row['reference_ms'] / row['cpp_ms']
                  samples += sum(map(len, row['samples_ms']))
              assert samples == 196
              return dict(status='validated', raw_samples=samples, geometric_mean=math.exp(statistics.mean(math.log(x['speedup']) for x in report['results'])),
                  wins=[x['case_id'] for x in report['results'] if x['speedup'] > 1], losses=[x['case_id'] for x in report['results'] if x['speedup'] < 1],
                  scope='Initial original/current comparison only; every loss retained, no prior-C++ gain or full qualification claim.')
          report = json.loads(Path('results/subdivide-polygon.json').read_bytes())
          before = json.loads(Path('results/process-before.json').read_bytes())
          after = json.loads(Path('results/process-after.json').read_bytes())
          assert before['status'] == 'STARTED' and after['status'] == 'COMPLETE' and after['failure'] is None
          assert before['pid'] == after['pid'] and after['completed_measures'] == 14 and after['report_exists'] is True
          journal = [json.loads(line) for line in Path('results/returned-measures.jsonl').read_text().splitlines()]
          assert len(journal) == len(report['results']) == 14
          for index, (item, row) in enumerate(zip(journal, report['results'])):
              assert item['case_index'] == index and item['case_id'] == row['case_id'] and item['status'] == 'PENDING_FINAL_HARNESS_VALIDATION'
              assert set(item['timing']) == {'reference_ms','cpp_ms','speedup','samples_ms','loops','sample_labels'}
              assert all(row[key] == value for key, value in item['timing'].items())
          contract_path = Path('snapshot/coverage/contracts/subdivide-polygon-benchmark.json')
          assert before['source_revision'] == after['source_revision'] == os.environ['PRODUCER_REVISION']
          assert before['contract_sha256'] == after['contract_sha256'] == hashlib.sha256(contract_path.read_bytes()).hexdigest()
          assert report['metadata']['contract_sha256'] == hashlib.sha256(contract_path.read_bytes()).hexdigest()
          expected_source = runpy.run_path('snapshot/benchmarks/provenance.py')['source_fingerprint'](Path('snapshot'))
          # Load only already-frozen pure stdlib functions; importing main is unnecessary.
          tree = ast.parse(Path('snapshot/benchmarks/subdivide_polygon.py').read_text())
          helpers = [node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name in ('integer_masks', 'points', 'subdivision_oracle')]
          assert len(helpers) == 3
          pure = {'math': math}
          exec(compile(ast.Module(body=helpers, type_ignores=[]), 'frozen-pure-subdivision-oracle', 'exec'), pure)
          masks = json.loads(Path('snapshot/coverage/contracts/subdivide-polygon.json').read_bytes())['subdivision_masks']
          contract = json.loads(contract_path.read_bytes())
          assert {(row['degree'], row['closed']) for row in contract['cases']} == {(degree, closed) for degree in range(1, 8) for closed in (False, True)}
          summary = validate_report(report, contract, json.loads(Path('snapshot/build/prepared/ci-artifacts/measurement.json').read_bytes()), expected_source, pure, masks)
          Path('results/summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subdivide-polygon-initial-minimum
          path: results/
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error
