name: component-consumers-benchmark
on:
  workflow_dispatch:
    inputs:
      workers:
        description: Optional global native workers (worker1 is primary)
        type: choice
        options: ['1', '1 4']
        default: '1'
permissions:
  contents: read
jobs:
  prepare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: modern
            python: '3.13'
            numpy: '2.5.4'
            scipy: '1.18.1'
          - os: ubuntu-latest
            runtime: modern
            python: '3.13'
            numpy: '2.5.4'
            scipy: '1.18.1'
          - os: ubuntu-latest
            runtime: minimum
            python: '3.11'
            numpy: '1.24.4'
            scipy: '1.15.3'
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
      CONSUMER_WORKERS: ${{ inputs.workers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build exact complete public wheel
        shell: bash
        run: |
          mkdir -p build/preparation
          python -m pip wheel . --no-deps --wheel-dir build/capsule/wheels --verbose 2>&1 | tee build/preparation/build.log
          python -m pip install numpy==${{ matrix.numpy }} scipy==${{ matrix.scipy }} scikit-image==0.26.0 pytest
          python -m pip install --no-deps build/capsule/wheels/*.whl
      - name: Public consumer and returned-class correctness
        run: >-
          python -m pytest -q tests/test_component_consumers_public.py tests/test_component_consumers_pipeline.py
          tests/test_component_consumers_benchmark.py tests/test_ci_measurement_isolation.py
      - name: Scalar public correctness
        run: python -m pytest -q tests/test_component_consumers_public.py tests/test_component_consumers_pipeline.py
        env:
          SKIMAGEXX_DISABLE_SIMD: '1'
      - name: Freeze complete offline runtime wheelhouse
        shell: bash
        run: |
          python -m pip freeze > build/capsule/runtime-freeze.txt
          python -m pip wheel --find-links build/capsule/wheels --wheel-dir build/capsule/wheels -r build/capsule/runtime-freeze.txt
      - name: Seal current source, complete package, SDK, corpus and runtime; check every case
        shell: bash
        run: python benchmarks/component_consumers.py --capsule build/capsule --prepare-capsule --check-only --threads $CONSUMER_WORKERS --output build/preparation/consumer-check.json
      - name: Check scalar paths on the same immutable package
        shell: bash
        run: python benchmarks/component_consumers.py --capsule build/capsule --check-only --threads $CONSUMER_WORKERS --output build/preparation/consumer-scalar-check.json
        env:
          SKIMAGEXX_DISABLE_SIMD: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-prepared-${{ matrix.os }}-${{ matrix.runtime }}
          include-hidden-files: true
          retention-days: 90
          path: |
            build/capsule/
            build/preparation/
  measure:
    # All3 correctness/preparation jobs complete before fresh measurement VMs.
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: modern
            python: '3.13'
          - os: ubuntu-latest
            runtime: modern
            python: '3.13'
          - os: ubuntu-latest
            runtime: minimum
            python: '3.11'
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
      CONSUMER_WORKERS: ${{ inputs.workers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: consumer-prepared-${{ matrix.os }}-${{ matrix.runtime }}
          path: build/prepared
      - name: Install only exact prepared runtime/product wheels
        shell: bash
        run: |
          python -m pip install --no-index --no-deps --require-hashes --find-links build/prepared/capsule/wheels -r build/prepared/capsule/runtime-lock.txt
      - name: Preflight full fixed corpus before paired one-worker-primary samples
        shell: bash
        run: python benchmarks/component_consumers.py --capsule build/prepared/capsule --threads $CONSUMER_WORKERS --repeat 7 --output build/results/component-consumers-performance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-performance-${{ matrix.os }}-${{ matrix.runtime }}
          include-hidden-files: true
          retention-days: 90
          path: |
            build/results/
            build/prepared/capsule/
            build/prepared/preparation/
