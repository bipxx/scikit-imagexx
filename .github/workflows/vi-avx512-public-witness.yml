name: vi-avx512-public-witness
on:
  workflow_dispatch:
    inputs:
      diagnostic_authority:
        description: Root grants one default public pair and an optional conditional disabled control; zero timing
        type: choice
        required: true
        default: UNBOUND
        options:
          - UNBOUND
          - ROOT_AUTHORIZED_CONTROLLED_VI_PUBLIC_FEATURE_WITNESS
      allow_disabled_after_word_mismatch:
        description: Preauthorize control only after strict word failure and complete pre-cleanup late predicates
        type: boolean
        required: true
        default: false
      producer_run:
        type: string
        required: true
      producer_revision:
        type: string
        required: true
      artifact_id:
        type: string
        required: true
      artifact_sha256:
        type: string
        required: true
      execution_created_utc:
        type: string
        required: true
      deadline_utc:
        type: string
        required: true
permissions:
  contents: read
  actions: read
env:
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  OMP_WAIT_POLICY: PASSIVE
  PYTHONOPTIMIZE: '0'
  PYTHONNOUSERSITE: '1'
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      DIAGNOSTIC_AUTHORITY: ${{ inputs.diagnostic_authority }}
      ALLOW_DISABLED_CONTROL: ${{ inputs.allow_disabled_after_word_mismatch }}
      PRODUCER_RUN: ${{ inputs.producer_run }}
      PRODUCER_REVISION: ${{ inputs.producer_revision }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
      EXECUTION_CREATED_UTC: ${{ inputs.execution_created_utc }}
      DEADLINE_UTC: ${{ inputs.deadline_utc }}
    steps:
      - name: Require scratch capacity before preparation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python3 - <<'PY'
          # ROOT_PREPARATION_CAPACITY_BEGIN
          import json, os, shutil
          from pathlib import Path
          peak = 4 * 1024**3
          reserve = 20 * 1024**3
          floor = 30 * 1024**3
          required = max(peak + reserve, floor)
          destinations = {'workspace': Path.cwd(), 'runtime': Path(os.environ['RUNNER_TEMP'])}
          free = {name: shutil.disk_usage(path).free for name, path in destinations.items()}
          record = dict(schema='vi-preparation-capacity-v1', estimated_peak_bytes=peak,
              reserve_bytes=reserve, minimum_free_floor_bytes=floor, required_free_bytes=required,
              concurrent_job_allocation_bytes=0, observed_free_bytes=free,
              passed=all(value >= required for value in free.values()), original_calls=0, native_calls=0)
          Path('results/preparation-capacity.json').write_text(json.dumps(record, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(record))
          assert record['passed'], 'Insufficient scratch capacity before checkout or transport'
          # ROOT_PREPARATION_CAPACITY_END
          PY
      - uses: actions/checkout@v4
        with:
          path: controller
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - name: Authenticate the exact successful producer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          lscpu > results/cpu.txt
          uname -a > results/platform.txt
          python - <<'PY'
          import hashlib, json, os, re, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          assert os.environ['DIAGNOSTIC_AUTHORITY'] == 'ROOT_AUTHORIZED_CONTROLLED_VI_PUBLIC_FEATURE_WITNESS', 'UNBOUND: no diagnostic helper/target authority'
          assert hashlib.sha256(Path('controller/tools/vi_avx512_public_witness.py').read_bytes()).hexdigest() == '9067d4fbfd68f1d491dc07892397cd54fb4c69ae42bc07e13c68d64a8e0f0238'
          assert hashlib.sha256(Path('controller/coverage/contracts/vi-avx512-public-witness-v2.json').read_bytes()).hexdigest() == 'dd47445d610ac705ae74e65caf59e9558a7bce43fd0ff2c70b5a9fb0c1a66611'
          run, revision, artifact, digest = (os.environ[k] for k in ('PRODUCER_RUN', 'PRODUCER_REVISION', 'ARTIFACT_ID', 'ARTIFACT_SHA256'))
          assert re.fullmatch('[1-9][0-9]*', run) and re.fullmatch('[1-9][0-9]*', artifact)
          assert re.fullmatch('[0-9a-f]{40}', revision) and re.fullmatch('[0-9a-f]{64}', digest)
          frozen = json.loads(Path('controller/coverage/contracts/vi-measurement-v5.json').read_bytes())
          assert frozen['status'] == 'ROOT_AUTHORIZED_ONE_INITIAL_COMPARISON', 'UNBOUND: root genuine-source binding required'
          assert (run, revision, artifact, digest) == tuple(str(frozen['producer'][key]) for key in ('run','revision','artifact','sha256'))
          created = datetime.fromisoformat(os.environ['EXECUTION_CREATED_UTC'])
          deadline = datetime.fromisoformat(os.environ['DEADLINE_UTC'])
          assert created.utcoffset() is not None and created.utcoffset().total_seconds() == 0
          assert deadline.utcoffset() is not None and deadline.utcoffset().total_seconds() == 0
          assert 0 < (deadline-created).total_seconds() <= 7200
          assert created <= datetime.now(timezone.utc) < deadline
          assert frozen['deadline_utc']is None and frozen['execution_clock']=='ROOT_DISPATCH_INPUT_BOUND'
          Path('results/execution-clock.json').write_text(json.dumps(dict(created_utc=created.isoformat(),deadline_utc=deadline.isoformat()))+'\n')
          base = 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/'
          def api(endpoint, name):
              raw = subprocess.check_output(['gh', 'api', base + endpoint])
              Path('results', name + '.json').write_bytes(raw)
              return json.loads(raw)
          record = api('runs/' + run, 'producer-run')
          assert str(record['id']) == run and record['head_sha'] == revision
          assert record['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert record['path'] == '.github/workflows/public-qualification.yml'
          assert record['status'] == 'completed' and record['conclusion'] == 'success'
          listing = api('runs/' + run + '/artifacts?per_page=100', 'producer-artifacts')
          assert listing['total_count'] == len(listing['artifacts'])
          matches = [a for a in listing['artifacts'] if a['name'] == 'rank-statistics-product-minimum']
          assert len(matches) == 1
          selected = matches[0]
          assert str(selected['id']) == artifact and selected['digest'] == 'sha256:' + digest
          assert not selected['expired'] and 0 < selected['size_in_bytes'] < 512 * 1024**2
          assert selected['workflow_run']['id'] == int(run) and selected['workflow_run']['head_sha'] == revision
          Path('results/selection.json').write_text(json.dumps(selected, indent=2) + '\n')
          # ROOT_CURRENT_PRODUCT_HOST_GATE_BEGIN
          host_policy = json.loads(Path('controller/coverage/contracts/vi-avx512-public-witness-v2.json').read_bytes())['host_eligibility']
          assert host_policy['purpose'] == 'CURRENT16_GENUINE_PUBLIC_VI_AVX512_INTERVENTION'
          cpu_text = Path('/proc/cpuinfo').read_text(encoding='utf-8').split('\n\n', 1)[0]
          cpu = {key.strip(): value.strip() for key, value in (line.split(':', 1) for line in cpu_text.splitlines() if ':' in line)}
          observed = {key: cpu.get(field) for key, field in (('vendor','vendor_id'),('model','model name'),('family','cpu family'),('model_id','model'),('stepping','stepping'))}
          flags = set(cpu.get('flags', '').split())
          host = os.uname()
          required = host_policy['required_host']
          eligible = host.sysname == required['system'] and host.machine == required['machine'] and set(host_policy['required_features']) <= flags
          host_record = dict(schema='vi-current-product-host-eligibility-v1', eligible=eligible,
              purpose=host_policy['purpose'],
              status='ELIGIBLE_CURRENT_PRODUCT_NO_TARGETS_YET' if eligible else 'INELIGIBLE_HOST_ZERO_TARGETS',
              observed_cpu=observed, observed_flags=sorted(flags), observed_system=host.sysname,
              observed_machine=host.machine, required_host=required,
              required_features=host_policy['required_features'], original_calls=0, native_calls=0,
              sampler_body_calls=0, timed_batches=0, prior_failed_host_causal_credit=False,
               scope='Conditional publicVIhost eligibility only;0targets yet, no old9V45cause/hostsearch/retry.')
          Path('results/host-eligibility.json').write_text(json.dumps(host_record, indent=2)+'\n', encoding='utf-8')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as stream:
              stream.write('VI_HOST_ELIGIBLE='+('1' if eligible else '0')+'\n')
          print(json.dumps(host_record))
          PY
      - uses: actions/checkout@v4
        if: env.VI_HOST_ELIGIBLE == '1'
        with:
          ref: ${{ inputs.producer_revision }}
          path: snapshot
          fetch-depth: 1
      - name: Install the authenticated product offline
        if: env.VI_HOST_ELIGIBLE == '1'
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/prepared.zip"
          python - <<'PY'
          import hashlib, json, os, runpy, stat, zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path, PurePosixPath
          selected = json.loads(Path('results/selection.json').read_bytes())
          archive = Path(os.environ['RUNNER_TEMP'], 'prepared.zip')
          actual = dict(bytes=archive.stat().st_size, sha256=hashlib.sha256(archive.read_bytes()).hexdigest())
          Path('results/archive.json').write_text(json.dumps(actual, indent=2) + '\n')
          assert actual['bytes'] == selected['size_in_bytes'] and actual['sha256'] == os.environ['ARTIFACT_SHA256']
          with zipfile.ZipFile(archive) as z:
              names = z.namelist(); assert len(names) == len(set(names))
              assert sum(i.file_size for i in z.infolist()) < 2 * 1024**3
              for i in z.infolist():
                  p = PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in i.filename
                  assert not stat.S_ISLNK(i.external_attr >> 16)
              z.extractall('stage')
          prepared = Path('stage')
          manifest = json.loads((prepared / 'runtime.json').read_bytes())
          assert manifest['schema'] == 'ci-offline-measurement-v1'
          Path('results/measurement.json').write_bytes((prepared / 'runtime.json').read_bytes())
          Path('results/runtime-lock.txt').write_bytes((prepared / 'runtime-lock.txt').read_bytes())
          assert manifest['source']['revision'] == os.environ['PRODUCER_REVISION']
          frozen = json.loads(Path('controller/coverage/contracts/vi-measurement-v5.json').read_bytes())
          sha=lambda path:hashlib.sha256(path.read_bytes()).hexdigest()
          assert sha(prepared/'runtime.json')==frozen['runtime_sha256']
          first=frozen['first_cohort']
          admission_path=Path('controller',first['root_admission_path'])
          stager_path=Path('controller',first['root_stager_path'])
          assert sha(admission_path)==first['root_admission_sha256']
          assert sha(stager_path)==first['root_stager_sha256']
          admission=json.loads(admission_path.read_bytes());stager=json.loads(stager_path.read_bytes())
          assert admission['source']==os.environ['PRODUCER_REVISION'] and str(admission['run'])==os.environ['PRODUCER_RUN']
          assert admission['passed'] is True and admission['root_accepted'] is True and admission['profiles']==4
          assert stager['revision']==os.environ['PRODUCER_REVISION'] and str(stager['run'])==os.environ['PRODUCER_RUN']
          assert str(stager['artifact'])==os.environ['ARTIFACT_ID'] and stager['artifact_sha256']==os.environ['ARTIFACT_SHA256']
          assert stager['profile']=='minimum' and stager['status'].startswith('AUTHENTICATED_STAGED_UNACCEPTED')
          product=json.loads((prepared/'product.json').read_bytes());qualification=json.loads((prepared/'qualification.json').read_bytes())
          assert sha(prepared/'product.json')==stager['product_json_sha256']
          assert sha(prepared/'qualification.json')==stager['qualification_manifest_sha256']
          assert product['schema']=='rank-statistics-comparison-product-v1'
          assert product['status']==product['provenance']['status']=='staged-unaccepted'
          assert product['revision']==os.environ['PRODUCER_REVISION'] and product['profile']=='minimum'
          assert product['provenance']['original_run']==os.environ['PRODUCER_RUN']
          assert product['provenance']['original_artifact']=='public-qualification-minimum'
          assert product['provenance']['original_manifest_sha256']==sha(prepared/'qualification.json')
          assert qualification['passed'] is True and qualification['no_timing'] is True and qualification['profile']=='minimum'
          assert qualification['source']==manifest['source']
          Path('results/product.json').write_bytes((prepared/'product.json').read_bytes())
          Path('results/qualification.json').write_bytes((prepared/'qualification.json').read_bytes())
          assert len(manifest['wheels']) == 14
          assert manifest['source'] == frozen['prepared_source']
          assert len(manifest['runtime']['sdk_sha256']) == frozen['SDK_members'] and type(frozen['SDK_members'])is int and frozen['SDK_members']>0
          for name,pin in frozen['benchmark_source_sha256'].items():
              assert manifest['source']['files_sha256'][name] == pin
              assert hashlib.sha256(Path('snapshot',name).read_bytes().replace(b'\r\n',b'\n')).hexdigest() == pin
          # Independent whole-release and stager receipts bind source/artifact; staging stays unaccepted.
          # Existing verifier below authenticates the installed package/runtime bytes.
          archive.unlink()
          Path('results/transport-disposal.json').write_text(json.dumps(dict(path=str(archive),logical_bytes=actual['bytes'],removed=True,archive_bytes_locally_available=False))+'\n')
          PY
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/bin/python" -m pip install --no-index --no-deps --only-binary=:all: --require-hashes --find-links stage/wheels -r stage/runtime-lock.txt 2>&1 | tee results/offline-install.log
          "$RUNNER_TEMP/runtime/bin/python" snapshot/tools/ci_measurement_artifacts.py verify --wheel-dir stage/wheels --artifact stage/runtime.json 2>&1 | tee results/original-identity.log
      - name: Require compiled and enabled NumPy AVX512_SKX before helper preparation
        if: env.VI_HOST_ELIGIBLE == '1'
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME
          export PYTHONDONTWRITEBYTECODE=1
          "$RUNNER_TEMP/runtime/bin/python" controller/tools/vi_avx512_public_witness.py --feature-gate results/public-features.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          record=json.loads(Path('results/public-features.json').read_bytes())
          with Path(os.environ['GITHUB_ENV']).open('a')as stream:
              stream.write('VI_NUMPY_ELIGIBLE='+('1'if record['eligible']else'0')+'\n')
          if not record['eligible']:
              Path('results/ineligible-numpy-zero-public-targets.json').write_text(json.dumps(dict(status='INELIGIBLE_NUMPY_ZERO_PUBLIC_TARGETS',VI_original_calls=0,VI_native_calls=0,retry=False))+'\n')
          PY
      - name: Prepare the authenticated small F1 helper once on this measurement host
        if: env.VI_HOST_ELIGIBLE == '1' && env.VI_NUMPY_ELIGIBLE == '1'
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME SKIMAGEXX_DISABLE_SIMD UTIL_VIEWS_FENV_HELPER
          export PYTHONDONTWRITEBYTECODE=1
          "$RUNNER_TEMP/runtime/bin/python" - <<'PY'
          import json,os,runpy,sys
          from pathlib import Path
          workspace=Path(os.environ['GITHUB_WORKSPACE']).resolve()
          controller=workspace/'controller';snapshot=workspace/'snapshot';results=workspace/'results'
          probe=runpy.run_path(str(controller/'tools/vi_first_cohort_probe.py'))
          frozen=json.loads((controller/'coverage/contracts/vi-measurement-v5.json').read_bytes())
          assert probe['sha'](controller/frozen['first_cohort']['probe_path'])==frozen['first_cohort']['probe_sha256']
          env=probe['prepare_host_helper'](snapshot,results,sys.executable,frozen)
          with Path(os.environ['GITHUB_ENV']).open('a')as stream:
              for key,value in env.items():
                  assert '\n'not in value
                  stream.write(key+'='+value+'\n')
          PY
      - name: Run the authorized adaptive public VI witness without timing
        if: env.VI_HOST_ELIGIBLE == '1' && env.VI_NUMPY_ELIGIBLE == '1'
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME SKIMAGEXX_DISABLE_SIMD
          export PYTHONDONTWRITEBYTECODE=1
          "$RUNNER_TEMP/runtime/bin/python" - <<'PY'
          import hashlib,json,os,subprocess,sys,sysconfig
          from pathlib import Path
          workspace=Path(os.environ['GITHUB_WORKSPACE']).resolve()
          controller=workspace/'controller';snapshot=workspace/'snapshot';results=workspace/'results'
          runner=controller/'tools/vi_avx512_public_witness.py'
          context=controller/'coverage/contracts/vi-avx512-public-witness-v2.json'
          frozen=json.loads((controller/'coverage/contracts/vi-measurement-v5.json').read_bytes())
          c=json.loads(context.read_bytes());features=json.loads((results/'public-features.json').read_bytes())
          assert features['eligible'] is True
          assert os.environ['DIAGNOSTIC_AUTHORITY']=='ROOT_AUTHORIZED_CONTROLLED_VI_PUBLIC_FEATURE_WITNESS'
          clock=json.loads((results/'execution-clock.json').read_bytes())
          helper=results/'helper-binding.json';sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          decision=dict(status=os.environ['DIAGNOSTIC_AUTHORITY'],purpose=c['purpose'],limits=c['limits'],
              runner_sha256=sha(runner),context_sha256=sha(context),controller_revision=os.environ['GITHUB_SHA'],
              source_revision=frozen['producer']['revision'],source_root=str(snapshot),
              runtime_path=str(workspace/'stage/runtime.json'),runtime_sha256=frozen['runtime_sha256'],
              core_sha256=frozen['core_sha256'],interpreter=sys.executable,
              installed_site=str(Path(sysconfig.get_paths()['purelib']).resolve()),
              helper_binding_path=str(helper),helper_binding_sha256=sha(helper),
              output_root=str(results/'public-witness'),created_utc=clock['created_utc'],deadline_utc=clock['deadline_utc'],
              base_features=features['features'],cpu=features['cpu'],disabled_targets=features['disabled_targets'],
              allow_disabled_after_expected_word_mismatch=os.environ['ALLOW_DISABLED_CONTROL']=='true')
          go=results/'public-witness-root-go.json'
          with go.open('x',encoding='utf-8',newline='\n')as stream:
              stream.write(json.dumps(decision,indent=2)+'\n');stream.flush();os.fsync(stream.fileno())
          command=[sys.executable,str(runner),'--go',str(go),'--go-sha256',sha(go)]
          (results/'public-witness-command.json').write_text(json.dumps(command,indent=2)+'\n')
          with(results/'public-witness.log').open('x')as log:
              done=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT)
          (results/'public-witness-exit.json').write_text(json.dumps(dict(exit=done.returncode))+'\n')
          # The runner verifies identity after each attempted child before any continuation.
          # A captured default strict failure stays nonzero even when its control passes.
          raise SystemExit(done.returncode)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vi-avx512-public-witness-minimum
          path: results/
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error
