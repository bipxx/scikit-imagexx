name: Circular Hough peaks modern private component and SDK
on:
  workflow_dispatch:
    inputs:
      authority:
        required: true
        type: string
      authority_sha256:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  component:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OMP_THREAD_LIMIT: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/u182-circle-peaks-component-v1
      - name: Verify scope and run private component and SDK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CIRCLE_COMPONENT_AUTHORITY: ${{ inputs.authority }}
          CIRCLE_COMPONENT_AUTHORITY_SHA256: ${{ inputs.authority_sha256 }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S -B .github/u182-circle-peaks-component-v1/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: u182-circle-peaks-modern-component-v2
          path: |
            circle-peaks-component-results/*.json
            circle-peaks-component-results/*.log
            circle-peaks-component-results/component/*.json
            circle-peaks-component-results/component/*.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: u182-circle-peaks-modern-component-elf-v2
          path: |
            circle-peaks-component-transport/_hough_circle_peaks_private.cpython-313-x86_64-linux-gnu.so
            circle-peaks-component-transport/prepared.json
          if-no-files-found: error
          retention-days: 1
