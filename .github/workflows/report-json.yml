name: Hough line wide-index CP313.8 diagnostic
on:
  workflow_dispatch:
    inputs:
      authority:
        required: true
        type: string
      authority_sha256:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  component:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OMP_THREAD_LIMIT: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/u182-hough-cp3138
      - name: Compile and verify the exact Hough line variant
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HOUGH_AUTHORITY: ${{ inputs.authority }}
          HOUGH_AUTHORITY_SHA256: ${{ inputs.authority_sha256 }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S -B .github/u182-hough-cp3138/run.py
          /usr/bin/python3 -I -S -B .github/u182-hough-cp3138/collect.py hough-component-results hough-line-wide-transport > hough-component-results/collection.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: u182-hough-line-wide-component-reports-v1
          path: |
            hough-component-results/*.json
            hough-component-results/*.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: u182-hough-line-wide-elf-v1
          path: hough-line-wide-transport/
          if-no-files-found: error
          retention-days: 1
