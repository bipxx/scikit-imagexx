name: Exact minimum pyramid reference validation
on:
  workflow_dispatch:
    inputs:
      root_authorization:
        description: Exact successor, carrier and two-mode authority with UTC deadline
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  minimum-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ROOT_AUTHORIZATION_JSON: ${{ inputs.root_authorization }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OMP_THREAD_LIMIT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: carrier
          persist-credentials: false
          sparse-checkout: .github/pyramid-minimum-reference-validation-v1
      - uses: actions/checkout@v4
        with:
          ref: 94522169d6111a6dcf5f7b044d6d267773e27de6
          path: tested
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            pyproject.toml
            tests/conftest.py
            tests/test_pyramid_spatial_public.py
            tests/pyramid_spatial_cases.py
            tests/fixtures/pyramid_spatial_originals_v1.json
            python/skimagexx/_pyramid_spatial.py
            python/skimagexx/filters.py
            src/gaussian_nd.cpp
            src/simd_gaussian_nd_avx2.cpp
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - name: Bind the exact correction and reserve runner scratch
        shell: bash
        run: |
          set -euo pipefail
          companion="$GITHUB_WORKSPACE/carrier/.github/pyramid-minimum-reference-validation-v1"
          python -I -S -B "$companion/validate.py" --bind-only --source "$GITHUB_WORKSPACE/tested"
          python -I -S -B - <<'PY'
          import os, shutil, sys
          assert sys.version_info[:3] == (3, 11, 17)
          for label in ('GITHUB_WORKSPACE', 'RUNNER_TEMP'):
              actual = shutil.disk_usage(os.environ[label]).free
              print(label, actual)
              assert actual >= 32 * 2**30, (label, actual)
          PY
          scratch=$(mktemp -d "$RUNNER_TEMP/pyramid-minimum-reference-v1.XXXXXXXX")
          printf 'PYRAMID_REFERENCE_SCRATCH=%s\nPYRAMID_REFERENCE_COMPANION=%s\n' "$scratch" "$companion" >> "$GITHUB_ENV"
          mkdir -p "$scratch/pip" receipts
          echo "ad18bd86522b3ee91723952d696fa71285caf236f6c514b12cee45362e2198b5  $companion/requirements-runtime.txt" | sha256sum -c
      - name: Install archived minimum stock wheel identities
        shell: bash
        run: |
          set -euo pipefail
          TMPDIR="$PYRAMID_REFERENCE_SCRATCH/pip" python -I -B -m pip --disable-pip-version-check install \
            --only-binary=:all: --no-deps --require-hashes --no-cache-dir \
            --target "$PYRAMID_REFERENCE_SCRATCH/stock" \
            -r "$PYRAMID_REFERENCE_COMPANION/requirements-runtime.txt"
      - name: Authenticate the retained built candidate wheel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -I -S -B "$PYRAMID_REFERENCE_COMPANION/extract_candidate.py" \
            --destination "$PYRAMID_REFERENCE_SCRATCH/candidate" --proof "$GITHUB_WORKSPACE/receipts/extraction.json"
      - name: Run all 40 installed tests in both modes
        shell: bash
        run: |
          set -euo pipefail
          cpu=$(python -I -S -B -c 'import os; print(min(os.sched_getaffinity(0)))')
          failure=0
          for mode in normal scalar; do
            unset SKIMAGEXX_DISABLE_SIMD
            if [[ "$mode" == scalar ]]; then
              export SKIMAGEXX_DISABLE_SIMD=1
            fi
            status=0
            env -u GH_TOKEN -u PYTHONPATH -u PYTHONHOME -u NPY_DISABLE_CPU_FEATURES -u PYTEST_ADDOPTS -u PYTEST_PLUGINS \
              taskset -c "$cpu" python -I -S -B "$PYRAMID_REFERENCE_COMPANION/validate.py" \
              --mode "$mode" --source "$GITHUB_WORKSPACE/tested" --stock "$PYRAMID_REFERENCE_SCRATCH/stock" \
              --candidate "$PYRAMID_REFERENCE_SCRATCH/candidate" --temporary "$PYRAMID_REFERENCE_SCRATCH" \
              --output "$GITHUB_WORKSPACE/receipts" --extraction "$GITHUB_WORKSPACE/receipts/extraction.json" \
              >"receipts/$mode.stdout" 2>"receipts/$mode.stderr" || status=$?
            printf '%s\n' "$status" >"receipts/$mode.exit"
            if [[ "$status" != 0 ]]; then failure=1; fi
          done
          exit "$failure"
      - name: Release temporary installed products
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -v PYRAMID_REFERENCE_SCRATCH && -d "$PYRAMID_REFERENCE_SCRATCH" ]]; then
            target=$(realpath "$PYRAMID_REFERENCE_SCRATCH")
            parent=$(realpath "$RUNNER_TEMP")
            [[ $(dirname "$target") == "$parent" && $(basename "$target") == pyramid-minimum-reference-v1.* ]]
            rm -r -- "$target"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyramid-minimum-reference-validation-v1
          path: receipts/
          if-no-files-found: warn
