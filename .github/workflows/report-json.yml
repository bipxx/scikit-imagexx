name: Medial Axis CP313.8 quiet timing
on:
  workflow_dispatch:
    inputs:
      authority:
        required: true
        type: string
      authority_sha256:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OMP_THREAD_LIMIT: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      MEDIAL_AUTHORITY: ${{ inputs.authority }}
      MEDIAL_AUTHORITY_SHA256: ${{ inputs.authority_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/u182-medial-cp3138
      - name: Stage exact existing ELF and stock
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME LD_PRELOAD LD_AUDIT LD_LIBRARY_PATH
          status=0
          /usr/bin/python3 -I -S -B .github/u182-medial-cp3138/speed-stage.py || status=$?
          if test -d medial-timing-stage; then
            printf '%s\n' "$status" > medial-timing-stage/stage-process.exit
          fi
          exit "$status"
      - name: Assert quiet and time four exact public cases
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME LD_PRELOAD LD_AUDIT LD_LIBRARY_PATH
          /usr/bin/python3 -I -S -B .github/u182-medial-cp3138/quiet-speed.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: u182-medial-quiet-timing-v1
          path: |
            medial-timing-stage/*.json
            medial-timing-stage/*.log
            medial-timing-stage/*.exit
            medial-timing-results/*.json
            medial-timing-results/*.jsonl
          if-no-files-found: warn
