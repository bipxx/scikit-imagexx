name: Hough modern isolated fixed speed
on:
  workflow_dispatch:
    inputs:
      authority:
        required: true
        type: string
      authority_sha256:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OMP_THREAD_LIMIT: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/u182-hough-cp3138
      - name: Authenticate and stage the exact prepared transport
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HOUGH_AUTHORITY: ${{ inputs.authority }}
          HOUGH_AUTHORITY_SHA256: ${{ inputs.authority_sha256 }}
        run: |
          set -euo pipefail
          status=0
          /usr/bin/python3 -I -S -B .github/u182-hough-cp3138/stage.py || status=$?
          if test -d hough-timing-stage; then
            printf '%s\n' "$status" > hough-timing-stage/stage-process.exit
          fi
          exit "$status"
      - name: Verify a quiet host and measure the twelve unchanged public cases
        shell: bash
        env:
          HOUGH_AUTHORITY: ${{ inputs.authority }}
          HOUGH_AUTHORITY_SHA256: ${{ inputs.authority_sha256 }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S -B .github/u182-hough-cp3138/quiet.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: u182-hough-modern-fixed-speed-v1
          path: |
            hough-timing-stage/*.json
            hough-timing-stage/*.log
            hough-timing-stage/*.exit
            hough-timing-results/*.json
            hough-timing-results/*.jsonl
          if-no-files-found: warn
