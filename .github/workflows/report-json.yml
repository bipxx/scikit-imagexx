name: Current306 Windows focused product v3 (optional)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-focus:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - name: Verify fresh host capacity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP)) {
            $drive = [System.IO.DriveInfo]::new([System.IO.Path]::GetPathRoot($path))
            Write-Output "$path free=$($drive.AvailableFreeSpace) required=$(44GB)"
            if ($drive.AvailableFreeSpace -lt 44GB) { throw 'Runner free capacity is below peak plus reserve' }
          }
      - uses: actions/checkout@v4
        with:
          path: carrier
          persist-credentials: false
          sparse-checkout: |
            .github/u182-windows-focus
      - name: Verify root-admitted complete source before provisioning
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proof = Join-Path $env:GITHUB_WORKSPACE 'carrier/.github/u182-windows-focus'
          python -B (Join-Path $proof 'run.py') --preflight --manifest (Join-Path $proof 'source-manifest-306-v3.json') --complete-source-receipt (Join-Path $proof 'complete-source-root.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --global core.autocrlf true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@v4
        with:
          ref: 5b94b20d30e572164a6473c8bb029e18d4a7e706
          path: tested
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Prepare genuine product and verify focused public and SDK scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proof = Join-Path $env:GITHUB_WORKSPACE 'carrier/.github/u182-windows-focus'
          $source = Join-Path $env:GITHUB_WORKSPACE 'tested'
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'windows-focus-receipts'
          python -I -B (Join-Path $proof 'run.py') --source $source --manifest (Join-Path $proof 'source-manifest-306-v3.json') --complete-source-receipt (Join-Path $proof 'complete-source-root.json') --evidence $evidence
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current306-windows-focused-receipts-v3
          path: |
            windows-focus-receipts/*.json
            windows-focus-receipts/*.log
            windows-focus-receipts/*.xml
            windows-focus-receipts/*.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: current306-windows-timing-transport-v3
          path: |
            tested/build/qp306/transport-wheels/*.whl
            windows-focus-receipts/runtime-lock.txt
            windows-focus-receipts/measurement.json
            windows-focus-receipts/terminal.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
