name: Exact current306 Windows same-job timing
on:
  workflow_dispatch:
    inputs:
      root_authority_json:
        type: string
        required: true
      root_authority_sha256:
        type: string
        required: true
permissions:
  actions: read
  contents: read
concurrency:
  group: current306-windows-fixed20-exact-source
  cancel-in-progress: false
jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 16
    steps:
      - name: Reserve destination and preserve native Windows checkout behavior
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP)) {
            $drive = Get-Item -LiteralPath $path
            if ($drive.PSDrive.Free -lt 32GB) { throw 'Insufficient exact Windows timing-host capacity' }
          }
          git config --global core.autocrlf true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --global core.longpaths true
          exit $LASTEXITCODE
      - uses: actions/checkout@v4
        with:
          path: carrier
          persist-credentials: false
          sparse-checkout: .github/current306-timing-host-v2
      - uses: actions/checkout@v4
        with:
          ref: 5b94b20d30e572164a6473c8bb029e18d4a7e706
          path: tested
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Authenticate actual product, prepare and conditionally time on this host
        shell: pwsh
        env:
          ROOT_AUTHORITY_JSON: ${{ inputs.root_authority_json }}
          ROOT_AUTHORITY_SHA256: ${{ inputs.root_authority_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $env:GITHUB_WORKSPACE 'carrier/.github/current306-timing-host-v2'
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'timing-receipts'
          $source = Join-Path $env:GITHUB_WORKSPACE 'tested'
          $null = New-Item -ItemType Directory -Path $evidence
          $approval = Join-Path $evidence 'root-conditional-authority.json'
          [IO.File]::WriteAllText($approval, $env:ROOT_AUTHORITY_JSON, [Text.UTF8Encoding]::new($false))
          python -I -S -B (Join-Path $base 'host.py') --approval $approval --approval-sha256 $env:ROOT_AUTHORITY_SHA256 --product-admission (Join-Path $base 'root-focus-admission-v1.json') --compact-readback (Join-Path $base 'readback-v2.json') --source $source --focus (Join-Path $base 'focus') --prepare (Join-Path $base 'prepare.py') --runner (Join-Path $base 'fixed20') --stock-template (Join-Path $base 'fixed20/binding-template-v1.json') --threadpoolctl (Join-Path $base 'threadpoolctl.py') --evidence $evidence
          $actual = $LASTEXITCODE
          [IO.File]::WriteAllText((Join-Path $evidence 'host-exit.txt'), ([string]$actual + [char]10))
          exit $actual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current306-windows-fixed20-measurement-v3
          path: timing-receipts/
          if-no-files-found: warn
