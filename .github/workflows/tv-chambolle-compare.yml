name: tv-chambolle-compare
on:
  workflow_dispatch:
    inputs:
      experiment_run:
        description: Root-reviewed immutable external TV experiment artifact run
        required: true
        type: string
      experiment_artifact:
        description: Artifact containing only experiment.json
        default: tv-chambolle-compare-experiment
        type: string
      experiment_sha256:
        description: Exact independently reviewed raw experiment.json SHA256
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest -q --capture=sys tests/test_tv_chambolle_compare.py -p no:cacheprovider
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  prepare:
    needs: tooling
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: windows
            os: windows-latest
            python: '3.13'
          - profile: modern
            os: ubuntu-24.04
            python: '3.13'
          - profile: minimum
            os: ubuntu-24.04
            python: '3.11'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.experiment_run }}
          name: ${{ inputs.experiment_artifact }}
          path: build/experiment
      - name: Strict external admission and original outer artifact authentication before fixtures
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/tv_chambolle_compare.py selectors --profile '${{ matrix.profile }}' --experiment build/experiment/experiment.json --experiment-sha256 '${{ inputs.experiment_sha256 }}'
          python benchmarks/tv_chambolle_compare.py fetch --profile '${{ matrix.profile }}' --experiment build/experiment/experiment.json --experiment-sha256 '${{ inputs.experiment_sha256 }}' --output build/prepared
          python benchmarks/tv_chambolle_compare.py verify-pair --profile '${{ matrix.profile }}' --experiment build/experiment/experiment.json --experiment-sha256 '${{ inputs.experiment_sha256 }}' --before build/prepared/before --after build/prepared/after
      - name: Offline exact qualified wheels in two separate ordinary-name prefixes
        shell: bash
        run: |
          set -euo pipefail
          python -m venv build/before-env
          python -m venv build/after-env
          if [ "$RUNNER_OS" = Windows ]; then PYSUB=Scripts/python.exe; else PYSUB=bin/python; fi
          build/before-env/$PYSUB -m pip install --no-index --no-deps --require-hashes --only-binary=:all: --no-compile --find-links build/prepared/before/wheels -r build/prepared/before/runtime-lock.txt
          build/after-env/$PYSUB -m pip install --no-index --no-deps --require-hashes --only-binary=:all: --no-compile --find-links build/prepared/after/wheels -r build/prepared/after/runtime-lock.txt
          printf 'BEFORE_PY=%s\nAFTER_PY=%s\n' "build/before-env/$PYSUB" "build/after-env/$PYSUB" >> "$GITHUB_ENV"
      - name: Exact400 observations original before after workers1and4 normalandscalar
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/tv_chambolle_compare.py compare --check-only --profile '${{ matrix.profile }}' --experiment build/experiment/experiment.json --experiment-sha256 '${{ inputs.experiment_sha256 }}' --before build/prepared/before --after build/prepared/after --before-python "$BEFORE_PY" --after-python "$AFTER_PY" --output build/prepared/checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-cursor-prepared-${{ matrix.profile }}
          include-hidden-files: true
          retention-days: 90
          path: build/prepared/
      - uses: actions/upload-artifact@v4
        with:
          name: tv-cursor-receipt-${{ matrix.profile }}
          retention-days: 90
          path: |
            build/prepared/checks/preparation.json
            build/prepared/checks/report.json
  barrier:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.experiment_run }}
          name: ${{ inputs.experiment_artifact }}
          path: build/experiment
      - uses: actions/download-artifact@v4
        with:
          pattern: tv-cursor-receipt-*
          path: build/receipts
      - name: All three fresh complete reports before any measurement host
        run: >-
          python benchmarks/tv_chambolle_compare.py barrier
          --experiment build/experiment/experiment.json
          --experiment-sha256 '${{ inputs.experiment_sha256 }}'
          --receipts build/receipts/tv-cursor-receipt-windows/preparation.json
          build/receipts/tv-cursor-receipt-modern/preparation.json
          build/receipts/tv-cursor-receipt-minimum/preparation.json
      - uses: actions/upload-artifact@v4
        with:
          name: tv-cursor-barrier
          retention-days: 90
          path: build/receipts/
  measure:
    needs: [prepare, barrier]
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: windows
            os: windows-latest
            python: '3.13'
          - profile: modern
            os: ubuntu-24.04
            python: '3.13'
          - profile: minimum
            os: ubuntu-24.04
            python: '3.11'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: tv-cursor-prepared-${{ matrix.profile }}
          path: build/prepared
      - uses: actions/download-artifact@v4
        with:
          name: tv-cursor-barrier
          path: build/receipts
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.experiment_run }}
          name: ${{ inputs.experiment_artifact }}
          path: build/experiment
      - name: Materialize only exact archived wheels offline before timing
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/tv_chambolle_compare.py verify-pair --profile '${{ matrix.profile }}' --experiment build/experiment/experiment.json --experiment-sha256 '${{ inputs.experiment_sha256 }}' --before build/prepared/before --after build/prepared/after
          python -m venv build/before-env
          python -m venv build/after-env
          if [ "$RUNNER_OS" = Windows ]; then PYSUB=Scripts/python.exe; else PYSUB=bin/python; fi
          build/before-env/$PYSUB -m pip install --no-index --no-deps --require-hashes --only-binary=:all: --no-compile --find-links build/prepared/before/wheels -r build/prepared/before/runtime-lock.txt
          build/after-env/$PYSUB -m pip install --no-index --no-deps --require-hashes --only-binary=:all: --no-compile --find-links build/prepared/after/wheels -r build/prepared/after/runtime-lock.txt
          printf 'BEFORE_PY=%s\nAFTER_PY=%s\n' "build/before-env/$PYSUB" "build/after-env/$PYSUB" >> "$GITHUB_ENV"
      - name: One worker seven rotating paired triads all70 no builds or pytest
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/tv_chambolle_compare.py compare --profile '${{ matrix.profile }}' --experiment build/experiment/experiment.json --experiment-sha256 '${{ inputs.experiment_sha256 }}' --before build/prepared/before --after build/prepared/after --before-python "$BEFORE_PY" --after-python "$AFTER_PY" --output build/results --receipts build/receipts/tv-cursor-receipt-windows/preparation.json build/receipts/tv-cursor-receipt-modern/preparation.json build/receipts/tv-cursor-receipt-minimum/preparation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-cursor-performance-${{ matrix.profile }}
          include-hidden-files: true
          retention-days: 90
          path: |
            build/results/
            build/receipts/
            build/experiment/
