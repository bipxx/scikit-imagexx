name: distance-layout-diagnostics
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: li-performance-ubuntu-latest
          run-id: 39761807459
          github-token: ${{ github.token }}
          path: build/exact-baseline
      - run: python -m pip install "numpy==2.5.4" "scikit-image==0.26.0"
      - run: python -m pip install --no-deps build/exact-baseline/wheels/*.whl
      - run: python tools/diagnose_distance_layouts.py > build/distance-layouts.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distance-layout-diagnostics
          path: build/distance-layouts.json
