name: lbp-cohort-fp-diagnostic
on:
  workflow_dispatch:
    inputs:
      diagnostic_authority:
        type: choice
        required: true
        default: UNBOUND
        options:
          - UNBOUND
          - ROOT_AUTHORIZED_ONE_LBP_FP_DIAGNOSTIC
      producer_run:
        type: string
        required: true
      producer_revision:
        type: string
        required: true
      artifact_id:
        type: string
        required: true
      artifact_sha256:
        type: string
        required: true
      execution_created_utc:
        type: string
        required: true
      deadline_utc:
        type: string
        required: true
permissions:
  contents: read
  actions: read
env:
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  OMP_WAIT_POLICY: PASSIVE
  PYTHONOPTIMIZE: '0'
  PYTHONNOUSERSITE: '1'
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DIAGNOSTIC_AUTHORITY: ${{ inputs.diagnostic_authority }}
      LBP_ONLY_AUTHORITY: ROOT_AUTHORIZED_LBP_ONLY_COMPARISON
      GH_TOKEN: ${{ github.token }}
      PRODUCER_RUN: ${{ inputs.producer_run }}
      PRODUCER_REVISION: ${{ inputs.producer_revision }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
      EXECUTION_CREATED_UTC: ${{ inputs.execution_created_utc }}
      DEADLINE_UTC: ${{ inputs.deadline_utc }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - name: Authenticate the exact successful producer
        shell: bash
        run: |
          set -euo pipefail
          mkdir results
          lscpu > results/cpu.txt
          uname -a > results/platform.txt
          python - <<'PY'
          import hashlib, json, os, re, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          assert os.environ['DIAGNOSTIC_AUTHORITY'] == 'ROOT_AUTHORIZED_ONE_LBP_FP_DIAGNOSTIC', 'UNBOUND diagnostic; no helper or target authority'
          assert os.environ['GITHUB_RUN_ATTEMPT'] == '1', 'No automatic diagnostic retry'
          assert subprocess.check_output(['git','-C','controller','rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']
          for name,pin in {
              'tools/lbp_cohort_fp_diagnostic.py':'b42d5d04855069605e6cb176894563c00c171cb5cafadc2591ccbe4d0e3e6ade',
              'coverage/contracts/lbp-cohort-fp-diagnostic-v1.json':'47432de249ee20eca1ad315ca64d1f1dbdc020c2e7854dcd38426f8400238b5e',
          }.items():assert hashlib.sha256(Path('controller',name).read_bytes()).hexdigest()==pin
          assert os.environ['LBP_ONLY_AUTHORITY'] == 'ROOT_AUTHORIZED_LBP_ONLY_COMPARISON', 'UNBOUND LBP-only comparison'
          assert hashlib.sha256(Path('controller/tools/lbp_only_comparison.py').read_bytes()).hexdigest() == '9d37d46d91619a7faa8d646f6d961aaa6304acbd9a1f6e52f94fe8ecfa13fd1d'
          assert hashlib.sha256(Path('controller/coverage/contracts/lbp-only-comparison-v1.json').read_bytes()).hexdigest() == 'c419fc6d33b45b62b3ce51698de9ed38993a1ca5c996705b5573bb6fe11cfe4f'
          assert hashlib.sha256(Path('controller/coverage/evidence/lbp-only-comparison-root-source-admission-v1.json').read_bytes()).hexdigest() == '806378f6a67e9dd082f490b83b4490392c6bb532ba1b507bc66ef4c80b759f6d'
          run, revision, artifact, digest = (os.environ[k] for k in ('PRODUCER_RUN', 'PRODUCER_REVISION', 'ARTIFACT_ID', 'ARTIFACT_SHA256'))
          assert re.fullmatch('[1-9][0-9]*', run) and re.fullmatch('[1-9][0-9]*', artifact)
          assert re.fullmatch('[0-9a-f]{40}', revision) and re.fullmatch('[0-9a-f]{64}', digest)
          frozen = json.loads(Path('controller/coverage/contracts/mark-lbp-measurement-v5.json').read_bytes())
          assert frozen['status'] == 'ROOT_AUTHORIZED_ONE_INITIAL_COMPARISON', 'UNBOUND: root genuine-source binding required'
          assert (run, revision, artifact, digest) == tuple(str(frozen['producer'][key]) for key in ('run','revision','artifact','sha256'))
          created = datetime.fromisoformat(os.environ['EXECUTION_CREATED_UTC'])
          deadline = datetime.fromisoformat(os.environ['DEADLINE_UTC'])
          assert created.utcoffset() is not None and created.utcoffset().total_seconds() == 0
          assert deadline.utcoffset() is not None and deadline.utcoffset().total_seconds() == 0
          assert 0 < (deadline-created).total_seconds() <= 7200
          assert created <= datetime.now(timezone.utc) < deadline
          assert frozen['deadline_utc']is None and frozen['execution_clock']=='ROOT_DISPATCH_INPUT_BOUND'
          Path('results/execution-clock.json').write_text(json.dumps(dict(created_utc=created.isoformat(),deadline_utc=deadline.isoformat()))+'\n')
          base = 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/'
          def api(endpoint, name):
              raw = subprocess.check_output(['gh', 'api', base + endpoint])
              Path('results', name + '.json').write_bytes(raw)
              return json.loads(raw)
          record = api('runs/' + run, 'producer-run')
          assert str(record['id']) == run and record['head_sha'] == revision
          assert record['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert record['path'] == '.github/workflows/public-qualification.yml'
          assert record['status'] == 'completed' and record['conclusion'] == 'success'
          listing = api('runs/' + run + '/artifacts?per_page=100', 'producer-artifacts')
          assert listing['total_count'] == len(listing['artifacts'])
          matches = [a for a in listing['artifacts'] if a['name'] == 'rank-statistics-product-minimum']
          assert len(matches) == 1
          selected = matches[0]
          assert str(selected['id']) == artifact and selected['digest'] == 'sha256:' + digest
          assert not selected['expired'] and 0 < selected['size_in_bytes'] < 512 * 1024**2
          assert selected['workflow_run']['id'] == int(run) and selected['workflow_run']['head_sha'] == revision
          Path('results/selection.json').write_text(json.dumps(selected, indent=2) + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.producer_revision }}
          path: snapshot
          fetch-depth: 1
      - name: Install the authenticated product offline
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/prepared.zip"
          python - <<'PY'
          import hashlib, json, os, runpy, stat, zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path, PurePosixPath
          selected = json.loads(Path('results/selection.json').read_bytes())
          archive = Path(os.environ['RUNNER_TEMP'], 'prepared.zip')
          actual = dict(bytes=archive.stat().st_size, sha256=hashlib.sha256(archive.read_bytes()).hexdigest())
          Path('results/archive.json').write_text(json.dumps(actual, indent=2) + '\n')
          assert actual['bytes'] == selected['size_in_bytes'] and actual['sha256'] == os.environ['ARTIFACT_SHA256']
          with zipfile.ZipFile(archive) as z:
              names = z.namelist(); assert len(names) == len(set(names))
              assert sum(i.file_size for i in z.infolist()) < 2 * 1024**3
              for i in z.infolist():
                  p = PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in i.filename
                  assert not stat.S_ISLNK(i.external_attr >> 16)
              z.extractall('stage')
          prepared = Path('stage')
          manifest = json.loads((prepared / 'runtime.json').read_bytes())
          assert manifest['schema'] == 'ci-offline-measurement-v1'
          Path('results/measurement.json').write_bytes((prepared / 'runtime.json').read_bytes())
          Path('results/runtime-lock.txt').write_bytes((prepared / 'runtime-lock.txt').read_bytes())
          assert manifest['source']['revision'] == os.environ['PRODUCER_REVISION']
          frozen = json.loads(Path('controller/coverage/contracts/mark-lbp-measurement-v5.json').read_bytes())
          sha=lambda path:hashlib.sha256(path.read_bytes()).hexdigest()
          assert sha(prepared/'runtime.json')==frozen['runtime_sha256']
          first=frozen['first_cohort']
          admission_path=Path('controller',first['root_admission_path'])
          stager_path=Path('controller',first['root_stager_path'])
          assert sha(admission_path)==first['root_admission_sha256']
          assert sha(stager_path)==first['root_stager_sha256']
          admission=json.loads(admission_path.read_bytes());stager=json.loads(stager_path.read_bytes())
          assert admission['source']==os.environ['PRODUCER_REVISION'] and str(admission['run'])==os.environ['PRODUCER_RUN']
          assert admission['passed'] is True and admission['root_accepted'] is True and admission['profiles']==4
          assert stager['revision']==os.environ['PRODUCER_REVISION'] and str(stager['run'])==os.environ['PRODUCER_RUN']
          assert str(stager['artifact'])==os.environ['ARTIFACT_ID'] and stager['artifact_sha256']==os.environ['ARTIFACT_SHA256']
          assert stager['profile']=='minimum' and stager['status'].startswith('AUTHENTICATED_STAGED_UNACCEPTED')
          product=json.loads((prepared/'product.json').read_bytes());qualification=json.loads((prepared/'qualification.json').read_bytes())
          assert sha(prepared/'product.json')==stager['product_json_sha256']
          assert sha(prepared/'qualification.json')==stager['qualification_manifest_sha256']
          assert product['schema']=='rank-statistics-comparison-product-v1'
          assert product['status']==product['provenance']['status']=='staged-unaccepted'
          assert product['revision']==os.environ['PRODUCER_REVISION'] and product['profile']=='minimum'
          assert product['provenance']['original_run']==os.environ['PRODUCER_RUN']
          assert product['provenance']['original_artifact']=='public-qualification-minimum'
          assert product['provenance']['original_manifest_sha256']==sha(prepared/'qualification.json')
          assert qualification['passed'] is True and qualification['no_timing'] is True and qualification['profile']=='minimum'
          assert qualification['source']==manifest['source']
          Path('results/product.json').write_bytes((prepared/'product.json').read_bytes())
          Path('results/qualification.json').write_bytes((prepared/'qualification.json').read_bytes())
          assert len(manifest['wheels']) == 14
          assert manifest['source'] == frozen['prepared_source']
          assert len(manifest['runtime']['sdk_sha256']) == frozen['SDK_members'] and type(frozen['SDK_members'])is int and frozen['SDK_members']>0
          for name,pin in frozen['benchmark_source_sha256'].items():
              assert manifest['source']['files_sha256'][name] == pin
              assert hashlib.sha256(Path('snapshot',name).read_bytes().replace(b'\r\n',b'\n')).hexdigest() == pin
          # Independent whole-release and stager receipts bind source/artifact; staging stays unaccepted.
          # Existing verifier below authenticates the installed package/runtime bytes.
          PY
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/bin/python" -m pip install --no-index --no-deps --only-binary=:all: --require-hashes --find-links stage/wheels -r stage/runtime-lock.txt 2>&1 | tee results/offline-install.log
          "$RUNNER_TEMP/runtime/bin/python" snapshot/tools/ci_measurement_artifacts.py verify --wheel-dir stage/wheels --artifact stage/runtime.json 2>&1 | tee results/original-identity.log
      - name: Actual diagnostic source and inert guards before helper or target
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/runtime/bin/python" -m pytest -q controller/tests/test_lbp_cohort_fp_diagnostic.py --basetemp "$RUNNER_TEMP/lbp-source-fixtures" --junitxml results/diagnostic-source.xml
      - name: Bind the root-selected LBP-only authority and prepare the authenticated F1 helper once
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME SKIMAGEXX_DISABLE_SIMD UTIL_VIEWS_FENV_HELPER
          export PYTHONDONTWRITEBYTECODE=1
          "$RUNNER_TEMP/runtime/bin/python" - <<'PY'
          from datetime import datetime,timezone
          import hashlib,json,os,runpy,sys
          from pathlib import Path
          assert os.environ['LBP_ONLY_AUTHORITY']=='ROOT_AUTHORIZED_LBP_ONLY_COMPARISON','UNBOUND LBP-only comparison'
          workspace=Path(os.environ['GITHUB_WORKSPACE']).resolve()
          controller=workspace/'controller';snapshot=workspace/'snapshot';results=workspace/'results'
          clock=json.loads((results/'execution-clock.json').read_bytes())
          created=datetime.fromisoformat(os.environ['EXECUTION_CREATED_UTC']);deadline=datetime.fromisoformat(os.environ['DEADLINE_UTC'])
          assert created==datetime.fromisoformat(clock['created_utc'])and deadline==datetime.fromisoformat(clock['deadline_utc'])
          assert created.utcoffset() is not None and created.utcoffset().total_seconds()==0
          assert deadline.utcoffset() is not None and deadline.utcoffset().total_seconds()==0
          assert created<=datetime.now(timezone.utc)<deadline and 0<(deadline-created).total_seconds()<=7200
          digest=lambda path:hashlib.sha256(Path(path).read_bytes()).hexdigest()
          receipt=controller/'coverage/evidence/lbp-only-comparison-root-source-admission-v1.json'
          assert digest(receipt)=='806378f6a67e9dd082f490b83b4490392c6bb532ba1b507bc66ef4c80b759f6d'
          tool=controller/'tools/lbp_only_comparison.py';context=controller/'coverage/contracts/lbp-only-comparison-v1.json'
          assert digest(tool)=='9d37d46d91619a7faa8d646f6d961aaa6304acbd9a1f6e52f94fe8ecfa13fd1d'
          assert digest(context)=='c419fc6d33b45b62b3ce51698de9ed38993a1ca5c996705b5573bb6fe11cfe4f'
          frozen=json.loads(context.read_bytes())
          decision=dict(status='ROOT_AUTHORIZED_LBP_ONLY_COMPARISON',context_sha256=digest(context),controller_sha256=digest(tool),
              parent_sha256=frozen['parent_sha256'],scope=frozen['scope'],MARK_authorized=False,
              controller_admission=dict(path=str(receipt),sha256=digest(receipt)),
              created_utc=clock['created_utc'],deadline_utc=clock['deadline_utc'],workflow_source=os.environ['GITHUB_SHA'])
          go=results/'lbp-only-root-GO.json'
          with go.open('x',encoding='utf-8')as stream:json.dump(decision,stream,indent=2);stream.write('\n')
          with (results/'lbp-only-root-GO.sha256').open('x',encoding='utf-8')as stream:stream.write(digest(go)+'\n')
          adapter=runpy.run_path(str(tool))
          outer,selected,_=adapter['authorize'](controller,go,digest(go))
          evidence=results/'controller-source';evidence.mkdir(exist_ok=False)
          pins={}
          for name in ('tools/lbp_only_comparison.py','coverage/contracts/lbp-only-comparison-v1.json','coverage/evidence/lbp-only-comparison-root-source-admission-v1.json','coverage/contracts/mark-lbp-measurement-v5.json','tools/mark_lbp_first_cohort_probe.py','tools/lbp_cohort_fp_diagnostic.py','coverage/contracts/lbp-cohort-fp-diagnostic-v1.json','.github/workflows/lbp-cohort-fp-diagnostic.yml','tests/test_lbp_cohort_fp_diagnostic.py'):
              payload=(controller/name).read_bytes();member=evidence/name;member.parent.mkdir(parents=True,exist_ok=True);member.write_bytes(payload)
              pins[name]=hashlib.sha256(payload).hexdigest()
          (results/'controller-source-pins.json').write_text(json.dumps(dict(workflow_source=os.environ['GITHUB_SHA'],files_raw_sha256=pins),indent=2)+'\n')
          env=outer.prepare_host_helper(snapshot,results,sys.executable,selected)
          with Path(os.environ['GITHUB_ENV']).open('a')as stream:
              for key,value in env.items():
                  assert '\n'not in value
                  stream.write(key+'='+value+'\n')
          PY
      - name: Diagnose exactly one unchanged real LBP cohort, never sample or time
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME SKIMAGEXX_DISABLE_SIMD
          export PYTHONDONTWRITEBYTECODE=1
          "$RUNNER_TEMP/runtime/bin/python" - <<'PY'
          import hashlib,json,os,runpy,subprocess,sys,sysconfig
          from pathlib import Path
          workspace=Path(os.environ['GITHUB_WORKSPACE']).resolve()
          controller=workspace/'controller';snapshot=workspace/'snapshot';results=workspace/'results'
          adapter=runpy.run_path(str(controller/'tools/lbp_only_comparison.py'))
          go=results/'lbp-only-root-GO.json';pin=(results/'lbp-only-root-GO.sha256').read_text().strip()
          authority=adapter['prepare_cohort'](controller,snapshot,results,sys.executable,Path(sysconfig.get_paths()['purelib']).resolve(),go,pin)
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          context=controller/'coverage/contracts/lbp-cohort-fp-diagnostic-v1.json'
          tool=controller/'tools/lbp_cohort_fp_diagnostic.py'
          manifest=json.loads((controller/'coverage/contracts/mark-lbp-measurement-v5.json').read_bytes())
          clock=json.loads((results/'execution-clock.json').read_bytes())
          output=results/'lbp-cohort-fp-diagnostic.json'
          decision=dict(status='ROOT_AUTHORIZED_ONE_LBP_FP_DIAGNOSTIC',wrapper_sha256=sha(tool),
              context_sha256=sha(context),binding_sha256=sha(authority['binding']),cohort_GO_sha256=sha(authority['go']),
              maximum_original_topcalls=1,maximum_native_topcalls=1,sampler_body_calls=0,timed_batches=0,
              api='feature.draw_multiblock_lbp',case_id='gray-u8-C',source_revision=manifest['producer']['revision'],
              diagnostic_source=os.environ['GITHUB_SHA'],created_utc=clock['created_utc'],deadline_utc=clock['deadline_utc'],output_path=str(output))
          diagnostic_go=results/'diagnostic-root-GO.json'
          with diagnostic_go.open('x',encoding='utf-8',newline='\n')as f:json.dump(decision,f,indent=2);f.write('\n')
          command=[sys.executable,str(tool),'--binding',authority['binding'],'--root-go',authority['go'],
              '--diagnostic-go',str(diagnostic_go),'--diagnostic-go-sha256',sha(diagnostic_go),'--output',str(output)]
          (results/'diagnostic-command.json').write_text(json.dumps(command,indent=2)+'\n')
          with (results/'diagnostic.log').open('x')as log:done=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT)
          (results/'diagnostic-exit.json').write_text(json.dumps(dict(exit=done.returncode))+'\n')
          # Once after the one-cohort batch, also on failure; preserve primary exit.
          verifier=[sys.executable,str(snapshot/'tools/ci_measurement_artifacts.py'),'verify','--wheel-dir',str(workspace/'stage/wheels'),'--artifact',str(workspace/'stage/runtime.json')]
          with (results/'postbatch-identity.log').open('x')as log:checked=subprocess.run(verifier,stdout=log,stderr=subprocess.STDOUT)
          (results/'postbatch-identity-exit.json').write_text(json.dumps(dict(exit=checked.returncode))+'\n')
          assert sha(workspace/'stage/runtime.json')==manifest['runtime_sha256']
          raise SystemExit(done.returncode or checked.returncode)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lbp-cohort-fp-diagnostic-minimum
          path: results/
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error
