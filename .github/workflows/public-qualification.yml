name: public-qualification
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact frozen product and tooling commit (must equal selected workflow ref)
        type: string
        required: true
      expected_native_images:
        description: Optional independent image-path count; empty derives from source registry
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  qualify:
    # Qualification only. There are no measurement jobs or timers in this workflow.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            profile: windows
            python: '3.13'
          - os: ubuntu-24.04
            profile: modern
            python: '3.13'
          - os: ubuntu-24.04
            profile: minimum
            python: '3.11'
          - os: ubuntu-24.04
            profile: debug
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      EXPECTED_SOURCE_REVISION: ${{ inputs.source_revision }}
      EXPECTED_NATIVE_IMAGES: ${{ inputs.expected_native_images }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tooling guards before preparation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python -m pip install pytest==9.1.1
          python -m pytest -q --capture=sys tests/test_public_qualification.py tests/test_level_set_reference_metadata.py tests/test_build_identity_facts.py tests/test_rank_statistics_products.py tests/test_rank_corpus_sdk_scope.py tests/test_reconstruction_trace_policy.py tests/test_reconstruction_source_migration_metadata.py tests/test_h_extrema_public_metadata.py tests/test_h_extrema_source_provenance.py -o cache_dir=build/qualification-tool-cache --junitxml=build/qualification-tool-guards.xml 2>&1 | tee build/qualification-tool-guards.log
      - name: Build and qualify one genuine whole product on this fresh host
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$EXPECTED_NATIVE_IMAGES" ]]; then
            args+=(--expected-native-images "$EXPECTED_NATIVE_IMAGES")
          fi
          python tools/public_qualification.py all --profile '${{ matrix.profile }}' --output 'build/public-qualification/${{ matrix.profile }}' --source-revision "$EXPECTED_SOURCE_REVISION" "${args[@]}"
      - name: Independently rehash a terminal qualification seal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          manifest='build/public-qualification/${{ matrix.profile }}/manifest.json'
          if [[ -f "$manifest" ]]; then
            python tools/public_qualification.py verify --profile '${{ matrix.profile }}' --output 'build/public-qualification/${{ matrix.profile }}' | tee 'build/qualification-verify-${{ matrix.profile }}.json'
          else
            echo 'No terminal acceptance seal; retain failure receipts and original command states.'
            exit 1
          fi
      - name: Stage a bounded controlled product after successful independent verification
        if: success() && matrix.profile != 'debug'
        shell: bash
        run: |
          set -euo pipefail
          python tools/rank_statistics_products.py --qualification 'build/public-qualification/${{ matrix.profile }}' --verification-receipt 'build/qualification-verify-${{ matrix.profile }}.json' --profile '${{ matrix.profile }}' --artifact-run '${{ github.run_id }}' --output 'build/rank-statistics-product-${{ matrix.profile }}'
      - uses: actions/upload-artifact@v4
        if: success() && matrix.profile != 'debug'
        with:
          name: rank-statistics-product-${{ matrix.profile }}
          include-hidden-files: true
          retention-days: 90
          path: build/rank-statistics-product-${{ matrix.profile }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-qualification-${{ matrix.profile }}
          include-hidden-files: true
          retention-days: 90
          path: |
            build/public-qualification/${{ matrix.profile }}/
            build/qualification-tool-guards.xml
            build/qualification-tool-guards.log
            build/qualification-verify-${{ matrix.profile }}.json
