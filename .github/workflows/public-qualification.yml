name: public-qualification
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact frozen product and tooling commit (must equal selected workflow ref)
        type: string
        required: true
      expected_native_images:
        description: Optional independent image-path count; empty derives from source registry
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  qualify:
    # Qualification only. There are no measurement jobs or timers in this workflow.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            profile: windows
            python: '3.13.16'
          - os: ubuntu-24.04
            profile: modern
            python: '3.13.16'
          - os: ubuntu-24.04
            profile: minimum
            python: '3.11.17'
          - os: ubuntu-24.04
            profile: debug
            python: '3.13.16'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      EXPECTED_SOURCE_REVISION: ${{ inputs.source_revision }}
      EXPECTED_NATIVE_IMAGES: ${{ inputs.expected_native_images }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tooling guards before preparation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          # Inert observer-inverse guards compare against this one frozen harness.
          if ! git cat-file -e '4f69eba77a262056459eaab1e0a39e53610e9305:benchmarks/subdivide_polygon.py' 2>/dev/null; then
            git fetch --no-tags --depth=1 origin 4f69eba77a262056459eaab1e0a39e53610e9305
          fi
          git cat-file -e '4f69eba77a262056459eaab1e0a39e53610e9305:benchmarks/subdivide_polygon.py'
          python -m pip install pytest==9.1.1
          python -m pytest -q --capture=sys tests/test_public_qualification.py tests/test_level_set_reference_metadata.py tests/test_rolling_ball_kernels_public.py::test_geometry_prospective_manifest tests/test_rolling_ball_kernels_public.py::test_prospective_allocation_bounds_and_rank_frontier_are_explicit tests/test_rolling_ball_kernels_public.py::test_geometry_saved_original_rows tests/test_rolling_ball_kernels_benchmark.py tests/test_approximate_polygon_public.py::test_approximate_polygon_prospective_manifest tests/test_approximate_polygon_public.py::test_approximate_polygon_saved_original_rows tests/test_approximate_polygon_benchmark.py tests/test_approximate_polygon_runtime_reference.py tests/test_subdivide_polygon_public.py::test_subdivide_polygon_prospective_manifest tests/test_subdivide_polygon_public.py::test_subdivide_polygon_saved_original_rows tests/test_subdivide_polygon_benchmark.py tests/test_rank_bilateral_fixture_reuse_metadata.py tests/test_build_identity_facts.py tests/test_rank_statistics_products.py tests/test_rank_corpus_sdk_scope.py tests/test_reconstruction_trace_policy.py tests/test_reconstruction_source_migration_metadata.py tests/test_h_extrema_public_metadata.py tests/test_h_extrema_source_provenance.py tests/test_line_aa_benchmark.py tests/test_regionprops_state_benchmark.py tests/test_regionprops_state_reference.py::test_regionprops_state_frozen_partition tests/test_regionprops_state_reference.py::test_regionprops_state_prospective_source_safety tests/test_regionprops_state_reference.py::test_regionprops_state_saved_rows_without_replay tests/test_regionprops_point_witness.py::test_regionprops_point_frozen_contract tests/test_ci_measurement_isolation.py tests/test_circle_perimeter_aa_benchmark.py tests/test_circle_perimeter_aa_reference.py::test_circle_perimeter_aa_prospective_source_safety tests/test_circle_perimeter_aa_reference.py::test_circle_perimeter_aa_saved_original_rows tests/test_combine_stains_half_benchmark.py tests/test_combine_stains_half_reference.py::test_combine_stains_half_prospective_source_safety tests/test_combine_stains_half_reference.py::test_combine_stains_half_saved_original_rows tests/test_regionprops_public_mutation_reference.py::test_regionprops_public_mutation_prospective_source_safety tests/test_regionprops_public_mutation_reference.py::test_regionprops_public_mutation_saved_original_rows tests/test_line_nd_reference.py::test_line_nd_prospective_matrix_and_source_safety tests/test_line_nd_reference.py::test_line_nd_saved_original_rows_without_replay tests/test_line_nd_rounding_promotion_reference.py::test_line_nd_rounding_promotion_source_safety_without_science tests/test_line_nd_rounding_promotion_reference.py::test_line_nd_rounding_promotion_saved_original_only tests/test_line_nd_benchmark.py::test_line_nd_benchmark_source_and_independent_large_bounds tests/test_line_nd_benchmark.py::test_line_nd_benchmark_import_refuses_scientific_modules tests/test_line_nd_benchmark.py::test_line_nd_benchmark_storage_and_preflight_guard_source -o cache_dir=build/qualification-tool-cache --junitxml=build/qualification-tool-guards.xml tests/test_ellipsoid_reference.py::test_ellipsoid_prospective_matrix_and_source_safety tests/test_ellipsoid_reference.py::test_ellipsoid_saved_observations_without_replay tests/test_draw_ellipsoid_default.py::test_ellipsoid_saved_sdk_oracle_metadata_without_science tests/test_ellipsoid_benchmark.py::test_ellipsoid_benchmark_source_method_and_larger_domain_bound tests/test_ellipsoid_benchmark.py::test_ellipsoid_benchmark_import_refuses_science tests/test_ellipsoid_benchmark.py::test_ellipsoid_benchmark_actual_factory_original_refused tests/test_ellipsoid_benchmark.py::test_ellipsoid_source_safety_refuses_unaudited_cases tests/test_ellipsoid_benchmark.py::test_ellipsoid_benchmark_actual_guard_order_and_metadata_source tests/test_ellipse_perimeter_reference.py::test_ellipse_perimeter_prospective_source_safety tests/test_ellipse_perimeter_reference.py::test_ellipse_perimeter_saved_observations_without_replay tests/test_draw_ellipse_perimeter_default.py::test_ellipse_perimeter_saved_sdk_oracle_metadata_without_science tests/test_ellipse_perimeter_benchmark.py::test_ellipse_perimeter_benchmark_source_bounds_and_pins tests/test_ellipse_perimeter_benchmark.py::test_ellipse_perimeter_benchmark_import_refuses_science tests/test_ellipse_perimeter_benchmark.py::test_ellipse_perimeter_benchmark_factory_original_refused tests/test_ellipse_perimeter_benchmark.py::test_ellipse_perimeter_benchmark_rejects_unsafe_specs tests/test_ellipse_perimeter_benchmark.py::test_ellipse_perimeter_benchmark_guards_and_timed_boundary tests/test_regionprops_bbox_extent_reference.py::test_bbox_extent_prospective_source_and_scope tests/test_regionprops_bbox_extent_reference.py::test_bbox_extent_saved_rows_and_declared_pixel_mutation tests/test_regionprops_bbox_extent_reference.py::test_bbox_extent_saved_scalar_types_errors_and_FP_phases tests/test_regionprops_scalars_benchmark.py tests/test_regionprops_performance_v2.py tests/test_region_stain_compare.py::test_imports_refuse_scientific_algorithms tests/test_region_stain_compare.py::test_fixed_contract_workflow_sources_and_pool_scope tests/test_region_stain_compare.py::test_exact_baseline_selection tests/test_region_stain_compare.py::test_artifact_authentication_negative tests/test_region_stain_compare.py::test_prepare_only_actual_step_admission tests/test_region_stain_compare.py::test_both_pairs_and_all40_fixed_gates tests/test_region_stain_compare.py::test_every_cohort_each_pair_rejects_regression tests/test_region_stain_compare.py::test_original_normalized_gate_cannot_be_hidden_by_direct_gain tests/test_region_stain_compare.py::test_raw_journal_medians_warmup_sample_order tests/test_region_stain_compare.py::test_raw_journal_negative tests/test_region_stain_compare.py::test_controller_rejects_non_UTC_before_any_execution tests/test_regionprops_strided_sdk_scope.py tests/test_matrix_transform_numpy124_skylakex_certificate.py tests/test_regionprops_coords_scaled_reference.py::test_coords_scaled_prospective_scope_and_source tests/test_regionprops_coords_scaled_reference.py::test_coords_scaled_saved_sequences_and_accounting tests/test_regionprops_coords_scaled_reference.py::test_coords_scaled_saved_payload_words_and_declared_mutations tests/test_regionprops_coords_scaled_sdk_scope.py::test_coords_scaled_sdk_default_and_focused_route tests/test_regionprops_coords_scaled_sdk_scope.py::test_coords_scaled_reuses_installed_component_family tests/test_regionprops_coords_scaled_benchmark.py tests/test_draw_polygon_reference.py tests/test_draw_polygon_benchmark.py tests/test_draw_polygon_sdk_scope.py tests/test_draw_polygon_default.py::test_polygon_defaults_source_and_saved_contract_without_science tests/test_draw_polygon_dtype_tag_reference.py::test_draw_polygon_tagged_saved_reference_complete tests/test_draw_polygon_dtype_tag_reference.py::test_draw_polygon_tagged_saved_payloads 2>&1 | tee build/qualification-tool-guards.log
      - name: Build and qualify one genuine whole product on this fresh host
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$EXPECTED_NATIVE_IMAGES" ]]; then
            args+=(--expected-native-images "$EXPECTED_NATIVE_IMAGES")
          fi
          python tools/public_qualification.py all --profile '${{ matrix.profile }}' --output 'build/public-qualification/${{ matrix.profile }}' --source-revision "$EXPECTED_SOURCE_REVISION" "${args[@]}"
      - name: Independently rehash a terminal qualification seal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          manifest='build/public-qualification/${{ matrix.profile }}/manifest.json'
          if [[ -f "$manifest" ]]; then
            python tools/public_qualification.py verify --profile '${{ matrix.profile }}' --output 'build/public-qualification/${{ matrix.profile }}' | tee 'build/qualification-verify-${{ matrix.profile }}.json'
          else
            echo 'No terminal acceptance seal; retain failure receipts and original command states.'
            exit 1
          fi
      - name: Stage a bounded controlled product after successful independent verification
        if: success() && matrix.profile != 'debug'
        shell: bash
        run: |
          set -euo pipefail
          python tools/rank_statistics_products.py --qualification 'build/public-qualification/${{ matrix.profile }}' --verification-receipt 'build/qualification-verify-${{ matrix.profile }}.json' --profile '${{ matrix.profile }}' --artifact-run '${{ github.run_id }}' --output 'build/rank-statistics-product-${{ matrix.profile }}'
      - uses: actions/upload-artifact@v4
        if: success() && matrix.profile != 'debug'
        with:
          name: rank-statistics-product-${{ matrix.profile }}
          include-hidden-files: true
          retention-days: 90
          path: build/rank-statistics-product-${{ matrix.profile }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-qualification-${{ matrix.profile }}
          include-hidden-files: true
          retention-days: 90
          path: |
            build/public-qualification/${{ matrix.profile }}/
            build/qualification-tool-guards.xml
            build/qualification-tool-guards.log
            build/qualification-verify-${{ matrix.profile }}.json
