name: Matrix SkylakeX ORIGINAL-only reference
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-reference:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.16'
      - name: Authenticate metadata plan without numerical imports
        shell: pwsh
        run: |
          python tools/matrix_transform_skylakex_reference.py plan --output build/matrix-skylakex-reference
      - name: Unforced NEW HOST original source intake and reference words
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/matrix_transform_skylakex_reference.py all --output build/matrix-skylakex-reference
      - name: Independently verify complete raw reference closure
        shell: pwsh
        run: |
          python tools/matrix_transform_skylakex_reference.py verify --output build/matrix-skylakex-reference
      - name: Preserve complete original-only reports and all failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-skylakex-original-reference
          retention-days: 90
          if-no-files-found: warn
          path: |
            build/matrix-skylakex-reference/*.json
            build/matrix-skylakex-reference/*.txt
            build/matrix-skylakex-reference/*.stdout
            build/matrix-skylakex-reference/*.stderr
            build/matrix-skylakex-reference/source-inputs/**
            build/matrix-skylakex-reference/reports/**
