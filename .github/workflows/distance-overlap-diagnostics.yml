name: Installed Ubuntu NumPy dispatch diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
      BLIS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e27633bf9186bb7cab5c1d0b9fbf1584c94c6b81
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Verify runner disk headroom
        run: python -c "import shutil; assert shutil.disk_usage('.').free >= 30 * 1024**3"
      - uses: actions/download-artifact@v4
        with:
          name: parity-package-ubuntu-latest
          path: ${{ runner.temp }}/scikit-imagexx-failed-wheel
          run-id: '44207792316'
          github-token: ${{ github.token }}
      - name: Compare exact failed nodes in fresh processes
        run: python -B diagnostic-ci-linux.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-ubuntu-numpy-dispatch-diagnostic
          path: diagnostic-evidence/
