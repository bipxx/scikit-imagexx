name: Installed Ubuntu packed float Lab x86-v4 performance
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Frozen candidate source from strict parity receipt
        required: true
        type: string
      parity_run:
        description: Exact run with the admitted optimized installed product
        required: true
        type: string
      receipt_sha256:
        description: SHA256 of the complete installed-parity receipt
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PRODUCT_SOURCE: ${{ inputs.source_revision }}
      PARITY_RUN: ${{ inputs.parity_run }}
      EXPECTED_STRICT_RECEIPT_SHA256: ${{ inputs.receipt_sha256 }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
      BLIS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Verify runner disk headroom
        run: python -c "import shutil; assert shutil.disk_usage('.').free >= 30 * 1024**3"
      - uses: actions/download-artifact@v4
        with:
          name: parity-package-ubuntu-latest
          path: ${{ runner.temp }}/scikit-imagexx-failed-wheel
          run-id: '44207792316'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: installed-ubuntu-cie-f32-diagnostic
          path: ${{ runner.temp }}/scikit-imagexx-strict-proof
          run-id: ${{ inputs.parity_run }}
          github-token: ${{ github.token }}
      - name: Measure the exact installed product at one thread
        run: python -B diagnostic-cie-f32-v4-speed.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-ubuntu-cie-f32-v4-speed
          path: speed-proof/
