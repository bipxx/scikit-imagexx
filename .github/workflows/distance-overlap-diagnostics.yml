name: Exact candidate Ubuntu rescale one-thread gate
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact ordinary CI source revision
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRODUCT_SOURCE: ${{ inputs.source_revision }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Check exact clean source and capacity before build
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SOURCE"
          test -z "$(git status --porcelain)"
          python -c "import os, shutil; assert os.confstr('CS_GNU_LIBC_VERSION') == 'glibc 2.43'; assert shutil.disk_usage('.').free >= 30 * 1024**3"
          mkdir -p build/ci-artifacts
          {
            uname -a
            getconf GNU_LIBC_VERSION
            gcc --version
            python --version
          } | tee build/ci-artifacts/producer-identity.log
      - name: Use the exact ordinary wheel and runtime recipe
        run: |
          set -euo pipefail
          python -m pip wheel ".[test]" "numpy==2.5.4" "scipy==1.18.1" cmake --wheel-dir build/wheels
          python -m pip install --no-index --find-links build/wheels "scikit-imagexx[test]" "numpy==2.5.4" "scipy==1.18.1" cmake
          python tools/ci_measurement_artifacts.py inventory
      - name: Exact exposure public parity with normal dispatch
        run: python -m pytest -q tests/test_exposure.py --junitxml=build/ci-artifacts/rescale-producer-normal.xml
      - name: Exact exposure public parity with SIMD disabled
        env:
          SKIMAGEXX_DISABLE_SIMD: '1'
        run: python -m pytest -q tests/test_exposure.py --junitxml=build/ci-artifacts/rescale-producer-disabled.xml
      - name: Freeze exact offline measurement artifacts
        run: |
          set -euo pipefail
          python -m pip freeze > build/ci-artifacts/runtime-freeze.txt
          python -m pip wheel --find-links build/wheels --wheel-dir build/wheels -r build/ci-artifacts/runtime-freeze.txt
          python tools/ci_measurement_artifacts.py freeze --wheel-dir build/wheels --artifact build/ci-artifacts/measurement.json
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-rescale-package
          path: |
            source/build/wheels/*.whl
            source/build/ci-artifacts/
  measure:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PRODUCT_SOURCE: ${{ inputs.source_revision }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
      BLIS_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Verify runner identity and headroom
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$PRODUCT_SOURCE"
          python -c "import os, shutil; assert os.confstr('CS_GNU_LIBC_VERSION') == 'glibc 2.43'; assert shutil.disk_usage('.').free >= 30 * 1024**3"
          mkdir proof
          {
            cat /etc/os-release
            uname -a
            getconf GNU_LIBC_VERSION
            python --version
            gcc --version
            g++ --version
          } | tee proof/runner-identity.log
      - uses: actions/download-artifact@v4
        with:
          name: candidate-rescale-package
          path: prepared
      - name: Install and authenticate exact ordinary CI product
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-index --no-deps --require-hashes --find-links prepared/wheels -r prepared/ci-artifacts/runtime-lock.txt
          cp prepared/ci-artifacts/{measurement.json,runtime-lock.txt,producer-identity.log,rescale-producer-normal.xml,rescale-producer-disabled.xml} proof/
          cd source
          python tools/ci_measurement_artifacts.py verify --wheel-dir ../prepared/wheels --artifact ../prepared/ci-artifacts/measurement.json | tee ../proof/verify-before.log
      - name: Measure native rescale in fresh processes
        shell: bash
        run: |
          set -euo pipefail
          python -B diagnostic-rescale-speed.py normal | tee proof/normal.log
          SKIMAGEXX_DISABLE_SIMD=1 python -B diagnostic-rescale-speed.py disabled | tee proof/disabled.log
          cd source
          python tools/ci_measurement_artifacts.py verify --wheel-dir ../prepared/wheels --artifact ../prepared/ci-artifacts/measurement.json | tee ../proof/verify-after.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-ubuntu-rescale-speed
          path: proof/
