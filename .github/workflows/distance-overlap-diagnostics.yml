name: Frozen ordinary measurements with corrected grid comparison
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact ordinary producer revision
        required: true
        type: string
      ordinary_run:
        description: Exact ordinary run with both completed producer jobs
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PRODUCT_SOURCE: ${{ inputs.source_revision }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Check the exact producer source and space
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$PRODUCT_SOURCE"
          python -c "import shutil; assert shutil.disk_usage('.').free >= 30 * 1024**3"
          mkdir proof
      - uses: actions/download-artifact@v4
        with:
          name: parity-package-${{ matrix.os }}
          path: prepared
          run-id: ${{ inputs.ordinary_run }}
          github-token: ${{ github.token }}
      - name: Install and verify the exact offline input
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-index --no-deps --require-hashes --find-links prepared/wheels -r prepared/ci-artifacts/runtime-lock.txt
          cd source
          python tools/ci_measurement_artifacts.py verify --wheel-dir ../prepared/wheels --artifact ../prepared/ci-artifacts/measurement.json | tee ../proof/verify-before.log
      - name: Ordinary measurement coverage.py
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python -c 'import hashlib, pathlib, sys; path=pathlib.Path("benchmarks/coverage.py").resolve(); raw=pathlib.Path("../benchmarks/coverage.py").read_bytes(); assert hashlib.sha256(raw).hexdigest()=="d7074de93b6d0145bc57325d9df1b86aad8d36d01f3545e94ece758b8d46abc6"; sys.argv[0]=str(path); sys.path.insert(0,str(path.parent)); exec(compile(raw,str(path),"exec"),{"__name__":"__main__","__file__":str(path)})' --sizes 64 --threads 1 --repeat 1 --output ../proof/ci-performance.json
      - name: Ordinary measurement integral.py
        shell: bash
        working-directory: source
        run: python benchmarks/integral.py --size 32 --threads 1 --repeat 1 --output ../proof/ci-integral.json
      - name: Ordinary measurement integrate.py
        shell: bash
        working-directory: source
        run: python benchmarks/integrate.py --size 32 --threads 1 --repeat 1 --output ../proof/ci-integrate.json
      - name: Ordinary measurement downscale.py
        shell: bash
        working-directory: source
        run: python benchmarks/downscale.py --size 32 --threads 1 --repeat 1 --output ../proof/ci-downscale.json
      - name: Ordinary measurement contrast.py
        shell: bash
        working-directory: source
        run: python benchmarks/contrast.py --size 32 --threads 1 --repeat 1 --output ../proof/ci-contrast.json
      - name: Ordinary measurement gaussian.py
        shell: bash
        working-directory: source
        run: python benchmarks/gaussian.py --size 32 --threads 1 --repeat 1 --output ../proof/ci-gaussian.json
      - name: Ordinary measurement metadata.py
        shell: bash
        working-directory: source
        run: python benchmarks/metadata.py --sizes 32 --threads 1 --repeat 1 --output ../proof/ci-metadata.json
      - name: Ordinary measurement conversions.py
        shell: bash
        working-directory: source
        run: python benchmarks/conversions.py --size 64 --threads 1 --dtypes uint16 int16 --output ../proof/ci-conversions.json
      - name: Ordinary measurement color.py
        shell: bash
        working-directory: source
        run: python benchmarks/color.py --size 32 --threads 1 --output ../proof/ci-color-layouts.json
      - name: Ordinary measurement perceptual.py
        shell: bash
        working-directory: source
        run: python benchmarks/perceptual.py --size 32 --threads 1 --output ../proof/ci-perceptual.json
      - name: Ordinary measurement stains.py
        shell: bash
        working-directory: source
        run: python benchmarks/stains.py --size 32 --threads 1 --repeat 1 --output ../proof/ci-stains.json
      - name: Ordinary measurement farid.py
        shell: bash
        working-directory: source
        run: python benchmarks/farid.py --size 32 --threads 1 --repeat 1 --output ../proof/ci-farid.json
      - name: Ordinary measurement edges.py
        shell: bash
        working-directory: source
        run: python benchmarks/edges.py --size 32 --threads 1 --repeat 1 --output ../proof/ci-edges.json
      - name: Ordinary measurement alpha.py
        shell: bash
        working-directory: source
        run: python benchmarks/alpha.py --size 32 --threads 1 --repeat 1 --output ../proof/ci-alpha.json
      - name: Ordinary measurement local_thresholds.py
        shell: bash
        working-directory: source
        run: python benchmarks/local_thresholds.py --size 32 --threads 1 --repeat 1 --output ../proof/ci-local-thresholds.json
      - name: Ordinary measurement thresholds.py
        shell: bash
        working-directory: source
        run: python benchmarks/thresholds.py --size 32 --threads 1 --repeat 1 --output ../proof/ci-thresholds.json
      - name: Ordinary measurement minimum.py
        shell: bash
        working-directory: source
        run: python benchmarks/minimum.py --size 32 --threads 1 --repeat 1 --output ../proof/ci-minimum.json
      - name: Ordinary measurement li.py
        shell: bash
        working-directory: source
        run: python benchmarks/li.py --size 32 --threads 1 --repeat 1 --output ../proof/ci-li.json
      - name: Ordinary measurement adaptive.py
        shell: bash
        working-directory: source
        run: python benchmarks/adaptive.py --size 32 --threads 1 --repeat 1 --output ../proof/ci-adaptive.json
      - name: Ordinary measurement rank_order.py
        shell: bash
        working-directory: source
        run: python benchmarks/rank_order.py --size 32 --threads 1 --repeat 1 --output ../proof/ci-rank-order.json
      - name: Ordinary measurement hysteresis.py
        shell: bash
        working-directory: source
        run: python benchmarks/hysteresis.py --size 32 --threads 1 --repeat 1 --output ../proof/ci-hysteresis.json
      - name: Ordinary measurement sparse.py
        shell: bash
        working-directory: source
        run: python benchmarks/sparse.py --size 32 --threads 1 --repeat 1 --output ../proof/ci-sparse.json
      - name: Ordinary measurement median.py
        shell: bash
        working-directory: source
        run: python benchmarks/median.py --size 32 --threads 1 --repeat 1 --output ../proof/ci-median.json
      - name: Ordinary measurement multiotsu.py
        shell: bash
        working-directory: source
        run: python benchmarks/multiotsu.py --size 32 --threads 1 --repeat 1 --output ../proof/ci-multiotsu.json
      - name: Ordinary measurement clahe.py
        shell: bash
        working-directory: source
        run: python benchmarks/clahe.py --size 32 --threads 1 --repeat 1 --output ../proof/ci-clahe.json
      - name: Ordinary measurement label_colors.py
        shell: bash
        working-directory: source
        run: python benchmarks/label_colors.py --size 32 --threads 1 --repeat 1 --output ../proof/ci-label-colors.json
      - name: Ordinary measurement distance.py
        shell: bash
        working-directory: source
        run: python benchmarks/distance.py --size 32 --threads 1 --repeat 1 --output ../proof/ci-distance.json
      - name: Ordinary measurement morphology.py
        shell: bash
        working-directory: source
        run: python benchmarks/morphology.py --size 32 --threads 1 --repeat 1 --output ../proof/ci-morphology.json
      - name: Ordinary measurement match_histograms.py
        shell: bash
        working-directory: source
        run: python benchmarks/match_histograms.py --size 32 --threads 1 --repeat 1 --output ../proof/ci-match-histograms.json
      - name: Verify the same offline inputs after measurements
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd source
          python tools/ci_measurement_artifacts.py verify --wheel-dir ../prepared/wheels --artifact ../prepared/ci-artifacts/measurement.json | tee ../proof/verify-after.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-ordinary-measurements-${{ matrix.os }}
          path: proof/
