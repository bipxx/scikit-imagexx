name: weighted-distance-correction
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  PIP_NO_CACHE_DIR: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Require the failed CI host profile and scratch capacity
        run: |
          python3 - <<'PY'
          import os, platform, shutil
          assert platform.freedesktop_os_release()['VERSION_ID'] == '26.04'
          assert os.confstr('CS_GNU_LIBC_VERSION') == 'glibc 2.43'
          sizes = {k: shutil.disk_usage(os.environ[k]).free for k in ('GITHUB_WORKSPACE', 'RUNNER_TEMP')}
          print(sizes)
          assert min(sizes.values()) >= 30*1024**3
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - name: Build once and check installed Python and SDK parity
        run: python -B tools/diagnostics/validate_weighted_correction.py parity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weighted-correction-product-${{ github.run_id }}
          path: build/weighted-validation/
          if-no-files-found: warn
  measure:
    needs: parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require the failed CI host profile and scratch capacity
        run: |
          python3 - <<'PY'
          import os, platform, shutil
          assert platform.freedesktop_os_release()['VERSION_ID'] == '26.04'
          assert os.confstr('CS_GNU_LIBC_VERSION') == 'glibc 2.43'
          sizes = {k: shutil.disk_usage(os.environ[k]).free for k in ('GITHUB_WORKSPACE', 'RUNNER_TEMP')}
          print(sizes)
          assert min(sizes.values()) >= 30*1024**3
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - uses: actions/download-artifact@v4
        with:
          name: weighted-correction-product-${{ github.run_id }}
          path: build/weighted-validation/
      - name: Measure the admitted installed product on a fresh runner
        run: python -B tools/diagnostics/validate_weighted_correction.py measure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weighted-correction-speed-${{ github.run_id }}
          path: |
            build/weighted-validation/measure-entry.json
            build/weighted-validation/benchmark-terminal.json
            build/weighted-validation/speed-result.json
            build/weighted-validation/distance.json
            build/weighted-validation/distance.md
          if-no-files-found: warn
