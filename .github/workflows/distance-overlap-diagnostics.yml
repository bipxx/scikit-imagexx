name: Installed Ubuntu strict arithmetic diagnostic
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Frozen candidate source
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRODUCT_SOURCE: ${{ inputs.source_revision }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
      BLIS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Verify runner disk headroom
        run: python -c "import shutil; assert shutil.disk_usage('.').free >= 30 * 1024**3"
      - uses: actions/download-artifact@v4
        with:
          name: parity-package-ubuntu-latest
          path: ${{ runner.temp }}/scikit-imagexx-failed-wheel
          run-id: '44207792316'
          github-token: ${{ github.token }}
      - name: Validate strict arithmetic with the retained runtime inputs
        run: python -B diagnostic-strict-ubuntu.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-ubuntu-strict-diagnostic
          path: proof/
