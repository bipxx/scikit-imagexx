name: Packed float32 Lab direct parity
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact frozen wide-polynomial source
        required: true
        type: string
permissions:
  contents: read
jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCT_SOURCE: ${{ inputs.source_revision }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
      BLIS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Verify disk headroom and direct parity
        run: python3 -B diagnostic-cie-wide-direct.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packed-f32-wide-direct-proof
          path: proof/
