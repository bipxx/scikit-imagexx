name: Float64 Lab same-host native comparison
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
      BLIS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Authenticate both products and compare on one eligible CPU
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B diagnostic-f64-transfers.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packed-f64-native-same-host-proof
          path: proof/
