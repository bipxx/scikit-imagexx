name: distance-overlap-diagnostics
on:
  workflow_dispatch:
jobs:
  diagnose:
    strategy:
      matrix:
        replica: [1, 2]
        numpy: ['1.24.4', '2.5.4']
    runs-on: ubuntu-latest
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip wheel . --no-deps --wheel-dir build/wheels
      - if: matrix.numpy == '1.24.4'
        run: python -m pip install "numpy==1.24.4" "scipy>=1.11,<1.16" "scikit-image==0.26.0" "pytest>=8"
      - if: matrix.numpy != '1.24.4'
        run: python -m pip install "numpy==2.5.4" "scikit-image==0.26.0" "pytest>=8"
      - run: python -m pip install --no-deps build/wheels/*.whl
      - run: python tools/diagnose_distance_precision.py > build/precision.json
      - run: python tools/diagnose_distance_overlap.py > build/overlap.json
      - run: python -m pytest -q tests/test_distance_math_provider.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distance-overlap-${{ matrix.numpy }}-${{ matrix.replica }}
          path: |
            build/precision.json
            build/overlap.json
            build/wheels/*.whl
