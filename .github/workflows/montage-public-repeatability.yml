name: montage-public-repeatability
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  OMP_WAIT_POLICY: PASSIVE
  PYTHONOPTIMIZE: '0'
  PYTHONNOUSERSITE: '1'
  PYTHONUNBUFFERED: '1'
  PYTEST_ADDOPTS: ''
  PYTEST_PLUGINS: ''
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      BASELINE_RUN: '40758210302'
      BASELINE_REVISION: '390dff892ad13c1f9b8cee0e76dce9a016f14c01'
      CANDIDATE_RUN: '40766081804'
      CANDIDATE_REVISION: '61b4f79821b0c7fd0d224e2a12d4263d14308cb7'
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - name: Authenticate successful CI products
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          lscpu > results/cpu.txt
          uname -a > results/platform.txt
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          assert os.environ['CANDIDATE_RUN'] == '40766081804'
          assert os.environ['CANDIDATE_REVISION'] == '61b4f79821b0c7fd0d224e2a12d4263d14308cb7'
          assert os.environ['BASELINE_RUN'] == '40758210302'
          assert os.environ['BASELINE_REVISION'] == '390dff892ad13c1f9b8cee0e76dce9a016f14c01'
          for role in ('baseline', 'candidate'):
              run, revision = (os.environ[role.upper() + suffix] for suffix in ('_RUN', '_REVISION'))
              assert re.fullmatch('[1-9][0-9]*', run) and re.fullmatch('[0-9a-f]{40}', revision)
              base = 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/'
              def api(endpoint):
                  raw = subprocess.check_output(['gh', 'api', base + endpoint])
                  Path('results', role + '-' + endpoint.split('?')[0].split('/')[-1] + '.json').write_bytes(raw)
                  return json.loads(raw)
              record = api('runs/' + run)
              assert str(record['id']) == run and record['head_sha'] == revision
              assert record['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
              assert record['path'] == '.github/workflows/ci.yml'
              assert record['status'] == 'completed' and record['conclusion'] == 'success'
              jobs = api('runs/' + run + '/jobs?per_page=100')
              minimum = [job for job in jobs['jobs'] if job['name'] == 'measure-minimum']
              assert len(minimum) == 1 and minimum[0]['conclusion'] == 'success'
              timing = [step for step in minimum[0]['steps'] if step['name'].startswith('Run python benchmarks/')]
              assert len(timing) == 27 and all(step['conclusion'] == 'skipped' for step in timing)
              listing = api('runs/' + run + '/artifacts?per_page=100')
              assert listing['total_count'] == len(listing['artifacts'])
              matches = [a for a in listing['artifacts'] if a['name'] == 'ci-performance-minimum']
              assert len(matches) == 1
              item = matches[0]
              assert not item['expired'] and 0 < item['size_in_bytes'] < 512 * 1024**2
              assert item['workflow_run']['id'] == int(run) and item['workflow_run']['head_sha'] == revision
              assert re.fullmatch('sha256:[0-9a-f]{64}', item['digest'])
              if role == 'baseline':
                  assert item['id'] == 12846458475
                  assert item['digest'] == 'sha256:d064c77793dbadd81c8de20e108f49467d19ffa59910fbccdd8609061cd42b89'
              else:
                  assert item['id'] == 12849749460
                  assert item['digest'] == 'sha256:c4420f7d4e95d4cb85ffcbd66e24ac7ee8c0f5684b8619b061663a2b98697989'
              Path('results', role + '-selection.json').write_text(json.dumps(item, indent=2) + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: '390dff892ad13c1f9b8cee0e76dce9a016f14c01'
          path: snapshots/baseline
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: '61b4f79821b0c7fd0d224e2a12d4263d14308cb7'
          path: snapshots/candidate
          fetch-depth: 1
      - name: Download exact CI ZIPs and install both runtimes offline
        shell: bash
        run: |
          set -euo pipefail
          for role in baseline candidate; do
            id=$(python -c "import json; print(json.load(open('results/$role-selection.json'))['id'])")
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/$role-prepared.zip"
            ROLE="$role" python - <<'PY'
          import hashlib, io, json, os, re, stat, zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path, PurePosixPath
          role = os.environ['ROLE']; folder = Path('snapshots', role, 'build')
          selected = json.loads(Path('results', role + '-selection.json').read_bytes())
          archive = Path(os.environ['RUNNER_TEMP'], role + '-prepared.zip')
          actual = dict(bytes=archive.stat().st_size, sha256=hashlib.sha256(archive.read_bytes()).hexdigest())
          Path('results', role + '-archive.json').write_text(json.dumps(actual, indent=2) + '\n')
          assert actual['bytes'] == selected['size_in_bytes'] and 'sha256:' + actual['sha256'] == selected['digest']
          with zipfile.ZipFile(archive) as z:
              names = z.namelist(); assert len(names) == len(set(names))
              assert sum(i.file_size for i in z.infolist()) < 2 * 1024**3
              for i in z.infolist():
                  p = PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in i.filename
                  assert not stat.S_ISLNK(i.external_attr >> 16)
              z.extractall(folder)
          prepared = folder / 'prepared/ci-artifacts'
          # latest_only baselines and prepare_only candidates need no standalone timing JSONs here.
          manifest = json.loads((prepared / 'measurement.json').read_bytes())
          assert manifest['schema'] == 'ci-offline-measurement-v1'
          assert manifest['source']['revision'] == os.environ[role.upper() + '_REVISION']
          source = Path('snapshots',role)
          for name,pin in manifest['source']['files_sha256'].items():
              assert hashlib.sha256((source/name).read_bytes().replace(b'\r\n',b'\n')).hexdigest() == pin, name
          assert len(manifest['wheels']) == 14
          assert len(manifest['runtime']['sdk_sha256']) == 81
          products = [name for name, value in manifest['wheels'].items() if value['name'] == 'scikit-imagexx']
          assert len(products) == 1 and len(manifest['wheels']) - len(products) == 13
          for name, value in manifest['wheels'].items():
              assert hashlib.sha256((folder / 'prepared/wheels' / name).read_bytes()).hexdigest() == value['sha256']
          with zipfile.ZipFile(folder / 'prepared/wheels' / products[0]) as product:
              assert len([n for n in product.namelist() if not n.endswith('/')]) == 172
              static_names = [n for n in product.namelist() if n == 'lib/libskimagexx.a']
              assert len(static_names) == 1
              product_names = product.namelist()
              core_names = [n for n in product_names if n.startswith('skimagexx/_core.') and n.endswith('.so')]
              assert len(core_names) == 1
              core_bytes = product.read(core_names[0])
          snapshot = Path('snapshots', role)
          assert hashlib.sha256((snapshot / 'benchmarks/montage.py').read_bytes().replace(b'\r\n', b'\n')).hexdigest() == '93a0dc6c08da84a705880d7f01e751a47f11e12728aa3d28c19112da5d236bdd'
          assert hashlib.sha256((snapshot / 'coverage/contracts/montage-benchmark.json').read_bytes()).hexdigest() == '434d7540206cd2adcf3253bc097e36db7131a15b0c6054fa06b2c97fd5da3d68'
          for family, count in (('inertia-tensor', 115), ('inertia-eigvals', 69), ('moments', 203), ('window', 179),
                                ('lpi', 161), ('butterworth', 175), ('moments-derived', 155),
                                ('normalized-layouts', 22), ('immutable-bytes', 134),
                                ('moments-coords', 98), ('shannon-entropy', 61), ('rgb2yuv-storage', 37),
                                ('block-reduce', 145), ('perimeter-crofton', 101), ('perimeter', 111), ('euler-number', 91),
                                ('polygon', 86), ('mesh-surface-area', 89), ('profile-line', 93), ('blur-effect', 121), ('compare-images', 109), ('profile-coordinates', 51),
                                ('level-set', 161), ('level-set-pipeline', 163), ('map-array', 103), ('map-array-pipeline', 103), ('label-points', 99), ('label-points-pipeline', 100),
                                ('unique-rows', 107), ('unique-rows-pipeline', 107), ('regular-seeds', 109), ('regular-seeds-pipeline', 109), ('montage', 322), ('rolling-ball-kernels', 230), ('color-transforms-regression', 1848)):
              for mode in ('normal', 'scalar'):
                  tree = ET.fromstring((prepared / (family + '-' + mode + '.xml')).read_bytes())
                  assert len(tree.findall('.//testcase')) == count
                  assert not any(tree.findall('.//' + tag) for tag in ('failure', 'error', 'skipped'))
          for family, count in (('blur-effect-intake', 4), ('polygon-intake', 4), ('euler-number-intake', 4), ('block-reduce-integer-width', 9)):
              tree = ET.fromstring((prepared / (family + '.xml')).read_bytes())
              assert len(tree.findall('.//testcase')) == count
              assert not any(tree.findall('.//' + tag) for tag in ('failure', 'error', 'skipped'))
          smoke = json.loads((prepared / 'feature-smoke.json').read_bytes())
          assert smoke['status'] == 'passed' and smoke['exit_code'] == 0
          assert smoke['outcomes'] == {'passed': 1443} and len(smoke['results']) == 1443
          assert smoke['implementations']['native-partial'] + smoke['implementations']['metadata'] == 248
          assert smoke['implementations']['native-partial'] == 245 and smoke['implementations']['metadata'] == 3
          if role == 'candidate':
              old, new = (json.loads(Path('snapshots', r, 'build/prepared/ci-artifacts/measurement.json').read_bytes()) for r in ('baseline', 'candidate'))
              for key in ('python', 'implementation', 'cache_tag', 'machine', 'system', 'dependency_libraries_sha256'):
                  assert old['runtime'][key] == new['runtime'][key], key
              assert {k: v for k, v in old['runtime']['versions'].items() if k != 'scikit-imagexx'} == {k: v for k, v in new['runtime']['versions'].items() if k != 'scikit-imagexx'}
              for name in ('numpy', 'scipy', 'skimage'):
                  assert old['runtime']['packages_sha256'][name] == new['runtime']['packages_sha256'][name], name
              assert {k: v for k, v in old['wheels'].items() if v['name'] != 'scikit-imagexx'} == {k: v for k, v in new['wheels'].items() if v['name'] != 'scikit-imagexx'}, 'all13 runtime dependency wheels exact; no normalization authorized'
              contract = 'coverage/contracts/montage-wrapper-simd-candidate.json'
              assert new['source']['files_sha256'][contract] == 'f39a341c447b872e1d2ec9b77d50fc5fb6a79d8d374ce5cd6574f4bfc975d3df'
              assert hashlib.sha256(Path('snapshots/candidate', contract).read_bytes()).hexdigest() == 'f39a341c447b872e1d2ec9b77d50fc5fb6a79d8d374ce5cd6574f4bfc975d3df'
              before, after = (value['source']['files_sha256'] for value in (old,new))
              added = {'src/montage_simd.hpp','src/simd_montage_avx2.cpp','src/montage_wrapper.cpp'}
              allowed = added | {'src/montage.cpp','CMakeLists.txt','tests/test_montage_native.cpp',contract}
              assert set(after) - set(before) == added | {contract} and not (set(before)-set(after))
              assert {n for n in after if before.get(n) != after[n]} == allowed
              old_generic = Path('snapshots/baseline/src/montage.cpp').read_bytes()
              new_generic = Path('snapshots/candidate/src/montage.cpp').read_bytes()
              assert old_generic.count(b'void montage_into(') == new_generic.count(b'void montage_generic_into(') == 1
              assert new_generic.replace(b'void montage_generic_into(',b'void montage_into(',1) == old_generic
              # Only the four prospectively reviewed wrapper/AVX2 registrations differ.
              old_cmake = Path('snapshots/baseline/CMakeLists.txt').read_bytes()
              new_cmake = Path('snapshots/candidate/CMakeLists.txt').read_bytes()
              lines = new_cmake.splitlines(keepends=True)
              registrations = [line for line in lines if b'simd_montage_avx2.cpp' in line or b'montage_wrapper.cpp' in line]
              assert len(registrations) == 4
              assert b''.join(line for line in lines if line not in registrations) == old_cmake
              assert old['runtime']['sdk_sha256'].keys() == new['runtime']['sdk_sha256'].keys()
              assert len(new['runtime']['sdk_sha256']) == 81
              assert [n for n in old['runtime']['sdk_sha256'] if old['runtime']['sdk_sha256'][n] != new['runtime']['sdk_sha256'][n]] == ['lib/libskimagexx.a']
              packages = [value['runtime']['packages_sha256']['skimagexx'] for value in (old,new)]
              assert packages[0].keys() == packages[1].keys()
              changed = [n for n in packages[0] if packages[0][n] != packages[1][n]]
              assert len(changed) == 1 and changed[0].startswith('_core.') and changed[0].endswith('.so')
              delta = {n: [before.get(n), after.get(n)] for n in sorted(before.keys() | after.keys()) if before.get(n) != after.get(n)}
              Path('results/source-delta.json').write_text(json.dumps(delta, indent=2) + '\n')
          PY
            python -m venv "$RUNNER_TEMP/env-$role"
            "$RUNNER_TEMP/env-$role/bin/python" -m pip install --no-index --no-deps --only-binary=:all: --require-hashes --find-links "snapshots/$role/build/prepared/wheels" -r "snapshots/$role/build/prepared/ci-artifacts/runtime-lock.txt" 2>&1 | tee "results/$role-offline-install.log"
            "$RUNNER_TEMP/env-$role/bin/python" "snapshots/$role/tools/ci_measurement_artifacts.py" verify --wheel-dir "snapshots/$role/build/prepared/wheels" --artifact "snapshots/$role/build/prepared/ci-artifacts/measurement.json" 2>&1 | tee "results/$role-original-identity.log"
          done
      - name: Freeze one permitted CPU and the unchanged-measure launcher
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          contract=Path('controller/coverage/contracts/montage-public-repeatability.json')
          c=json.loads(contract.read_bytes())
          permitted=sorted(os.sched_getaffinity(0));assert permitted
          assert c['order']==['A','B','B','A','B','A','A','B']
          for role in ('baseline','candidate'):
              assert hashlib.sha256(Path('snapshots',role,'benchmarks/run.py').read_bytes().replace(b'\r\n',b'\n')).hexdigest()==c['measure_sha256']
          Path('results/dispatch-contract.json').write_bytes(contract.read_bytes())
          Path('results/affinity.json').write_text(json.dumps(dict(initial_permitted=permitted,cpu=permitted[0],scope='One CPU selected before all eight independent subprocesses'))+'\n')
          PY
          cat > results/launch.py <<'PY'
          import hashlib,json,os,runpy,sys,traceback
          from pathlib import Path
          source,output,cpu,label,role=sys.argv[1:]
          source=Path(source).resolve();output=Path(output).resolve();cpu=int(cpu)
          output.mkdir(parents=True,exist_ok=True)
          os.sched_setaffinity(0,{cpu});assert os.sched_getaffinity(0)=={cpu}
          contract_path=output.parent/'dispatch-contract.json'
          contract=json.loads(contract_path.read_bytes())
          initial=dict(status='STARTED',pid=os.getpid(),parent_pid=os.getppid(),affinity=sorted(os.sched_getaffinity(0)),pass_label=label,role=role,argv=sys.argv,contract_sha256=hashlib.sha256(contract_path.read_bytes()).hexdigest())
          (output/'process-before.json').write_text(json.dumps(initial,indent=2)+'\n')
          completed=0;failure=None
          try:
              sys.path.insert(0,str(source/'benchmarks'))
              import run
              assert hashlib.sha256(Path(run.__file__).read_bytes().replace(b'\r\n',b'\n')).hexdigest()==contract['measure_sha256']
              delegate=run.measure
              def retain_measure(*args,**kwargs):
                  global completed
                  assert len(args)==4 and args[2:]==(7,19) and not kwargs
                  result=delegate(*args,**kwargs)
                  case_id=contract['case_ids'][completed]
                  with (output/'returned-measures.jsonl').open('a')as stream:
                      stream.write(json.dumps(dict(case_index=completed,case_id=case_id,status='PENDING_FINAL_HARNESS_VALIDATION',timing=result))+'\n');stream.flush()
                  completed+=1
                  return result
              run.measure=retain_measure
              sys.argv=[str(source/'benchmarks/montage.py'),'--threads','1','--repeat','7','--output',str(output/'montage.json')]
              runpy.run_path(sys.argv[0],run_name='__main__')
              assert completed==9 and os.sched_getaffinity(0)=={cpu}
          except BaseException as error:
              failure=dict(type=type(error).__name__,text=str(error),traceback=traceback.format_exc())
              raise
          finally:
              final=dict(initial,status='FAILED'if failure else'COMPLETE',affinity_after=sorted(os.sched_getaffinity(0)),completed_measures=completed,failure=failure,report_exists=(output/'montage.json').is_file(),unreturned_measure_samples='Unavailable if current measure fails; all previously returned timing dictionaries retained')
              (output/'process-after.json').write_text(json.dumps(final,indent=2)+'\n')
          PY
      - name: Measure eight unchanged full-public passes in frozen ABBA BAAB order
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME SKIMAGEXX_DISABLE_SIMD
          cpu=$(python -c 'import json;print(json.load(open("results/affinity.json"))["cpu"])')
          failed=0
          for pass in 1-baseline 2-candidate 3-candidate 4-baseline 5-candidate 6-baseline 7-baseline 8-candidate; do
            role=${pass#*-}; py="$RUNNER_TEMP/env-$role/bin/python"; output="$GITHUB_WORKSPACE/results/$pass"
            mkdir "$output"
            cd "$GITHUB_WORKSPACE/snapshots/$role"
            before=0
            "$py" tools/ci_measurement_artifacts.py verify --wheel-dir build/prepared/wheels --artifact build/prepared/ci-artifacts/measurement.json > "$output/identity-before.log" 2>&1 || before=$?
            echo "$before" > "$output/identity-before-exit.txt"
            status=125
            if [ "$before" -eq 0 ]; then
              status=0
              "$py" "$GITHUB_WORKSPACE/results/launch.py" "$PWD" "$output" "$cpu" "$pass" "$role" > "$output/montage.log" 2>&1 || status=$?
            fi
            echo "$status" > "$output/benchmark-exit.txt"
            after=0
            "$py" tools/ci_measurement_artifacts.py verify --wheel-dir build/prepared/wheels --artifact build/prepared/ci-artifacts/measurement.json > "$output/identity-after.log" 2>&1 || after=$?
            echo "$after" > "$output/identity-after-exit.txt"
            if [ "$before" -ne 0 ] || [ "$status" -ne 0 ] || [ "$after" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Validate complete raw reports and describe repeatability without acceptance gates
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,math,runpy,statistics
          from pathlib import Path
          contract=json.loads(Path('results/dispatch-contract.json').read_bytes())
          cpu=json.loads(Path('results/affinity.json').read_bytes())['cpu']
          specs=json.loads(Path('snapshots/baseline/coverage/contracts/montage-benchmark.json').read_bytes())
          expected={r['case_id']:r for r in specs['cases']}
          order=['1-baseline','2-candidate','3-candidate','4-baseline','5-candidate','6-baseline','7-baseline','8-candidate']
          reports=[];pids=[]
          for name in order:
              folder=Path('results',name);role=name.split('-',1)[1];source=Path('snapshots',role)
              for kind in ('benchmark','identity-before','identity-after'):assert (folder/(kind+'-exit.txt')).read_text().strip()=='0',name
              manifest_raw=(source/'build/prepared/ci-artifacts/measurement.json').read_bytes();manifest=json.loads(manifest_raw)
              identity=dict(status='verify',revision=manifest['source']['revision'],wheel_count=14,artifact_sha256=hashlib.sha256(manifest_raw).hexdigest())
              for when in ('before','after'):assert json.loads((folder/('identity-'+when+'.log')).read_bytes())==identity
              before=json.loads((folder/'process-before.json').read_bytes());after=json.loads((folder/'process-after.json').read_bytes())
              assert before['pass_label']==after['pass_label']==name and before['role']==after['role']==role
              assert before['status']=='STARTED' and after['status']=='COMPLETE' and after['failure']is None
              assert before['affinity']==after['affinity']==after['affinity_after']==[cpu]
              assert before['pid']==after['pid'] and after['completed_measures']==9;pids.append(after['pid'])
              report=json.loads((folder/'montage.json').read_bytes());meta=report['metadata'];rows=report['results']
              fingerprint=runpy.run_path(str(source/'benchmarks/provenance.py'))['source_fingerprint'](source)
              assert meta['source_before']==fingerprint and all(meta[k]==v for k,v in fingerprint.items())
              assert meta['python']==manifest['runtime']['python'] and meta['numpy']=='1.24.4' and meta['scipy']=='1.15.3' and meta['reference']=='0.26.0'
              assert meta['threads']==1 and meta['repeat']==7 and meta['target_ms']==19 and meta['raw_samples']==126
              assert meta['harness_sha256']==contract['harness_sha256'] and meta['contract_sha256']==contract['workload_sha256']
              assert meta['fallback_enabled']is False and meta['avx2']is True and meta['selected_apis']==['util.montage']
              assert meta['reference_pool_limits']=={k:'1'for k in contract['pool_variables']}
              cores=[v for n,v in manifest['runtime']['packages_sha256']['skimagexx'].items()if n.endswith('.so')]
              assert len(cores)==1 and meta['core_sha256']==cores[0]
              for key in ('scope','provider_frontier','timed_boundary'):assert meta[key]==specs[key]
              assert meta['original_source_sha256']==specs['original_python_source_sha256']
              journal=[json.loads(line)for line in (folder/'returned-measures.jsonl').read_text().splitlines()]
              assert [row['case_id']for row in rows]==contract['case_ids'] and len(journal)==9
              for i,row in enumerate(rows):
                  assert all(row[k]==v for k,v in expected[row['case_id']].items())
                  assert row['api']=='util.montage' and row['backend']=='native' and row['threads']==1
                  assert row['native_accepted']is True and row['actual_C_returns']==['montage_apply'] and row['native_entry_module']=='skimagexx._core'
                  assert row['max_abs_error']==0 and row['output_sha256']==row['oracle_sha256']
                  assert len(row['output_sha256'])==64 and int(row['output_sha256'],16)>=0
                  assert row['sample_labels']==['scikit-image','current'] and list(map(len,row['samples_ms']))==[7,7]
                  assert len(row['loops'])==2 and all(type(v)is int and v>0 for v in row['loops'])
                  assert all(math.isfinite(v)and v>0 for samples in row['samples_ms']for v in samples)
                  a,b=map(statistics.median,row['samples_ms']);assert (a,b,a/b)==(row['reference_ms'],row['cpp_ms'],row['speedup'])
                  item=journal[i];assert item['case_index']==i and item['case_id']==row['case_id'] and item['status']=='PENDING_FINAL_HARNESS_VALIDATION'
                  assert all(row[k]==v for k,v in item['timing'].items())
              reports.append({r['case_id']:r for r in rows})
          assert len(set(pids))==8
          rows=[]
          for case_id in contract['case_ids']:
              values=[r[case_id]for r in reports];first=values[0]
              for field in ('shape','dtype','layout','grid','padding','fill','channel_axis','output_metadata','output_sha256','oracle_sha256'):assert all(v[field]==first[field]for v in values)
              rows.append(dict(case_id=case_id,reference_ms=[v['reference_ms']for v in values],cpp_ms=[v['cpp_ms']for v in values],original_over_cpp=[v['speedup']for v in values],null_pairs=[dict(passes=[a,b],cpp_ratio=values[a-1]['cpp_ms']/values[b-1]['cpp_ms'],reference_ratio=values[a-1]['reference_ms']/values[b-1]['reference_ms'],normalized_ratio=values[b-1]['speedup']/values[a-1]['speedup'])for a,b in contract['same_product_null_pairs']]))
          summary=dict(status='DIAGNOSTIC_COMPLETE_NO_ACCEPTANCE_DECISION',scope=contract['scope'],order=order,pids=pids,affinity=[cpu],raw_samples=1008,rows=rows,interpretation='Repeatability and reference drift on this fresh host only. Null pairs B2/B3 and A6/A7 use identical products. No causal claim about the old host or changed closed decisions.')
          Path('results/repeatability.json').write_text(json.dumps(summary,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: montage-public-repeatability-raw
          path: results/
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error
