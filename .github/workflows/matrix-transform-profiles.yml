name: Matrix default BLAS profile discovery

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact frozen private kernel/binder source (review required)
        required: true
        default: 7b8094fdc321f789c40b3d6f2a4bb25436469bc6
        type: string

permissions:
  contents: read

jobs:
  discover:
    name: default-${{ matrix.profile }}-UNACCEPTED
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: windows
            os: windows-latest
            python: '3.13'
          - profile: modern
            os: ubuntu-24.04
            python: '3.13'
          - profile: minimum
            os: ubuntu-24.04
            python: '3.11'
          - profile: debug
            os: ubuntu-24.04
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      MATRIX_SOURCE_REVISION: ${{ inputs.source_revision }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
    steps:
      - name: Checkout reviewed controller
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact private source separately
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_revision }}
          path: build/matrix-profile-source
          fetch-depth: 1
          persist-credentials: false
      - name: Existing hosted Python ABI
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Metadata plan before any native preparation
        shell: bash
        run: |
          python tools/matrix_transform_profiles.py plan --profile '${{ matrix.profile }}' --source-root build/matrix-profile-source --output 'build/matrix-default-${{ matrix.profile }}'
      - name: Genuine tiny private build and untimed complete discovery
        shell: bash
        run: |
          python tools/matrix_transform_profiles.py all --profile '${{ matrix.profile }}' --source-root build/matrix-profile-source --output 'build/matrix-default-${{ matrix.profile }}'
      - name: Retain scientific rows and all terminal failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-default-discovery-${{ matrix.profile }}
          retention-days: 90
          if-no-files-found: warn
          compression-level: 6
          path: |
            build/matrix-default-${{ matrix.profile }}/artifact/**
            build/matrix-default-${{ matrix.profile }}/*.json
            build/matrix-default-${{ matrix.profile }}/*.stdout
            build/matrix-default-${{ matrix.profile }}/*.stderr
            build/matrix-default-${{ matrix.profile }}/*.gz
