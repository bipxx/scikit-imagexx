name: frangi-precision-diagnostics
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip wheel . --no-deps --wheel-dir build/wheels
      - run: python -m pip install numpy==2.5.4 scipy==1.18.1 scikit-image==0.26.0
      - shell: bash
        run: python -m pip install --no-deps build/wheels/*.whl
      - shell: bash
        run: python tools/diagnose_frangi_precision.py > build/frangi-precision.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frangi-precision-linux
          path: |
            build/frangi-precision.json
            build/wheels/*.whl
