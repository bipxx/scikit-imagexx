name: profile-coordinates-same-host
on:
  workflow_dispatch:
    inputs:
      baseline_run:
        type: string
        required: true
        default: '40645607032'
      baseline_revision:
        type: string
        required: true
        default: 'e190a76500ebd33f3a2d3cb2aee26668a486b72f'
      candidate_run:
        type: string
        required: true
      candidate_revision:
        type: string
        required: true
permissions:
  contents: read
  actions: read
env:
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  OMP_WAIT_POLICY: PASSIVE
  PYTHONOPTIMIZE: '0'
  PYTHONNOUSERSITE: '1'
  PYTHONUNBUFFERED: '1'
  PYTEST_ADDOPTS: ''
  PYTEST_PLUGINS: ''
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      BASELINE_RUN: ${{ inputs.baseline_run }}
      BASELINE_REVISION: ${{ inputs.baseline_revision }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - name: Authenticate successful CI products
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          lscpu > results/cpu.txt
          uname -a > results/platform.txt
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          assert os.environ['BASELINE_RUN'] == '40645607032'
          assert os.environ['BASELINE_REVISION'] == 'e190a76500ebd33f3a2d3cb2aee26668a486b72f'
          assert os.environ['CANDIDATE_REVISION'] == '0e8b9de6ed849f12b23330c50b374cd4caa8de63'
          for role in ('baseline', 'candidate'):
              run, revision = (os.environ[role.upper() + suffix] for suffix in ('_RUN', '_REVISION'))
              assert re.fullmatch('[1-9][0-9]*', run) and re.fullmatch('[0-9a-f]{40}', revision)
              base = 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/'
              def api(endpoint):
                  raw = subprocess.check_output(['gh', 'api', base + endpoint])
                  Path('results', role + '-' + endpoint.split('?')[0].split('/')[-1] + '.json').write_bytes(raw)
                  return json.loads(raw)
              record = api('runs/' + run)
              assert str(record['id']) == run and record['head_sha'] == revision
              assert record['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
              assert record['path'] == '.github/workflows/ci.yml'
              assert record['status'] == 'completed' and record['conclusion'] == 'success'
              listing = api('runs/' + run + '/artifacts?per_page=100')
              assert listing['total_count'] == len(listing['artifacts'])
              matches = [a for a in listing['artifacts'] if a['name'] == 'ci-performance-minimum']
              assert len(matches) == 1
              item = matches[0]
              assert not item['expired'] and 0 < item['size_in_bytes'] < 512 * 1024**2
              assert item['workflow_run']['id'] == int(run) and item['workflow_run']['head_sha'] == revision
              assert re.fullmatch('sha256:[0-9a-f]{64}', item['digest'])
              if role == 'baseline':
                  assert item['id'] == 12798011912
                  assert item['digest'] == 'sha256:8aa52e2ac8f1466c4be0f7fe59f5d457367f77becdbbd9d45276b4c0a7135e88'
              Path('results', role + '-selection.json').write_text(json.dumps(item, indent=2) + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline_revision }}
          path: snapshots/baseline
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_revision }}
          path: snapshots/candidate
          fetch-depth: 1
      - name: Download exact CI ZIPs and install both runtimes offline
        shell: bash
        run: |
          set -euo pipefail
          for role in baseline candidate; do
            id=$(python -c "import json; print(json.load(open('results/$role-selection.json'))['id'])")
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/$role-prepared.zip"
            ROLE="$role" python - <<'PY'
          import ast, hashlib, json, os, re, stat, zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path, PurePosixPath
          def assert_existing_sources():
              def read(role, name):
                  return Path('snapshots', role, name).read_text(encoding='utf-8')
              # The rejected sampler-address/finite-scan candidate must not enter this experiment.
              for name, marker, closing in (
                  ('src/resample.cpp', '\nbool profile_coordinates_into(', '\n}'),
                  ('src/simd_resample_avx2.cpp', '\nstd::size_t profile_coordinate_row(', '\n} // namespace skimagexx::simd')):
                  old, new = (read(role, name) for role in ('baseline', 'candidate'))
                  prefix, tail = old.rsplit(closing, 1)
                  assert new.count(marker) == 1 and new.split(marker, 1)[0] == prefix, name
                  assert new.endswith(closing + tail), name
              old, new = (read(role, 'src/resample_detail.hpp') for role in ('baseline', 'candidate'))
              new = re.sub(r'\nstd::size_t profile_coordinate_(?:row|single)\([^;]+;', '', new)
              new = re.sub(r'\n// Prepared C float64 center lines;[^\n]+\n// FP state[^\n]+\nbool profile_coordinates_into\([^;]+;', '', new)
              assert new == old, 'old zoom/sampler declarations remain exact'
              old, new = (read(role, 'src/bind_profile_line.cpp') for role in ('baseline', 'candidate'))
              start, end = new.index('    module.def("profile_coordinates"'), new.index('    module.def("profile_sample"')
              assert new[:start] + new[end:] == old, 'old sampling binder remains exact'
              old, new = (ast.parse(read(role, 'python/skimagexx/_profile_line.py')) for role in ('baseline', 'candidate'))
              helper = next(n for n in new.body if isinstance(n, ast.FunctionDef) and n.name == '_line_profile_coordinates')
              additions = [n for n in helper.body if isinstance(n, ast.If) and any(isinstance(v, ast.Name) and v.id == 'native_coordinates' for v in ast.walk(n))]
              assert len(additions) == 1
              helper.body.remove(additions[0])
              assert ast.dump(new) == ast.dump(old), 'literal helper prelude/fallback and public sampler/flip/reducer remain exact'
              old, new = (read(role, 'CMakeLists.txt') for role in ('baseline', 'candidate'))
              start = new.index('    add_executable(test_profile_coordinates_native')
              end = new.index('    add_executable(test_polygon_native', start)
              assert new[:start] + new[end:] == old, 'only additive coordinate CTest targets may change build configuration'
              old, new = (read(role, '.github/workflows/ci.yml') for role in ('baseline', 'candidate'))
              new, count = re.subn(r'^      - name: Profile coordinate exact words and protocol parity(?: with SIMD disabled)?\n(?:(?!^      - ).*\n)*', '', new, flags=re.M)
              assert count == 2 and new == old, 'only two additive coordinate parity steps may change CI'
          role = os.environ['ROLE']; folder = Path('snapshots', role, 'build')
          selected = json.loads(Path('results', role + '-selection.json').read_bytes())
          archive = Path(os.environ['RUNNER_TEMP'], role + '-prepared.zip')
          actual = dict(bytes=archive.stat().st_size, sha256=hashlib.sha256(archive.read_bytes()).hexdigest())
          Path('results', role + '-archive.json').write_text(json.dumps(actual, indent=2) + '\n')
          assert actual['bytes'] == selected['size_in_bytes'] and 'sha256:' + actual['sha256'] == selected['digest']
          with zipfile.ZipFile(archive) as z:
              names = z.namelist(); assert len(names) == len(set(names))
              assert sum(i.file_size for i in z.infolist()) < 2 * 1024**3
              for i in z.infolist():
                  p = PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in i.filename
                  assert not stat.S_ISLNK(i.external_attr >> 16)
              z.extractall(folder)
          prepared = folder / 'prepared/ci-artifacts'
          # latest_only baselines and prepare_only candidates need no standalone timing JSONs here.
          manifest = json.loads((prepared / 'measurement.json').read_bytes())
          assert manifest['schema'] == 'ci-offline-measurement-v1'
          assert manifest['source']['revision'] == os.environ[role.upper() + '_REVISION']
          assert len(manifest['wheels']) == 14
          for family, count in (('inertia-tensor', 115), ('inertia-eigvals', 69), ('moments', 203), ('window', 179),
                                ('lpi', 161), ('butterworth', 175), ('moments-derived', 155),
                                ('normalized-layouts', 22), ('immutable-bytes', 134),
                                ('moments-coords', 98), ('shannon-entropy', 61), ('rgb2yuv-storage', 37),
                                ('block-reduce', 145), ('perimeter-crofton', 101), ('perimeter', 111), ('euler-number', 91),
                                ('polygon', 86), ('mesh-surface-area', 89), ('profile-line', 93), ('blur-effect', 121),
                                ('color-transforms-regression', 1848)):
              for mode in ('normal', 'scalar'):
                  tree = ET.fromstring((prepared / (family + '-' + mode + '.xml')).read_bytes())
                  assert len(tree.findall('.//testcase')) == count
                  assert not any(tree.findall('.//' + tag) for tag in ('failure', 'error', 'skipped'))
          if role == 'candidate':
              for mode in ('normal', 'scalar'):
                  tree = ET.fromstring((prepared / ('profile-coordinates-' + mode + '.xml')).read_bytes())
                  assert len(tree.findall('.//testcase')) == 51
                  assert not any(tree.findall('.//' + tag) for tag in ('failure', 'error', 'skipped'))
          for family, count in (('blur-effect-intake', 4), ('polygon-intake', 4), ('euler-number-intake', 4), ('block-reduce-integer-width', 9)):
              tree = ET.fromstring((prepared / (family + '.xml')).read_bytes())
              assert len(tree.findall('.//testcase')) == count
              assert not any(tree.findall('.//' + tag) for tag in ('failure', 'error', 'skipped'))
          smoke = json.loads((prepared / 'feature-smoke.json').read_bytes())
          assert smoke['status'] == 'passed' and smoke['exit_code'] == 0
          assert smoke['outcomes'] == {'passed': 1413} and len(smoke['results']) == 1413
          assert smoke['implementations']['native-partial'] + smoke['implementations']['metadata'] == 238
          if role == 'candidate':
              old, new = (json.loads(Path('snapshots', r, 'build/prepared/ci-artifacts/measurement.json').read_bytes()) for r in ('baseline', 'candidate'))
              for key in ('python', 'implementation', 'cache_tag', 'machine', 'system', 'dependency_libraries_sha256'):
                  assert old['runtime'][key] == new['runtime'][key], key
              assert {k: v for k, v in old['runtime']['versions'].items() if k not in ('scikit-imagexx', 'pytest')} == {k: v for k, v in new['runtime']['versions'].items() if k not in ('scikit-imagexx', 'pytest')}
              for name in ('numpy', 'scipy', 'skimage'):
                  assert old['runtime']['packages_sha256'][name] == new['runtime']['packages_sha256'][name], name
              assert {k: v for k, v in old['wheels'].items() if v['name'] not in ('scikit-imagexx', 'pytest')} == {k: v for k, v in new['wheels'].items() if v['name'] not in ('scikit-imagexx', 'pytest')}
              baseline_pytest = {'pytest-9.2.0-py3-none-any.whl': dict(name='pytest', version='9.2.0', sha256='07acdcf88ec174f907dc01af70bf52d49b014bbab03faeeade31c96b18c2e588')}
              assert {n: v for n, v in old['wheels'].items() if v['name'] == 'pytest'} == baseline_pytest
              assert old['runtime']['versions']['pytest'] == '9.2.0'
              candidate_pytest = [(n, v) for n, v in new['wheels'].items() if v['name'] == 'pytest']
              assert len(candidate_pytest) == 1
              filename, record = candidate_pytest[0]
              assert set(record) == {'name', 'version', 'sha256'} and record['name'] == 'pytest'
              assert filename == 'pytest-' + record['version'] + '-py3-none-any.whl'
              assert re.fullmatch('[0-9a-f]{64}', record['sha256'])
              assert new['runtime']['versions']['pytest'] == record['version']
              common = {'.github/workflows/ci.yml', 'benchmarks/coverage.py', 'benchmarks/rgb2yuv_storage.py', 'benchmarks/run.py',
                        'benchmarks/provenance.py', 'tools/ci_measurement_artifacts.py',
                        'tools/run_feature_tests.py', 'tests/inertia_tensor_cases.py', 'tests/test_inertia_tensor_public.py',
                        'tests/inertia_eigvals_cases.py', 'tests/test_inertia_eigvals_public.py',
                        'tests/moments_cases.py', 'tests/test_moments_public.py',
                        'tests/moments_derived_cases.py', 'tests/test_moments_derived_public.py',
                        'tests/window_cases.py', 'tests/test_window_public.py',
                        'tests/lpi_filter_cases.py', 'tests/test_lpi_filter_public.py',
                        'tests/butterworth_cases.py', 'tests/test_butterworth_public.py',
                        'benchmarks/normalized_layouts_cases.json', 'tests/test_normalized_layouts_public.py',
                        'tests/test_immutable_buffer_roots_public.py',
                        'tests/moments_coords_cases.py', 'tests/test_moments_coords_public.py',
                        'tests/shannon_entropy_cases.py', 'tests/test_shannon_entropy_public.py',
                        'tests/rgb2yuv_storage_cases.py', 'tests/test_rgb2yuv_storage_public.py', 'tests/test_color_transforms.py',
                        'tests/block_reduce_cases.py', 'tests/test_block_reduce_public.py',
                        'tests/perimeter_crofton_cases.py', 'tests/test_perimeter_crofton_public.py',
                        'benchmarks/profile_line.py', 'tests/profile_line_cases.py', 'tests/test_profile_line_public.py'}
              for value in (old, new):
                  assert common <= value['source']['files_sha256'].keys()
              mutable = {'python/skimagexx/_profile_line.py', 'src/bind_profile_line.cpp',
                         'src/resample.cpp', 'src/resample_detail.hpp', 'src/simd_resample_avx2.cpp',
                         'CMakeLists.txt', 'tests/test_profile_coordinates_native.cpp',
                         'tests/profile_coordinates_golden.hpp', '.gitattributes', '.github/workflows/ci.yml',
                         'tests/profile_coordinates_cases.py', 'tests/test_profile_coordinates_public.py'}
              old_fixed, new_fixed = ({k: v for k, v in value['source']['files_sha256'].items()
                                      if k not in mutable} for value in (old, new))
              assert old_fixed == new_fixed, 'only frozen coordinate production/test/CI files may change'
              added = {'tests/test_profile_coordinates_native.cpp', 'tests/profile_coordinates_golden.hpp',
                       'tests/profile_coordinates_cases.py', 'tests/test_profile_coordinates_public.py'}
              assert mutable - added <= old['source']['files_sha256'].keys()
              assert mutable <= new['source']['files_sha256'].keys()
              assert_existing_sources()
          PY
            python -m venv "$RUNNER_TEMP/env-$role"
            "$RUNNER_TEMP/env-$role/bin/python" -m pip install --no-index --no-deps --only-binary=:all: --require-hashes --find-links "snapshots/$role/build/prepared/wheels" -r "snapshots/$role/build/prepared/ci-artifacts/runtime-lock.txt" 2>&1 | tee "results/$role-offline-install.log"
            "$RUNNER_TEMP/env-$role/bin/python" "snapshots/$role/tools/ci_measurement_artifacts.py" verify --wheel-dir "snapshots/$role/build/prepared/wheels" --artifact "snapshots/$role/build/prepared/ci-artifacts/measurement.json" 2>&1 | tee "results/$role-original-identity.log"
          done
      - name: Normalize only the test runner to the retained baseline wheel
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from copy import deepcopy
          import hashlib, json, shutil
          from pathlib import Path
          baseline = Path('snapshots/baseline/build/prepared')
          original = json.loads((baseline / 'ci-artifacts/measurement.json').read_bytes())
          filename, record = next((n, v) for n, v in original['wheels'].items() if v['name'] == 'pytest')
          assert record == dict(name='pytest', version='9.2.0', sha256='07acdcf88ec174f907dc01af70bf52d49b014bbab03faeeade31c96b18c2e588')
          normalized = []
          for role in ('baseline', 'candidate'):
              prepared = Path('snapshots', role, 'build/prepared')
              target = prepared.parent / 'measurement-v2'; (target / 'wheels').mkdir(parents=True)
              raw = (prepared / 'ci-artifacts/measurement.json').read_bytes(); value = json.loads(raw)
              prior = {n: v for n, v in value['wheels'].items() if v['name'] == 'pytest'}
              updated = deepcopy(value)
              updated['wheels'] = {n: v for n, v in value['wheels'].items() if v['name'] != 'pytest'}
              updated['wheels'][filename] = record
              updated['runtime']['versions']['pytest'] = '9.2.0'
              for name, item in updated['wheels'].items():
                  source = baseline / 'wheels' / name if item['name'] == 'pytest' else prepared / 'wheels' / name
                  assert hashlib.sha256(source.read_bytes()).hexdigest() == item['sha256']
                  shutil.copyfile(source, target / 'wheels' / name)
              lock = ''.join(f"{v['name']}=={v['version']} --hash=sha256:{v['sha256']}\n" for v in sorted(updated['wheels'].values(), key=lambda v: v['name']))
              (target / 'runtime-lock.txt').write_text(lock, encoding='utf-8')
              (target / 'pytest-lock.txt').write_text(f"pytest==9.2.0 --hash=sha256:{record['sha256']}\n", encoding='utf-8')
              updated['lock_sha256'] = hashlib.sha256((target / 'runtime-lock.txt').read_bytes()).hexdigest()
              (target / 'measurement.json').write_text(json.dumps(updated, indent=2) + '\n')
              expected = deepcopy(updated); expected['wheels'] = value['wheels']; expected['runtime']['versions']['pytest'] = value['runtime']['versions']['pytest']; expected['lock_sha256'] = value['lock_sha256']
              assert expected == value and (prepared / 'ci-artifacts/measurement.json').read_bytes() == raw
              normalized.append(updated)
              Path('results', role + '-normalization.json').write_text(json.dumps(dict(original_manifest_sha256=hashlib.sha256(raw).hexdigest(), normalized_manifest_sha256=hashlib.sha256((target / 'measurement.json').read_bytes()).hexdigest(), old_pytest=prior, new_pytest={filename: record}), indent=2) + '\n')
              shutil.copyfile(target / 'measurement.json', Path('results', role + '-normalized-measurement.json'))
              shutil.copyfile(target / 'runtime-lock.txt', Path('results', role + '-normalized-runtime-lock.txt'))
          assert {n: v for n, v in normalized[0]['wheels'].items() if v['name'] != 'scikit-imagexx'} == {n: v for n, v in normalized[1]['wheels'].items() if v['name'] != 'scikit-imagexx'}
          PY
          for role in baseline candidate; do
            "$RUNNER_TEMP/env-$role/bin/python" -m pip install --no-index --no-deps --only-binary=:all: --require-hashes --force-reinstall --find-links "snapshots/$role/build/measurement-v2/wheels" -r "snapshots/$role/build/measurement-v2/pytest-lock.txt" 2>&1 | tee "results/$role-normalized-install.log"
            "$RUNNER_TEMP/env-$role/bin/python" "snapshots/$role/tools/ci_measurement_artifacts.py" verify --wheel-dir "snapshots/$role/build/measurement-v2/wheels" --artifact "snapshots/$role/build/measurement-v2/measurement.json" 2>&1 | tee "results/$role-normalized-identity.log"
          done
      - name: Measure the fixed18 Profile cases in ABBA order
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME SKIMAGEXX_DISABLE_SIMD
          for pass in 1-baseline 2-candidate 3-candidate 4-baseline; do
            role=${pass#*-}; py="$RUNNER_TEMP/env-$role/bin/python"; output="$GITHUB_WORKSPACE/results/$pass"
            mkdir "$output"
            cd "$GITHUB_WORKSPACE/snapshots/$role"
            "$py" tools/ci_measurement_artifacts.py verify --wheel-dir build/measurement-v2/wheels --artifact build/measurement-v2/measurement.json 2>&1 | tee "$output/identity-before.log"
            status=0
            "$py" benchmarks/profile_line.py --threads 1 --repeat 7 --output "$output/profile-line.json" 2>&1 | tee "$output/profile-line.log" || status=$?
            echo "$status" > "$output/benchmark-exit.txt"
            "$py" tools/ci_measurement_artifacts.py verify --wheel-dir build/measurement-v2/wheels --artifact build/measurement-v2/measurement.json 2>&1 | tee "$output/identity-after.log"
            test "$status" -eq 0
          done
      - name: Check all four complete raw reports
        shell: bash
        run: |
          python - <<'PY'
          import json, math, runpy, statistics
          from pathlib import Path
          from datetime import datetime, timezone
          deadline = datetime.fromisoformat('2026-10-28T08:53:40.730139+00:00')
          expected = {(side, dtype, width) for side in (256, 1024)
                      for dtype in ('uint8', 'float32', 'float64') for width in (1, 9, 33)}
          reports = []
          for name in ('1-baseline', '2-candidate', '3-candidate', '4-baseline'):
              source = Path('snapshots', name.split('-', 1)[1])
              fingerprint = runpy.run_path(str(source / 'benchmarks/provenance.py'))['source_fingerprint'](source)
              report = json.loads(Path('results', name, 'profile-line.json').read_bytes())
              meta, rows = report['metadata'], report['results']
              assert all(meta[key] == value for key, value in fingerprint.items())
              assert meta['source_before'] == fingerprint
              assert meta['repeat'] == 7 and meta['threads'] == 1 and meta['raw_samples'] == 252
              assert meta['fallback_enabled'] is False and meta['avx2'] is True
              assert meta['reference'] == '0.26.0' and meta['numpy'] == '1.24.4'
              assert meta['selected_apis'] == ['measure.profile_line']
              assert meta['harness_sha256'] == '9618c9efe2c716bcd0897084c88daefaf9c707243fa2ca6704c714515b45511c'
              assert set(meta['reference_pool_limits'].values()) == {'1'}
              assert len(rows) == 18
              assert {(r['shape'][0], r['dtype'], r['linewidth']) for r in rows} == expected
              for row in rows:
                  side = row['shape'][0]
                  assert row['shape'] == [side, side] and row['api'] == 'measure.profile_line'
                  assert row['src'] == [.25, 1.5] and row['dst'] == [side - 1.25, side - 1.75]
                  assert row['profile_length'] == (360 if side == 256 else 1446)
                  assert row['sampled_values'] == row['profile_length'] * row['linewidth']
                  assert row['backend'] == 'native' and row['threads'] == 1
                  assert row['native_accepted'] is True and row['actual_C_returns'] == ['profile_sample']
                  assert row['max_abs_error'] == 0 and row['output_raw_hex'] == row['reference_raw_hex']
                  assert row['sample_labels'] == ['scikit-image', 'current']
                  assert list(map(len, row['samples_ms'])) == [7, 7] and all(n > 0 for n in row['loops'])
                  assert all(math.isfinite(v) and v > 0 for samples in row['samples_ms'] for v in samples)
                  a, b = map(statistics.median, row['samples_ms'])
                  assert (a, b, a / b) == (row['reference_ms'], row['cpp_ms'], row['speedup'])
              reports.append({r['case_id']: r for r in rows})
          assert all(r.keys() == reports[0].keys() for r in reports)
          def gm(values):
              return math.exp(statistics.mean(math.log(v) for v in values))
          rows = []
          for key, first in reports[0].items():
              values = [r[key] for r in reports]
              # Input, sampled pixels and public output stay exact across all passes.
              for field in ('shape', 'dtype', 'src', 'dst', 'linewidth', 'profile_length', 'sampled_values',
                            'input_sha256', 'pre_reducer_metadata', 'sample_sha256', 'output_dtype_str',
                            'output_shape', 'output_strides', 'output_raw_hex', 'reference_raw_hex'):
                  assert all(v[field] == first[field] for v in values), (key, field)
              b0, c1, c2, b3 = values
              direct = math.sqrt(b0['cpp_ms'] * b3['cpp_ms'] / (c1['cpp_ms'] * c2['cpp_ms']))
              normalized = math.sqrt(c1['speedup'] * c2['speedup'] / (b0['speedup'] * b3['speedup']))
              candidate_original = math.sqrt(c1['speedup'] * c2['speedup'])
              repeat_direct = max(c1['cpp_ms'], c2['cpp_ms']) < min(b0['cpp_ms'], b3['cpp_ms'])
              repeat_normalized = min(c1['speedup'], c2['speedup']) > max(b0['speedup'], b3['speedup'])
              rows.append(dict(case_id=key, dtype=first['dtype'], linewidth=first['linewidth'],
                  direct_gain=direct, normalized_gain=normalized, candidate_original=candidate_original,
                  repeat_direct=repeat_direct, repeat_normalized=repeat_normalized,
                  baseline_cpp_ms=[b0['cpp_ms'], b3['cpp_ms']], candidate_cpp_ms=[c1['cpp_ms'], c2['cpp_ms']],
                  added_ms=math.sqrt(c1['cpp_ms'] * c2['cpp_ms']) - math.sqrt(b0['cpp_ms'] * b3['cpp_ms'])))
          completed = datetime.now(timezone.utc)
          direct = gm(r['direct_gain'] for r in rows)
          normalized = gm(r['normalized_gain'] for r in rows)
          original = gm(r['candidate_original'] for r in rows)
          targets = [r for r in rows if r['linewidth'] == 33]
          assert len(targets) == 6
          keep = (direct > 1 and normalized > 1 and original > 1
                  and all(r['repeat_direct'] and r['repeat_normalized'] for r in targets) and completed < deadline)
          summary = dict(status='KEEP' if keep else 'DISCARD', completed_utc=completed.isoformat(),
              deadline_utc=deadline.isoformat(), completed_before_deadline=completed < deadline,
              contract_sha256='85d2536b85ecfd6f4d75c9eee3694b081fb909073cb8106061877da9b50c4a70',
              raw_samples=1008, direct_gain=direct, normalized_gain=normalized,
              candidate_original=original, target_repeat_wins=sum(r['repeat_direct'] and r['repeat_normalized'] for r in targets),
              direct_losses=[r['case_id'] for r in rows if r['direct_gain'] < 1],
              normalized_losses=[r['case_id'] for r in rows if r['normalized_gain'] < 1],
              groups={name: dict(cases=len(group), direct_gain=gm(r['direct_gain'] for r in group),
                  normalized_gain=gm(r['normalized_gain'] for r in group), candidate_original=gm(r['candidate_original'] for r in group))
                  for name, group in [('targets_width33', targets), ('controls_width1_9', [r for r in rows if r['linewidth'] != 33])]
                  + [(dtype, [r for r in rows if r['dtype'] == dtype]) for dtype in ('uint8', 'float32', 'float64')]},
              rows=rows)
          Path('results/comparison.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps({k: v for k, v in summary.items() if k != 'rows'}, indent=2))
