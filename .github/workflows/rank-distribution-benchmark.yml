name: rank-distribution-benchmark
on:
  workflow_dispatch:
    inputs:
      workers:
        description: Global native worker limits (one worker is always included)
        type: choice
        options: ['1', '1 4']
        default: '1'

permissions:
  contents: read

jobs:
  prepare:
    name: prepare-${{ matrix.os }}-${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: modern
            python: '3.13'
            numpy: '2.5.4'
            scipy: '1.18.1'
          - os: windows-latest
            runtime: modern
            python: '3.13'
            numpy: '2.5.4'
            scipy: '1.18.1'
          - os: ubuntu-latest
            runtime: minimum
            python: '3.11'
            numpy: '1.24.4'
            scipy: '1.15.3'
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
      RANK_DISTRIBUTION_WORKERS: ${{ inputs.workers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # NumPy2 build headers; minimum runtime uses the same wheel ABI contract.
      - name: Build wheel and retain compiler/dependency log
        shell: bash
        run: |
          mkdir -p build/preparation
          python -m pip wheel . --no-deps --wheel-dir build/wheels --verbose 2>&1 | tee build/preparation/build.log
      - shell: bash
        run: |
          python -m pip install numpy==${{ matrix.numpy }} scipy==${{ matrix.scipy }} scikit-image==0.26.0 pytest
      - name: Install exact wheel
        shell: bash
        run: |
          python -m pip install --no-deps build/wheels/*.whl
      - name: Record exact runtime dependencies
        shell: bash
        run: |
          python -m pip freeze > build/preparation/runtime-freeze.txt
      - name: Preserve exact source and package
        shell: bash
        run: python tools/preserve_baseline.py --wheel build/wheels/*.whl --source-root . --output build/exact-package
      - name: Public contract and harness checks
        run: python -m pytest -q tests/test_rank_distribution_contracts.py tests/test_rank_distribution_pipeline.py tests/test_rank_distribution_benchmark.py tests/test_rank_public.py tests/test_rank_public_admission.py tests/test_rank_integer_warning.py
      - name: Portable public contract
        run: python -m pytest -q tests/test_rank_distribution_contracts.py tests/test_rank_distribution_pipeline.py tests/test_rank_public.py tests/test_rank_public_admission.py tests/test_rank_integer_warning.py
        env:
          SKIMAGEXX_DISABLE_SIMD: '1'
      - name: Fixed untimed corpus gate
        shell: bash
        run: python benchmarks/rank_distribution.py --check-only --threads $RANK_DISTRIBUTION_WORKERS --prepared-source build/exact-package/baseline-source.json --seal-wheel build/wheels/*.whl --output build/preparation/rank-distribution-check.json
      - name: Fixed untimed scalar corpus gate
        shell: bash
        run: python benchmarks/rank_distribution.py --check-only --threads $RANK_DISTRIBUTION_WORKERS --prepared-source build/exact-package/baseline-source.json --output build/preparation/rank-distribution-scalar-check.json
        env:
          SKIMAGEXX_DISABLE_SIMD: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank-distribution-prepared-${{ matrix.os }}-${{ matrix.runtime }}
          retention-days: 90
          path: |
            build/wheels/*.whl
            build/exact-package/
            build/preparation/

  measure:
    name: measure-${{ matrix.os }}-${{ matrix.runtime }}
    # Every preparation job must finish successfully before any measurement.
    # This job installs artifacts; it never compiles code or launches pytest.
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: modern
            python: '3.13'
            numpy: '2.5.4'
            scipy: '1.18.1'
          - os: windows-latest
            runtime: modern
            python: '3.13'
            numpy: '2.5.4'
            scipy: '1.18.1'
          - os: ubuntu-latest
            runtime: minimum
            python: '3.11'
            numpy: '1.24.4'
            scipy: '1.15.3'
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
      RANK_DISTRIBUTION_WORKERS: ${{ inputs.workers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: rank-distribution-prepared-${{ matrix.os }}-${{ matrix.runtime }}
          path: build/prepared
      - run: |
          python -m pip install --only-binary=:all: numpy==${{ matrix.numpy }} scipy==${{ matrix.scipy }} scikit-image==0.26.0
      - name: Install prepared wheel without rebuilding
        shell: bash
        run: |
          python -m pip install --no-deps build/prepared/wheels/*.whl
      - name: Measure fixed public corpus (one-worker result is primary)
        shell: bash
        run: python benchmarks/rank_distribution.py --threads $RANK_DISTRIBUTION_WORKERS --repeat 7 --prepared-source build/prepared/exact-package/baseline-source.json --output build/results/rank-performance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank-performance-${{ matrix.os }}-${{ matrix.runtime }}
          retention-days: 90
          path: |
            build/results/
            build/prepared/wheels/*.whl
            build/prepared/exact-package/
            build/prepared/preparation/
