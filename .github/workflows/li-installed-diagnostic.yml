name: li-installed-diagnostic
on:
  workflow_dispatch:
    inputs:
      controller_revision:
        description: Exact reviewed diagnostic source; must equal selected workflow ref
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: modern
            os: ubuntu-24.04
          - profile: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Stdlib metadata guards before archived binary preparation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python -X utf8 -B -m unittest discover -s tests -p test_li_installed_diagnostic.py -v 2>&1 | tee 'build/li-diagnostic-metadata-${{ matrix.profile }}.log'
      - name: Diagnose archived failed binary without build or timing
        shell: bash
        env:
          CONTROLLER_REVISION: ${{ inputs.controller_revision }}
        run: |
          set -euo pipefail
          mkdir -p build
          python -X utf8 -B tools/li_installed_diagnostic.py --profile '${{ matrix.profile }}' --output 'build/li-diagnostic-${{ matrix.profile }}' --controller-revision "$CONTROLLER_REVISION" 2>&1 | tee 'build/li-diagnostic-${{ matrix.profile }}.log'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: li-failed-product-diagnostic-${{ matrix.profile }}
          retention-days: 90
          include-hidden-files: true
          path: |
            build/li-diagnostic-${{ matrix.profile }}/
            !build/li-diagnostic-${{ matrix.profile }}/payload/**
            build/li-diagnostic-${{ matrix.profile }}.log
            build/li-diagnostic-metadata-${{ matrix.profile }}.log
