name: tv-chambolle-compare-experiment-publication
on:
  workflow_dispatch:
    inputs:
      payload_gzip_base64:
        description: Exact reviewed experiment gzip bytes encoded as base64
        type: string
        required: true
      payload_sha256:
        description: Exact reviewed raw experiment.json SHA256
        type: string
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Authenticate bounded transport and exact frozen metadata only
        shell: bash
        env:
          PAYLOAD_GZIP_BASE64: ${{ inputs.payload_gzip_base64 }}
          PAYLOAD_SHA256: ${{ inputs.payload_sha256 }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python - <<'PY'
          import base64, hashlib, importlib.util, json, os, pathlib, zlib
          RAW_SIZE = 78007
          RAW_SHA = 'f547ba16f384f85df7851b23e05636314f0718da15ec9ba8c1f2fefe16e71afa'
          GZIP_SHA = '522291af59e0bd913b582780e6ee2ed65f8040f98a59243091b42bc6b3e80eeb'
          CONTROLLER = 'd48a17ed41376eecac63f5a5f75bd6ec72a0d6f1'
          SOURCE_SHA = json.loads('{".github/workflows/tv-chambolle-compare.yml":"bdfc59e7dae094fa8ba6ce6dee090fbdcae2b9d81e6d922111626f83cce2f5d3","benchmarks/tv_chambolle_compare.py":"efe8ec9760fe97edfd508c79275f67bd26daf14fc885af3d0692d554d961f038","tests/test_tv_chambolle_compare.py":"7f68fa822d3e6b7111b9e23bb63b70431c9a5063dc28eb52d20d0f7db85f6e22","tools/tv_chambolle_compare_artifacts.py":"5783d6a39efa57f732e3c08a998bf39b9d4c87fea93b141350f5a77bff02caa9"}')

          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)

          def authenticate_payload(encoded, declared_sha, compressed_sha, raw_sha, raw_size):
              require(type(encoded) is str and len(encoded) <= 40000, 'encoded payload exceeds bound')
              require(declared_sha == raw_sha, 'declared raw SHA differs')
              compressed = base64.b64decode(encoded, validate=True)
              require(len(compressed) <= 30000, 'compressed payload exceeds bound')
              require(hashlib.sha256(compressed).hexdigest() == compressed_sha, 'compressed SHA differs')
              decoder = zlib.decompressobj(wbits=31)
              raw = decoder.decompress(compressed, raw_size)
              require(decoder.eof and not decoder.unconsumed_tail and not decoder.unused_data,
                      'truncated, concatenated, or oversized decompression')
              require(len(raw) == raw_size and hashlib.sha256(raw).hexdigest() == raw_sha,
                      'exact raw size/SHA differs')
              return raw

          def validate_certificate(root, raw):
              for name, expected in SOURCE_SHA.items():
                  actual = hashlib.sha256((root / name).read_bytes().replace(b'\r\n', b'\n')).hexdigest()
                  require(actual == expected, 'frozen controller source differs: ' + name)
              path = root / 'tools/tv_chambolle_compare_artifacts.py'
              spec = importlib.util.spec_from_file_location('frozen_tv_publication_validator', path)
              helper = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(helper)
              value = json.loads(raw.decode('utf-8'))
              helper.validate_experiment(value, CONTROLLER)
              return value

          def publish(root, encoded, declared_sha):
              raw = authenticate_payload(encoded, declared_sha, GZIP_SHA, RAW_SHA, RAW_SIZE)
              validate_certificate(root, raw)
              out = root / 'build/tv-cursor-experiment'
              out.mkdir(parents=True)
              target = out / 'experiment.json'
              with target.open('xb') as stream:
                  stream.write(raw)
              require(target.read_bytes() == raw, 'published raw bytes changed')
              print('Authenticated immutable TV experiment:', len(raw), RAW_SHA)
              return target

          if __name__ == '__main__':
              publish(pathlib.Path.cwd(), os.environ['PAYLOAD_GZIP_BASE64'], os.environ['PAYLOAD_SHA256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tv-chambolle-compare-experiment
          path: build/tv-cursor-experiment/experiment.json
          if-no-files-found: error
          retention-days: 90
