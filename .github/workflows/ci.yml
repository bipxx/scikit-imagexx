  debug-gil:
    if: github.event_name != 'workflow_dispatch' || !inputs.minimum_only
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
      # Explicitly retain assertions even if runner/toolchain defaults change.
      CXXFLAGS: -UNDEBUG -UPYBIND11_NO_ASSERT_GIL_HELD_INCREF_DECREF -DPYBIND11_ASSERT_GIL_HELD_INCREF_DECREF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build actual Debug Python extension
        shell: bash
        run: |
          mkdir -p build/debug-proof
          python -m pip wheel . --no-deps --config-settings=cmake.build-type=Debug --wheel-dir build/debug-wheels --verbose 2>&1 | tee build/debug-proof/build.log
          python -m pip install numpy==2.5.4 scipy==1.18.1 scikit-image==0.26.0 pytest
          python -m pip install --no-deps build/debug-wheels/*.whl
      - name: Require active pybind GIL assertions
        run: python tools/ci_measurement_artifacts.py debug-assertions
      - name: Debug binding correctness and GIL regression coverage
        shell: bash
        run: python -m pytest -q tests/test_api.py tests/test_rank_pipeline.py tests/test_rank_callbacks.py tests/test_component_consumers_pipeline.py tests/test_transform_classes_public.py tests/test_footprints_public.py tests/test_footprint_dense_pipeline.py tests/test_footprint_decomposition.py tests/test_footprint_util.py tests/test_resample_core.py tests/test_resample_typed.py tests/test_resize_native_pipeline.py tests/test_alpha_color.py tests/test_frangi.py tests/test_sato.py tests/test_meijering.py --junitxml=build/debug-proof/normal.xml
      - name: Debug scalar binding correctness
        shell: bash
        run: python -m pytest -q tests/test_api.py tests/test_rank_pipeline.py tests/test_rank_callbacks.py tests/test_component_consumers_pipeline.py tests/test_transform_classes_public.py tests/test_footprints_public.py tests/test_footprint_dense_pipeline.py tests/test_footprint_decomposition.py tests/test_footprint_util.py tests/test_resample_core.py tests/test_resample_typed.py tests/test_resize_native_pipeline.py tests/test_alpha_color.py tests/test_frangi.py tests/test_sato.py tests/test_meijering.py --junitxml=build/debug-proof/scalar.xml
        env:
          SKIMAGEXX_DISABLE_SIMD: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-gil-correctness
          path: |
            build/debug-proof/
            build/debug-wheels/
