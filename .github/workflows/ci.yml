name: parity-and-native
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ".[test]" cmake
      - run: python tools/diagnose_color_precision.py
      - run: python tools/diagnose_distance_precision.py
      - run: python tools/inventory.py
      - run: python -m pytest -q
      - run: python benchmarks/coverage.py --sizes 64 --threads 1 --repeat 1 --output build/ci-performance.json
      - run: python benchmarks/integral.py --size 32 --threads 1 --repeat 1 --output build/ci-integral.json
      - run: python benchmarks/integrate.py --size 32 --threads 1 --repeat 1 --output build/ci-integrate.json
      - run: python benchmarks/downscale.py --size 32 --threads 1 --repeat 1 --output build/ci-downscale.json
      - run: python benchmarks/contrast.py --size 32 --threads 1 --repeat 1 --output build/ci-contrast.json
      - run: python benchmarks/gaussian.py --size 32 --threads 1 --repeat 1 --output build/ci-gaussian.json
      - run: python benchmarks/metadata.py --sizes 32 --threads 1 --repeat 1 --output build/ci-metadata.json
      - run: python benchmarks/conversions.py --size 64 --threads 1 --dtypes uint16 int16 --output build/ci-conversions.json
      - run: python benchmarks/color.py --size 32 --threads 1 --output build/ci-color-layouts.json
      - run: python benchmarks/perceptual.py --size 32 --threads 1 --output build/ci-perceptual.json
      - run: python benchmarks/stains.py --size 32 --threads 1 --repeat 1 --output build/ci-stains.json
      - run: python benchmarks/farid.py --size 32 --threads 1 --repeat 1 --output build/ci-farid.json
      - run: python benchmarks/edges.py --size 32 --threads 1 --repeat 1 --output build/ci-edges.json
      - run: python benchmarks/alpha.py --size 32 --threads 1 --repeat 1 --output build/ci-alpha.json
      - run: python benchmarks/local_thresholds.py --size 32 --threads 1 --repeat 1 --output build/ci-local-thresholds.json
      - run: python benchmarks/thresholds.py --size 32 --threads 1 --repeat 1 --output build/ci-thresholds.json
      - run: python benchmarks/minimum.py --size 32 --threads 1 --repeat 1 --output build/ci-minimum.json
      - run: python benchmarks/label_colors.py --size 32 --threads 1 --repeat 1 --output build/ci-label-colors.json
      - run: python benchmarks/distance.py --size 32 --threads 1 --repeat 1 --output build/ci-distance.json
      - run: python benchmarks/morphology.py --size 32 --threads 1 --repeat 1 --output build/ci-morphology.json
      - run: python -m pytest -q
        env:
          SKIMAGEXX_DISABLE_SIMD: '1'
      - run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --config Release
      - run: ctest --test-dir build/native -C Release --output-on-failure
      - run: ctest --test-dir build/native -C Release --output-on-failure
        env:
          OMP_DYNAMIC: 'TRUE'
          OMP_THREAD_LIMIT: '2'
      - run: cmake -S . -B build/portable -DCMAKE_BUILD_TYPE=Release -DSKIMAGEXX_AVX2=OFF -DSKIMAGEXX_OPENMP=OFF
      - run: cmake --build build/portable --config Release
      - run: ctest --test-dir build/portable -C Release --output-on-failure
  numpy-minimum:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Build isolation supplies NumPy2 headers; exercise the resulting wheel
      # with the declared minimum runtime, rather than rebuilding against1.x.
      - run: python -m pip wheel . --no-deps --wheel-dir build/wheels
      - run: python -m pip install "numpy==1.24.4" "scipy>=1.11,<1.16" "scikit-image==0.26.0" "pytest>=8"
      - run: python -m pip install --no-deps build/wheels/*.whl
      - run: python -c "import numpy,skimagexx; assert numpy.__version__ == '1.24.4'; assert skimagexx.get_num_threads() == 1"
      - run: python -m pytest -q tests/test_integral.py tests/test_integral_singletons.py tests/test_downscale.py tests/test_downscale_allocation.py tests/test_low_contrast.py tests/test_threshold_minimum.py tests/test_label_color.py
      - run: python -m pytest -q tests/test_conversion_packets.py tests/test_convert.py tests/test_dtype_aliases.py
