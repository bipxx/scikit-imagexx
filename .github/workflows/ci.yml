      - run: python benchmarks/li.py --size 32 --threads 1 --repeat 1 --output build/ci-li.json
      - run: python benchmarks/adaptive.py --size 32 --threads 1 --repeat 1 --output build/ci-adaptive.json
      - run: python benchmarks/rank_order.py --size 32 --threads 1 --repeat 1 --output build/ci-rank-order.json
      - run: python benchmarks/hysteresis.py --size 32 --threads 1 --repeat 1 --output build/ci-hysteresis.json
      - run: python benchmarks/sparse.py --size 32 --threads 1 --repeat 1 --output build/ci-sparse.json
