name: parity-and-native
on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'coverage/work_items.json'
      - 'benchmarks/*.json'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'coverage/work_items.json'
      - 'benchmarks/*.json'
  workflow_dispatch:
    inputs:
      minimum_only:
        description: Run only the minimum-NumPy parity and performance job
        type: boolean
        default: false
      prepare_only:
        description: Prepare verified offline artifacts without standalone timing
        type: boolean
        default: false
      latest_only:
        description: Time only the newest minimum-Linux API batch; retain all build and parity gates
        type: boolean
        default: false
jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || !inputs.minimum_only
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact historical metadata snapshots
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 9f834bbff351ebbb66f98271bc30c07789495efb
          git fetch --no-tags --depth=1 origin 52066265b89ceecf613c4a5f7d3b73c23b44d58d
          git cat-file -e '9f834bbff351ebbb66f98271bc30c07789495efb^{commit}'
          git cat-file -e '52066265b89ceecf613c4a5f7d3b73c23b44d58d:include/skimagexx/matrix_transform.hpp'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip wheel ".[test]" cmake --wheel-dir build/wheels
      - run: |
          python -m pip install --no-index --find-links build/wheels "scikit-imagexx[test]" cmake
      - run: python tools/diagnose_color_precision.py
      - run: python tools/diagnose_distance_precision.py
      - run: python tools/ci_measurement_artifacts.py inventory
      - name: Authenticate frozen original reconstruction source
        shell: bash
        run: |
          python - <<'PY'
          import ast, hashlib, os
          from pathlib import Path
          root = Path.cwd()
          tree = ast.parse((root / 'benchmarks/reconstruction_cases.py').read_bytes())
          node = next(n for n in tree.body if isinstance(n, ast.Assign)
                      and any(isinstance(t, ast.Name) and t.id == 'PRIMARY_SOURCE_PINS' for t in n.targets))
          pins = ast.literal_eval(node.value)
          source = root / 'tests/data/reconstruction-primary-0.26'
          assert {p.name for p in source.iterdir() if p.is_file()} == set(pins)
          for name, digest in pins.items():
              assert hashlib.sha256((source / name).read_bytes()).hexdigest() == digest, name
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write('SKIMAGEXX_RECONSTRUCTION_PRIMARY_SOURCE=' + source.as_posix() + '\n')
          PY
      - run: python -m pytest -q
      - run: python tools/check_frangi_numpy_dispatch.py --work-dir build/frangi-generic-cpu
      - run: python -m pytest -q
        env:
          SKIMAGEXX_DISABLE_SIMD: '1'
      - run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --config Release
      - run: ctest --test-dir build/native -C Release --output-on-failure
      - run: ctest --test-dir build/native -C Release --output-on-failure
        env:
          OMP_DYNAMIC: 'TRUE'
          OMP_THREAD_LIMIT: '2'
      - run: python tools/check_cmake_install.py --build-dir build/native --work-dir build/install-native --openmp ON
      - run: cmake -S . -B build/portable -DCMAKE_BUILD_TYPE=Release -DSKIMAGEXX_AVX2=OFF -DSKIMAGEXX_OPENMP=OFF
      - run: cmake --build build/portable --config Release
      - run: ctest --test-dir build/portable -C Release --output-on-failure
      - run: python tools/check_cmake_install.py --build-dir build/portable --work-dir build/install-portable --openmp OFF
      - name: Freeze exact offline measurement artifacts
        shell: bash
        run: |
          mkdir -p build/ci-artifacts
          python -m pip freeze > build/ci-artifacts/runtime-freeze.txt
          python -m pip wheel --find-links build/wheels --wheel-dir build/wheels -r build/ci-artifacts/runtime-freeze.txt
          python tools/ci_measurement_artifacts.py freeze --wheel-dir build/wheels --artifact build/ci-artifacts/measurement.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-package-${{ matrix.os }}
          path: |
            build/wheels/*.whl
            build/ci-artifacts/
            build/ci-*.json
            build/install-*/*.log
            build/install-*/commands.json
            build/frangi-generic-cpu/
  numpy-minimum:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Build isolation supplies NumPy2 headers; exercise the resulting wheel
      # with the declared minimum runtime, rather than rebuilding against1.x.
      - run: |
          python -m pip wheel . --no-deps --wheel-dir build/wheels
      - run: |
          python -m pip install "numpy==1.24.4" "scipy>=1.11,<1.16" "scikit-image==0.26.0" "pytest>=8"
      - run: |
          python -m pip install --no-deps build/wheels/*.whl
      - run: python -c "import numpy,skimagexx; assert numpy.__version__ == '1.24.4'; assert skimagexx.get_num_threads() == 1"
      - name: Butterworth owned FFT parity
        run: python -m pytest -q tests/test_butterworth_public.py --junitxml=build/ci-artifacts/butterworth-normal.xml
      - name: Butterworth owned FFT parity with SIMD disabled
        run: python -m pytest -q tests/test_butterworth_public.py --junitxml=build/ci-artifacts/butterworth-scalar.xml
        env:
          SKIMAGEXX_DISABLE_SIMD: '1'
      - name: LPI owned FFT parity
