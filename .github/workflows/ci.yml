  measure:
    if: github.event_name != 'workflow_dispatch' || (!inputs.minimum_only && !inputs.prepare_only && !inputs.latest_only)
    # Matrix-wide correctness barrier; every measurement starts on a fresh VM.
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: parity-package-${{ matrix.os }}
          path: build/prepared
      - name: Install exact offline hash-locked runtime
        shell: bash
        run: |
          python -m pip install --no-index --no-deps --require-hashes --find-links build/prepared/wheels -r build/prepared/ci-artifacts/runtime-lock.txt
      - name: Verify source, wheel, runtime, package and SDK before measurements
        run: python tools/ci_measurement_artifacts.py verify --wheel-dir build/prepared/wheels --artifact build/prepared/ci-artifacts/measurement.json
      - run: python benchmarks/coverage.py --sizes 64 --threads 1 --repeat 1 --output build/ci-performance.json
