name: li-performance
on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Fixed kernel corpus to measure
        type: choice
        options: [li, ciede2000, adaptive, rank-order, hysteresis, correlate-sparse]
        default: li
      paired:
        description: Also compare the preserved initial package
        type: boolean
        default: false
jobs:
  measure:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
    steps:
      - if: inputs.paired && inputs.benchmark == 'correlate-sparse'
        run: python -c "raise ValueError('No initial sparse package is recorded yet')"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip wheel . --no-deps --wheel-dir build/wheels
      - run: python -m pip install "numpy>=2.3" "scikit-image==0.26.0" "pytest>=8"
      - name: Install exact wheel
        shell: bash
        run: python -m pip install --no-deps build/wheels/*.whl
      - name: Preserve exact package
        shell: bash
        run: python tools/preserve_baseline.py --wheel build/wheels/*.whl --source-root . --output build/exact-package
      - if: inputs.benchmark == 'li'
        run: python -m pytest -q tests/test_threshold_li.py tests/test_api.py
      - if: inputs.benchmark == 'ciede2000'
        run: python -m pytest -q tests/test_distance_math_provider.py tests/test_color_distance.py tests/test_ciede2000_promotion.py tests/test_weighted_distance.py
      - if: inputs.benchmark == 'adaptive'
        run: python -m pytest -q tests/test_threshold_local.py tests/test_api.py
      - if: inputs.benchmark == 'rank-order'
        run: python -m pytest -q tests/test_rank_order.py tests/test_api.py
      - if: inputs.benchmark == 'correlate-sparse'
        run: python -m pytest -q tests/test_correlate_sparse.py tests/test_api.py
      - if: inputs.benchmark == 'hysteresis'
        run: python -m pytest -q tests/test_hysteresis.py tests/test_api.py
      - uses: actions/download-artifact@v4
        if: inputs.paired && inputs.benchmark != 'adaptive' && inputs.benchmark != 'rank-order' && inputs.benchmark != 'correlate-sparse' && inputs.benchmark != 'hysteresis'
        with:
          name: li-performance-${{ matrix.os }}
          run-id: 39761807459
          github-token: ${{ github.token }}
          path: build/initial
      - uses: actions/download-artifact@v4
        if: inputs.paired && inputs.benchmark == 'adaptive'
        with:
          name: adaptive-performance-${{ matrix.os }}
          run-id: 39775834198
          github-token: ${{ github.token }}
          path: build/initial
      - uses: actions/download-artifact@v4
        if: inputs.paired && inputs.benchmark == 'rank-order'
        with:
          name: rank-order-performance-${{ matrix.os }}
          run-id: 39782915248
          github-token: ${{ github.token }}
          path: build/initial
      - uses: actions/download-artifact@v4
        if: inputs.paired && inputs.benchmark == 'hysteresis'
        with:
          name: hysteresis-performance-${{ matrix.os }}
          run-id: 39793874955
          github-token: ${{ github.token }}
          path: build/initial
      - if: inputs.paired
        run: python tools/pair_snapshot.py --package-root build/initial/exact-package
      - if: inputs.benchmark == 'li' && !inputs.paired
        run: python benchmarks/li.py --size 512 --threads 1 4 --repeat 7 --output build/li-performance.json
      - if: inputs.benchmark == 'li' && inputs.paired
        run: python benchmarks/li.py --size 512 --threads 1 4 --repeat 7 --baseline-dir build/initial/exact-package --output build/li-performance.json
      - if: inputs.benchmark == 'ciede2000' && !inputs.paired
        run: python benchmarks/ciede2000.py --size 512 --threads 1 4 --repeat 7 --output build/ciede2000-performance.json
      - if: inputs.benchmark == 'ciede2000' && inputs.paired
        run: python benchmarks/ciede2000.py --size 512 --threads 1 4 --repeat 7 --baseline-dir build/initial/exact-package --output build/ciede2000-performance.json
      - if: inputs.benchmark == 'adaptive' && !inputs.paired
        run: python benchmarks/adaptive.py --size 512 --threads 1 4 --repeat 7 --output build/adaptive-performance.json
      - if: inputs.benchmark == 'adaptive' && inputs.paired
        run: python benchmarks/adaptive.py --size 512 --threads 1 4 --repeat 7 --baseline-dir build/initial/exact-package --output build/adaptive-performance.json
      - if: inputs.benchmark == 'rank-order' && !inputs.paired
        run: python benchmarks/rank_order.py --size 512 --threads 1 4 --repeat 7 --output build/rank-order-performance.json
      - if: inputs.benchmark == 'rank-order' && inputs.paired
        run: python benchmarks/rank_order.py --size 512 --threads 1 4 --repeat 7 --baseline-dir build/initial/exact-package --output build/rank-order-performance.json
      - if: inputs.benchmark == 'hysteresis' && !inputs.paired
        run: python benchmarks/hysteresis.py --size 512 --threads 1 4 --repeat 7 --output build/hysteresis-performance.json
      - if: inputs.benchmark == 'hysteresis' && inputs.paired
        run: python benchmarks/hysteresis.py --size 512 --threads 1 4 --repeat 7 --baseline-dir build/initial/exact-package --output build/hysteresis-performance.json
      - if: inputs.benchmark == 'correlate-sparse'
        run: python benchmarks/sparse.py --size 512 --threads 1 4 --repeat 7 --output build/correlate-sparse-performance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.benchmark }}-performance-${{ matrix.os }}
          path: |
            build/*-performance.json
            build/wheels/*.whl
            build/exact-package/
            build/initial/exact-package/
