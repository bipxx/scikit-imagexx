name: li-performance
on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Fixed kernel corpus to measure
        type: choice
        options: [li, ciede2000, adaptive, rank-order, hysteresis, correlate-sparse, median, multiotsu, clahe, gabor-kernel, gabor, symmetric-eigen, structure-tensor, corner-responses, kitchen, hessian, shape-index, hessian-det]
        default: li
      paired:
        description: Also compare the preserved initial package
        type: boolean
        default: false
jobs:
  measure:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
    steps:
      - if: inputs.paired && (inputs.benchmark == 'gabor-kernel' || inputs.benchmark == 'gabor' || inputs.benchmark == 'symmetric-eigen' || inputs.benchmark == 'structure-tensor' || inputs.benchmark == 'corner-responses' || inputs.benchmark == 'kitchen' || inputs.benchmark == 'hessian' || inputs.benchmark == 'shape-index' || inputs.benchmark == 'hessian-det')
        run: python -c "raise SystemExit('Selected initial benchmark has no preserved native baseline yet')"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip wheel . --no-deps --wheel-dir build/wheels
      - run: python -m pip install "numpy>=2.3" "scikit-image==0.26.0" "pytest>=8"
      - name: Install exact wheel
        shell: bash
        run: python -m pip install --no-deps build/wheels/*.whl
      - name: Preserve exact package
        shell: bash
        run: python tools/preserve_baseline.py --wheel build/wheels/*.whl --source-root . --output build/exact-package
      - if: inputs.benchmark == 'li'
        run: python -m pytest -q tests/test_threshold_li.py tests/test_api.py
      - if: inputs.benchmark == 'ciede2000'
        run: python -m pytest -q tests/test_distance_math_provider.py tests/test_color_distance.py tests/test_ciede2000_promotion.py tests/test_weighted_distance.py
      - if: inputs.benchmark == 'adaptive'
        run: python -m pytest -q tests/test_threshold_local.py tests/test_api.py
      - if: inputs.benchmark == 'rank-order'
        run: python -m pytest -q tests/test_rank_order.py tests/test_api.py
      - if: inputs.benchmark == 'multiotsu'
        run: python -m pytest -q tests/test_multiotsu.py tests/test_api.py
      - if: inputs.benchmark == 'clahe'
        run: python -m pytest -q tests/test_clahe.py tests/test_api.py
      - if: inputs.benchmark == 'hessian-det'
        run: python -m pytest -q tests/test_hessian_det.py tests/test_hessian_matrix.py tests/test_api.py
      - if: inputs.benchmark == 'hessian-det'
        run: python -m pytest -q tests/test_hessian_det.py
        env:
          SKIMAGEXX_DISABLE_SIMD: '1'
      - if: inputs.benchmark == 'shape-index'
        run: python -m pytest -q tests/test_shape_index.py tests/test_hessian_matrix.py tests/test_api.py
      - if: inputs.benchmark == 'shape-index'
        run: python -m pytest -q tests/test_shape_index.py
        env:
          SKIMAGEXX_DISABLE_SIMD: '1'
      - if: inputs.benchmark == 'hessian'
        run: python -m pytest -q tests/test_hessian_matrix.py tests/test_structure_tensor.py tests/test_corner_responses.py tests/test_kitchen_rosenfeld.py tests/test_api.py
      - if: inputs.benchmark == 'hessian'
        run: python -m pytest -q tests/test_hessian_matrix.py
        env:
          SKIMAGEXX_DISABLE_SIMD: '1'
      - if: inputs.benchmark == 'kitchen'
        run: python -m pytest -q tests/test_kitchen_rosenfeld.py tests/test_structure_tensor.py tests/test_corner_responses.py tests/test_api.py
      - if: inputs.benchmark == 'kitchen'
        run: python -m pytest -q tests/test_kitchen_rosenfeld.py
        env:
          SKIMAGEXX_DISABLE_SIMD: '1'
      - if: inputs.benchmark == 'corner-responses'
        run: python -m pytest -q tests/test_corner_responses.py tests/test_structure_tensor.py tests/test_api.py
      - if: inputs.benchmark == 'corner-responses'
        run: python -m pytest -q tests/test_corner_responses.py
        env:
          SKIMAGEXX_DISABLE_SIMD: '1'
      - if: inputs.benchmark == 'structure-tensor'
        run: python -m pytest -q tests/test_structure_tensor.py tests/test_api.py
      - if: inputs.benchmark == 'structure-tensor'
        run: python -m pytest -q tests/test_structure_tensor.py
        env:
          SKIMAGEXX_DISABLE_SIMD: '1'
      - if: inputs.benchmark == 'symmetric-eigen'
        run: python -m pytest -q tests/test_symmetric_eigen.py tests/test_api.py
      - if: inputs.benchmark == 'symmetric-eigen'
        run: python -m pytest -q tests/test_symmetric_eigen.py
        env:
          SKIMAGEXX_DISABLE_SIMD: '1'
      - if: inputs.benchmark == 'gabor-kernel'
        run: python -m pytest -q tests/test_gabor_kernel.py tests/test_api.py
      - if: inputs.benchmark == 'gabor'
        run: python -m pytest -q tests/test_gabor.py tests/test_gabor_kernel.py tests/test_api.py
      - if: inputs.benchmark == 'gabor'
        run: python -m pytest -q tests/test_gabor.py tests/test_gabor_kernel.py
        env:
          SKIMAGEXX_DISABLE_SIMD: '1'
      - if: inputs.benchmark == 'gabor-kernel'
        run: python -m pytest -q tests/test_gabor_kernel.py
        env:
          SKIMAGEXX_DISABLE_SIMD: '1'
      - if: inputs.benchmark == 'median'
        run: python -m pytest -q tests/test_median.py tests/test_api.py
      - if: inputs.benchmark == 'correlate-sparse'
        run: python -m pytest -q tests/test_correlate_sparse.py tests/test_api.py
      - if: inputs.benchmark == 'hysteresis'
        run: python -m pytest -q tests/test_hysteresis.py tests/test_api.py
      - uses: actions/download-artifact@v4
        if: inputs.paired && inputs.benchmark != 'adaptive' && inputs.benchmark != 'rank-order' && inputs.benchmark != 'correlate-sparse' && inputs.benchmark != 'median' && inputs.benchmark != 'hysteresis' && inputs.benchmark != 'multiotsu' && inputs.benchmark != 'clahe' && inputs.benchmark != 'gabor-kernel'
        with:
          name: li-performance-${{ matrix.os }}
          run-id: 39761807459
          github-token: ${{ github.token }}
          path: build/initial
      - uses: actions/download-artifact@v4
        if: inputs.paired && inputs.benchmark == 'adaptive'
        with:
          name: adaptive-performance-${{ matrix.os }}
          run-id: 39775834198
          github-token: ${{ github.token }}
          path: build/initial
      - uses: actions/download-artifact@v4
        if: inputs.paired && inputs.benchmark == 'rank-order'
        with:
          name: rank-order-performance-${{ matrix.os }}
          run-id: 39782915248
          github-token: ${{ github.token }}
          path: build/initial
      - uses: actions/download-artifact@v4
        if: inputs.paired && inputs.benchmark == 'hysteresis'
        with:
          name: hysteresis-performance-${{ matrix.os }}
          run-id: 39793874955
          github-token: ${{ github.token }}
          path: build/initial
      - uses: actions/download-artifact@v4
        if: inputs.paired && inputs.benchmark == 'correlate-sparse'
        with:
          name: correlate-sparse-performance-${{ matrix.os }}
          run-id: 39799043191
          github-token: ${{ github.token }}
          path: build/initial
      - uses: actions/download-artifact@v4
        if: inputs.paired && inputs.benchmark == 'median'
        with:
          name: median-performance-${{ matrix.os }}
          run-id: 39829432396
          github-token: ${{ github.token }}
          path: build/initial
      - uses: actions/download-artifact@v4
        if: inputs.paired && inputs.benchmark == 'multiotsu'
        with:
          name: multiotsu-performance-${{ matrix.os }}
          run-id: 39838846191
          github-token: ${{ github.token }}
          path: build/initial
      - uses: actions/download-artifact@v4
        if: inputs.paired && inputs.benchmark == 'clahe'
        with:
          name: clahe-performance-${{ matrix.os }}
          run-id: 39847406392
          github-token: ${{ github.token }}
          path: build/initial
      - if: inputs.paired
        run: python tools/pair_snapshot.py --package-root build/initial/exact-package
      - if: inputs.benchmark == 'li' && !inputs.paired
        run: python benchmarks/li.py --size 512 --threads 1 4 --repeat 7 --output build/li-performance.json
      - if: inputs.benchmark == 'li' && inputs.paired
        run: python benchmarks/li.py --size 512 --threads 1 4 --repeat 7 --baseline-dir build/initial/exact-package --output build/li-performance.json
      - if: inputs.benchmark == 'ciede2000' && !inputs.paired
        run: python benchmarks/ciede2000.py --size 512 --threads 1 4 --repeat 7 --output build/ciede2000-performance.json
      - if: inputs.benchmark == 'ciede2000' && inputs.paired
        run: python benchmarks/ciede2000.py --size 512 --threads 1 4 --repeat 7 --baseline-dir build/initial/exact-package --output build/ciede2000-performance.json
      - if: inputs.benchmark == 'adaptive' && !inputs.paired
        run: python benchmarks/adaptive.py --size 512 --threads 1 4 --repeat 7 --output build/adaptive-performance.json
      - if: inputs.benchmark == 'adaptive' && inputs.paired
        run: python benchmarks/adaptive.py --size 512 --threads 1 4 --repeat 7 --baseline-dir build/initial/exact-package --output build/adaptive-performance.json
      - if: inputs.benchmark == 'rank-order' && !inputs.paired
        run: python benchmarks/rank_order.py --size 512 --threads 1 4 --repeat 7 --output build/rank-order-performance.json
      - if: inputs.benchmark == 'rank-order' && inputs.paired
        run: python benchmarks/rank_order.py --size 512 --threads 1 4 --repeat 7 --baseline-dir build/initial/exact-package --output build/rank-order-performance.json
      - if: inputs.benchmark == 'hysteresis' && !inputs.paired
        run: python benchmarks/hysteresis.py --size 512 --threads 1 4 --repeat 7 --output build/hysteresis-performance.json
      - if: inputs.benchmark == 'hysteresis' && inputs.paired
        run: python benchmarks/hysteresis.py --size 512 --threads 1 4 --repeat 7 --baseline-dir build/initial/exact-package --output build/hysteresis-performance.json
      - if: inputs.benchmark == 'correlate-sparse' && !inputs.paired
        run: python benchmarks/sparse.py --size 512 --threads 1 4 --repeat 7 --output build/correlate-sparse-performance.json
      - if: inputs.benchmark == 'correlate-sparse' && inputs.paired
        run: python benchmarks/sparse.py --size 512 --threads 1 4 --repeat 7 --baseline-dir build/initial/exact-package --output build/correlate-sparse-performance.json
      - if: inputs.benchmark == 'median' && !inputs.paired
        run: python benchmarks/median.py --size 512 --threads 1 4 --repeat 7 --output build/median-performance.json
      - if: inputs.benchmark == 'median' && inputs.paired
        run: python benchmarks/median.py --size 512 --threads 1 4 --repeat 7 --baseline-dir build/initial/exact-package --output build/median-performance.json
      - if: inputs.benchmark == 'multiotsu' && !inputs.paired
        run: python benchmarks/multiotsu.py --size 512 --threads 1 4 --repeat 7 --output build/multiotsu-performance.json
      - if: inputs.benchmark == 'multiotsu' && inputs.paired
        run: python benchmarks/multiotsu.py --size 512 --threads 1 4 --repeat 7 --baseline-dir build/initial/exact-package --output build/multiotsu-performance.json
      - if: inputs.benchmark == 'clahe' && !inputs.paired
        run: python benchmarks/clahe.py --size 512 --threads 1 4 --repeat 7 --output build/clahe-performance.json
      - if: inputs.benchmark == 'clahe' && inputs.paired
        run: python benchmarks/clahe.py --size 512 --threads 1 4 --repeat 7 --baseline-dir build/initial/exact-package --output build/clahe-performance.json
      - if: inputs.benchmark == 'gabor-kernel' && !inputs.paired
        run: python benchmarks/gabor_kernel.py --threads 1 4 --repeat 7 --output build/gabor-kernel-performance.json
      - if: inputs.benchmark == 'gabor' && !inputs.paired
        run: python benchmarks/gabor.py --size 192 --threads 1 4 --repeat 7 --output build/gabor-performance.json
      - if: inputs.benchmark == 'gabor' && !inputs.paired
        run: python benchmarks/gabor_kernel.py --threads 1 4 --repeat 7 --output build/gabor-kernel-control-performance.json
      - if: inputs.benchmark == 'symmetric-eigen' && !inputs.paired
        run: python benchmarks/symmetric_eigen.py --threads 1 4 --repeat 7 --output build/symmetric-eigen-performance.json
      - if: inputs.benchmark == 'structure-tensor' && !inputs.paired
        run: python benchmarks/structure_tensor.py --threads 1 4 --repeat 7 --output build/structure-tensor-performance.json
      - if: inputs.benchmark == 'corner-responses' && !inputs.paired
        run: python benchmarks/corner_responses.py --threads 1 4 --repeat 7 --output build/corner-responses-performance.json
      - if: inputs.benchmark == 'hessian-det' && !inputs.paired
        run: python benchmarks/hessian_det.py --threads 1 4 --repeat 7 --output build/hessian-det-performance.json
      - if: inputs.benchmark == 'shape-index' && !inputs.paired
        run: python benchmarks/shape_index.py --threads 1 4 --repeat 7 --output build/shape-index-performance.json
      - if: inputs.benchmark == 'hessian' && !inputs.paired
        run: python benchmarks/hessian.py --threads 1 4 --repeat 7 --output build/hessian-performance.json
      - if: inputs.benchmark == 'kitchen' && !inputs.paired
        run: python benchmarks/kitchen.py --threads 1 4 --repeat 7 --output build/kitchen-performance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.benchmark }}-performance-${{ matrix.os }}
          path: |
            build/*-performance.json
            build/wheels/*.whl
            build/exact-package/
            build/initial/exact-package/
