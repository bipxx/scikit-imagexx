name: label-points-metadata-same-host
on:
  workflow_dispatch:
    inputs:
      baseline_run:
        type: string
        required: true
        default: '40724150045'
      baseline_revision:
        type: string
        required: true
        default: '910c31a609c157c28cbbe56933b8448b710af95e'
      candidate_run:
        type: string
        required: true
        default: '40738793434'
      candidate_revision:
        type: string
        required: true
        default: '69e390dd5e48d5199c9a249fccafd83daa027d3c'
permissions:
  contents: read
  actions: read
env:
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  OMP_WAIT_POLICY: PASSIVE
  PYTHONOPTIMIZE: '0'
  PYTHONNOUSERSITE: '1'
  PYTHONUNBUFFERED: '1'
  PYTEST_ADDOPTS: ''
  PYTEST_PLUGINS: ''
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      BASELINE_RUN: ${{ inputs.baseline_run }}
      BASELINE_REVISION: ${{ inputs.baseline_revision }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - name: Authenticate successful CI products
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          lscpu > results/cpu.txt
          uname -a > results/platform.txt
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          assert os.environ['CANDIDATE_RUN'] == '40738793434'
          assert os.environ['CANDIDATE_REVISION'] == '69e390dd5e48d5199c9a249fccafd83daa027d3c'
          assert os.environ['BASELINE_RUN'] == '40724150045'
          assert os.environ['BASELINE_REVISION'] == '910c31a609c157c28cbbe56933b8448b710af95e'
          assert os.environ['BASELINE_RUN'] == '40724150045'
          assert os.environ['BASELINE_REVISION'] == '910c31a609c157c28cbbe56933b8448b710af95e'
          for role in ('baseline', 'candidate'):
              run, revision = (os.environ[role.upper() + suffix] for suffix in ('_RUN', '_REVISION'))
              assert re.fullmatch('[1-9][0-9]*', run) and re.fullmatch('[0-9a-f]{40}', revision)
              base = 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/'
              def api(endpoint):
                  raw = subprocess.check_output(['gh', 'api', base + endpoint])
                  Path('results', role + '-' + endpoint.split('?')[0].split('/')[-1] + '.json').write_bytes(raw)
                  return json.loads(raw)
              record = api('runs/' + run)
              assert str(record['id']) == run and record['head_sha'] == revision
              assert record['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
              assert record['path'] == '.github/workflows/ci.yml'
              assert record['status'] == 'completed' and record['conclusion'] == 'success'
              listing = api('runs/' + run + '/artifacts?per_page=100')
              assert listing['total_count'] == len(listing['artifacts'])
              matches = [a for a in listing['artifacts'] if a['name'] == 'ci-performance-minimum']
              assert len(matches) == 1
              item = matches[0]
              assert not item['expired'] and 0 < item['size_in_bytes'] < 512 * 1024**2
              assert item['workflow_run']['id'] == int(run) and item['workflow_run']['head_sha'] == revision
              assert re.fullmatch('sha256:[0-9a-f]{64}', item['digest'])
              if role == 'baseline':
                  assert item['id'] == 12833680393
                  assert item['digest'] == 'sha256:38797cf494532e16da41f751062c57815de2d566d8ebf11f3b59be26ba4be536'
              else:
                  assert item['id'] == 12839223780
                  assert item['digest'] == 'sha256:700cfabeae84a880753995117cd3fe2df6ec5e552c72c8c20309128d103f4503'
              Path('results', role + '-selection.json').write_text(json.dumps(item, indent=2) + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline_revision }}
          path: snapshots/baseline
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_revision }}
          path: snapshots/candidate
          fetch-depth: 1
      - name: Download exact CI ZIPs and install both runtimes offline
        shell: bash
        run: |
          set -euo pipefail
          for role in baseline candidate; do
            id=$(python -c "import json; print(json.load(open('results/$role-selection.json'))['id'])")
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/$role-prepared.zip"
            ROLE="$role" python - <<'PY'
          import ast, hashlib, json, os, re, stat, zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path, PurePosixPath
          def assert_existing_sources():
              def read(role, name):
                  return Path('snapshots', role, name).read_text(encoding='utf-8')
              for name in ('include/skimagexx/label_points.hpp', 'src/label_points.hpp', 'src/label_points.cpp', 'src/simd_label_points_avx2.cpp', 'python/skimagexx/_label_points.py', 'benchmarks/label_points.py'):
                  assert read('baseline', name) == read('candidate', name), name
              old, new = (read(role, 'src/bind_label_points.cpp') for role in ('baseline', 'candidate'))
              inverse = new.replace('        sizes.reserve(shape.size());\n        dimensions.reserve(shape.size());\n', '').replace('        axes.reserve(indices.size());\n        strides.reserve(indices.size());\n', '').replace('        // The immutable indices tuple owns each axis/base through this C call.\n', '').replace('            const auto dtype = array.dtype();\n', '').replace('|| dtype.kind()', '|| array.dtype().kind()').replace('!dtype.attr("isnative")', '!array.dtype().attr("isnative")').replace('        std::vector<const std::int64_t*> axes;', '        std::vector<py::array> owners;\n        std::vector<const std::int64_t*> axes;').replace('            strides.push_back(array.strides(0));', '            strides.push_back(array.strides(0));\n            owners.push_back(std::move(array));')
              assert inverse == old
              assert new.count('.reserve(') == 4 and new.count('const auto dtype = array.dtype();') == 1 and 'owners' not in new
          role = os.environ['ROLE']; folder = Path('snapshots', role, 'build')
          selected = json.loads(Path('results', role + '-selection.json').read_bytes())
          archive = Path(os.environ['RUNNER_TEMP'], role + '-prepared.zip')
          actual = dict(bytes=archive.stat().st_size, sha256=hashlib.sha256(archive.read_bytes()).hexdigest())
          Path('results', role + '-archive.json').write_text(json.dumps(actual, indent=2) + '\n')
          assert actual['bytes'] == selected['size_in_bytes'] and 'sha256:' + actual['sha256'] == selected['digest']
          with zipfile.ZipFile(archive) as z:
              names = z.namelist(); assert len(names) == len(set(names))
              assert sum(i.file_size for i in z.infolist()) < 2 * 1024**3
              for i in z.infolist():
                  p = PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in i.filename
                  assert not stat.S_ISLNK(i.external_attr >> 16)
              z.extractall(folder)
          prepared = folder / 'prepared/ci-artifacts'
          # latest_only baselines and prepare_only candidates need no standalone timing JSONs here.
          manifest = json.loads((prepared / 'measurement.json').read_bytes())
          assert manifest['schema'] == 'ci-offline-measurement-v1'
          assert manifest['source']['revision'] == os.environ[role.upper() + '_REVISION']
          assert len(manifest['wheels']) == 14
          assert len(manifest['runtime']['sdk_sha256']) == 79
          product = next(n for n, v in manifest['wheels'].items() if v['name'] == 'scikit-imagexx')
          with zipfile.ZipFile(folder / 'prepared/wheels' / product) as wheel:
              assert len([n for n in wheel.namelist() if not n.endswith('/')]) == 168
          for family, count in (('inertia-tensor', 115), ('inertia-eigvals', 69), ('moments', 203), ('window', 179),
                                ('lpi', 161), ('butterworth', 175), ('moments-derived', 155),
                                ('normalized-layouts', 22), ('immutable-bytes', 134),
                                ('moments-coords', 98), ('shannon-entropy', 61), ('rgb2yuv-storage', 37),
                                ('block-reduce', 145), ('perimeter-crofton', 101), ('perimeter', 111), ('euler-number', 91),
                                ('polygon', 86), ('mesh-surface-area', 89), ('profile-line', 93), ('blur-effect', 121), ('compare-images', 109), ('profile-coordinates', 51),
                                ('level-set', 161), ('level-set-pipeline', 163), ('map-array', 103), ('map-array-pipeline', 103), ('label-points', 99), ('label-points-pipeline', 100), ('unique-rows', 107), ('unique-rows-pipeline', 107), ('regular-seeds', 109), ('regular-seeds-pipeline', 109),
                                ('color-transforms-regression', 1848)):
              for mode in ('normal', 'scalar'):
                  tree = ET.fromstring((prepared / (family + '-' + mode + '.xml')).read_bytes())
                  assert len(tree.findall('.//testcase')) == count
                  assert not any(tree.findall('.//' + tag) for tag in ('failure', 'error', 'skipped'))
          for family, count in (('blur-effect-intake', 4), ('polygon-intake', 4), ('euler-number-intake', 4), ('block-reduce-integer-width', 9)):
              tree = ET.fromstring((prepared / (family + '.xml')).read_bytes())
              assert len(tree.findall('.//testcase')) == count
              assert not any(tree.findall('.//' + tag) for tag in ('failure', 'error', 'skipped'))
          smoke = json.loads((prepared / 'feature-smoke.json').read_bytes())
          assert smoke['status'] == 'passed' and smoke['exit_code'] == 0
          assert smoke['outcomes'] == {'passed': 1435} and len(smoke['results']) == 1435
          assert smoke['implementations']['native-partial'] + smoke['implementations']['metadata'] == 245
          assert smoke['implementations']['native-partial'] == 242 and smoke['implementations']['metadata'] == 3
          if role == 'candidate':
              old, new = (json.loads(Path('snapshots', r, 'build/prepared/ci-artifacts/measurement.json').read_bytes()) for r in ('baseline', 'candidate'))
              for key in ('python', 'implementation', 'cache_tag', 'machine', 'system', 'dependency_libraries_sha256'):
                  assert old['runtime'][key] == new['runtime'][key], key
              assert {k: v for k, v in old['runtime']['versions'].items() if k != 'scikit-imagexx'} == {k: v for k, v in new['runtime']['versions'].items() if k != 'scikit-imagexx'}
              for name in ('numpy', 'scipy', 'skimage'):
                  assert old['runtime']['packages_sha256'][name] == new['runtime']['packages_sha256'][name], name
              assert {k: v for k, v in old['wheels'].items() if v['name'] != 'scikit-imagexx'} == {k: v for k, v in new['wheels'].items() if v['name'] != 'scikit-imagexx'}, 'all13 runtime dependency wheels exact; no normalization authorized'
              contract = 'coverage/contracts/label-points-metadata-candidate.json'
              assert contract not in old['source']['files_sha256']
              assert hashlib.sha256(Path('snapshots/candidate', contract).read_bytes()).hexdigest() == '2276bdf9fc048b923613f9964c6a096169f7483d1babd9b95c802347cc75b3f9'
              preexisting_metadata_delta = {'.gitattributes': {'old': '1d87e82962f390541959356030fc18f4aab595df05493941299d7f1741196e02', 'new': '6fa2178024795b5e44baa0fe113d375d7109a82adf482bcb7762a54a3a1e67ab'}, '.github/workflows/label-points-zero-provider-same-host.yml': {'old': None, 'new': '0a4a45079022c5a1fdd74c1b918c971a70c37b6639722ab4f88f8b5a73460c11'}, '.github/workflows/public-qualification.yml': {'old': '78cd3d5327798780d01181c7f42db3692c6bba4aa2e1ae615320064d7fbb299d', 'new': 'e39a128f1acabc7ca0d990c067248eaee2ff3b4b406e742c7ac0b8fe8a8f2bb0'}, 'benchmarks/STATUS.md': {'old': 'f1ee36780166cd0822dea3d176dd45cea28151e70c2fe7a9e9e2e7ca8c74393f', 'new': '0b94c3cc9ff1d8a414db52e46ff446b8795b93b7af62019b895dd9f1f30e7412'}, 'benchmarks/label-points-zero-provider-same-host.json': {'old': None, 'new': 'dfd23658be58c6ef8dfa7d26eb3918bd2fb357bf2e298926d67ba6ac7141fe3c'}, 'benchmarks/label-points-zero-provider-same-host.md': {'old': None, 'new': '91b2dfbf52651a6dbc0ce891038c44e1594519b581010b73780b7a47c3cb400b'}, 'benchmarks/rank_bilateral.py': {'old': '9d8e5d3f3bc5d2c616baf492632d0a445fc026c7568a09c44a00a67cc3810410', 'new': 'fd7c5973f6e9f0c68890460d1bdf0ae574d9823d6a4ad2632d3edb175c619447'}, 'benchmarks/regular-seeds-minimum-initial.json': {'old': None, 'new': '12321a71b4faa54bf214a81cb5cfe1ad1e0fb0e7ba2397ee23ffc15c6f1d9be3'}, 'benchmarks/regular-seeds-minimum-initial.md': {'old': None, 'new': 'b0f5c1a53cbd81927722985d211e6a4ed3a1b3fa51e390bc5d930a9bef5a6765'}, 'coverage/EXECUTION_PLAN.md': {'old': '5e98cbc6cedeb9e346a729bd7583255e97a06dfef1e9179b7cbeb224bbaf6653', 'new': '9deccc2d0020b8a5f052e05c44df7c35218699a12b468f524a6d93da3611c08d'}, 'coverage/FAST_RUN.md': {'old': '0dcc0b4abdad7697fe5a7c0ef91d105ccf4a90fafebe745e1affbb0baeae69d1', 'new': '1db06624197c5983358c3a31ff22d5db3cdfb2e459fc4141ef67727a7ce664b1'}, 'coverage/contracts/montage.json': {'old': None, 'new': '6c75d39867b91a01b68c9dbf33f6e8706a38f2af3e5ed605c2258b923e2d5986'}, 'coverage/evidence/rank-bilateral-fixture-reuse.json': {'old': None, 'new': 'b7d96d74bb6581d98f4596ec4f4c06f32198b9d5d9b3de35300c55aab76cf6ff'}, 'coverage/work_items.json': {'old': '3e9d79c5f53ff005882247be7f28001f63828c25bc2d834813d6c27b14e144d4', 'new': 'f865e04a9fa9daa4db6952dcc4f9d3d340ef05d654b6d1246d3f270f92b61ac6'}, 'tests/montage_contract.py': {'old': None, 'new': 'b3f9074274261a9cd9694ac42efa51e8625edb497a0db97f8d6fcce7a9985239'}, 'tests/test_label_points_zero_provider_same_host.py': {'old': None, 'new': '5e0ed33f9167bb296b7ca0bacab479416a007d5371f1a67cbefc4732347d2307'}, 'tests/test_montage_public.py': {'old': None, 'new': 'ae94d3f87e79539ce42457962aa75543f55987f580046e65647781eecb624aac'}, 'tests/test_rank_bilateral_contracts.py': {'old': '9fb6411bb69a92bbc40bc4ebab37f553328476a19d010c895ea7c0c2dc9d1f16', 'new': '313b5df93e5453d3b4b4a4d0c41370aa014a60126e11cc7fd870f17d21154251'}, 'tests/test_rank_bilateral_fixture_reuse_metadata.py': {'old': None, 'new': '4d575231d70fe3934e604faf59d71275748046033a3e97e557de9226a9db94d3'}, 'tests/test_rank_bilateral_masked_center_public.py': {'old': 'b6965c38d75097488ff60b1aa019478761163ee8d30236b8b9efb724df9f20cb', 'new': 'b486007b57b205e7a3a38e8f3043df8158fbced7bdfed741bbca52a906e2e565'}, 'tools/rank_bilateral_fixture_source.py': {'old': None, 'new': '0cd8262e5260c80dfd6b3fdc3c1069c0ab580c0e375cb956f3732026f6f51bfb'}}
              expected_source = dict(old['source']['files_sha256'])
              for name, change in preexisting_metadata_delta.items():
                  assert expected_source.get(name) == change['old']
                  if change['new'] is None:
                      expected_source.pop(name)
                  else:
                      expected_source[name] = change['new']
              expected_source['src/bind_label_points.cpp'] = '66fc484b8676e0fffd12c81748e21d38217d3becadac59f294d0ee78a49f689e'
              expected_source[contract] = '2276bdf9fc048b923613f9964c6a096169f7483d1babd9b95c802347cc75b3f9'
              assert new['source']['files_sha256'] == expected_source, 'closed base5df metadata delta plus binder/contract only; no additional source edits'
              assert old['runtime']['sdk_sha256'] == new['runtime']['sdk_sha256'], 'all79 SDK payloads including numerical library byte-exact'
              old_pkg, new_pkg = (value['runtime']['packages_sha256']['skimagexx'] for value in (old, new))
              assert old_pkg.keys() == new_pkg.keys()
              assert {n: v for n, v in old_pkg.items() if not n.endswith('.so')} == {n: v for n, v in new_pkg.items() if not n.endswith('.so')}
              assert_existing_sources()
          PY
            python -m venv "$RUNNER_TEMP/env-$role"
            "$RUNNER_TEMP/env-$role/bin/python" -m pip install --no-index --no-deps --only-binary=:all: --require-hashes --find-links "snapshots/$role/build/prepared/wheels" -r "snapshots/$role/build/prepared/ci-artifacts/runtime-lock.txt" 2>&1 | tee "results/$role-offline-install.log"
            "$RUNNER_TEMP/env-$role/bin/python" "snapshots/$role/tools/ci_measurement_artifacts.py" verify --wheel-dir "snapshots/$role/build/prepared/wheels" --artifact "snapshots/$role/build/prepared/ci-artifacts/measurement.json" 2>&1 | tee "results/$role-original-identity.log"
          done
      - name: Measure the fixed9 LabelPoints cases in ABBA order
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME SKIMAGEXX_DISABLE_SIMD
          for pass in 1-baseline 2-candidate 3-candidate 4-baseline; do
            role=${pass#*-}; py="$RUNNER_TEMP/env-$role/bin/python"; output="$GITHUB_WORKSPACE/results/$pass"
            mkdir "$output"
            cd "$GITHUB_WORKSPACE/snapshots/$role"
            "$py" tools/ci_measurement_artifacts.py verify --wheel-dir build/prepared/wheels --artifact build/prepared/ci-artifacts/measurement.json 2>&1 | tee "$output/identity-before.log"
            status=0
            "$py" benchmarks/label_points.py --threads 1 --repeat 7 --output "$output/label-points.json" 2>&1 | tee "$output/label-points.log" || status=$?
            echo "$status" > "$output/benchmark-exit.txt"
            "$py" tools/ci_measurement_artifacts.py verify --wheel-dir build/prepared/wheels --artifact build/prepared/ci-artifacts/measurement.json 2>&1 | tee "$output/identity-after.log"
            test "$status" -eq 0
          done
      - name: Check all four complete raw reports
        shell: bash
        run: |
          python - <<'PY'
          import json, math, runpy, statistics
          from pathlib import Path
          from datetime import datetime, timezone
          deadline = datetime.fromisoformat('2026-10-28T19:39:29.511203+00:00')
          contract = json.loads(Path('snapshots/baseline/coverage/contracts/label-points-benchmark.json').read_bytes())
          expected = {r['case_id']: r for r in contract['cases']}
          assert len(expected) == 9
          reports = []
          for name in ('1-baseline', '2-candidate', '3-candidate', '4-baseline'):
              source = Path('snapshots', name.split('-', 1)[1])
              fingerprint = runpy.run_path(str(source / 'benchmarks/provenance.py'))['source_fingerprint'](source)
              manifest_raw = (source / 'build/prepared/ci-artifacts/measurement.json').read_bytes()
              manifest = json.loads(manifest_raw)
              import hashlib
              identity = dict(status='verify', revision=manifest['source']['revision'], wheel_count=14,
                              artifact_sha256=hashlib.sha256(manifest_raw).hexdigest())
              for when in ('before', 'after'):
                  assert json.loads(Path('results', name, 'identity-' + when + '.log').read_bytes()) == identity
              report = json.loads(Path('results', name, 'label-points.json').read_bytes())
              meta, rows = report['metadata'], report['results']
              assert all(meta[key] == value for key, value in fingerprint.items()) and meta['source_before'] == fingerprint
              assert meta['repeat'] == 7 and meta['threads'] == 1 and meta['raw_samples'] == 126
              assert meta['fallback_enabled'] is False and meta['avx2'] is True
              assert meta['reference'] == '0.26.0' and meta['numpy'] == '1.24.4' and meta['scipy'] == '1.15.3'
              assert meta['python'] == manifest['runtime']['python']
              cores = [(n, v) for n, v in manifest['runtime']['packages_sha256']['skimagexx'].items() if n.endswith('.so')]
              assert len(cores) == 1 and meta['core_sha256'] == cores[0][1]
              assert meta['numpy_error_policy'] == dict(divide='warn', over='warn', under='ignore', invalid='warn')
              assert meta['numpy_buffer_elements'] == 8192
              assert meta['selected_apis'] == ['util.label_points']
              assert meta['harness_sha256'] == '903c46306ed0a3e7a57d21a32e794fb9b48fe6af7ea7b685d7cf3ea66b1d0850'
              assert meta['reference_pool_limits'] == {n: '1' for n in ('OPENBLAS_NUM_THREADS', 'MKL_NUM_THREADS', 'OMP_NUM_THREADS', 'BLIS_NUM_THREADS')}
              assert meta['contract_sha256'] == '3fceb3b66c254f1330f30f779a34a042162c08cf59921bf1343b06376f450221'
              assert meta['original_source_sha256'] == '8c409baaf3527b3466c8d8e973e4482182bdf172e8486c33d91eb469403742b2'
              assert meta['target_ms'] == 19 and meta['seed'] == 2026
              scope = contract['scope'] + ' ' + contract['timed_boundary'] + ' ' + contract['frontier']
              assert meta['provider_frontier'] == scope
              assert len(rows) == 9 and {r['case_id'] for r in rows} == expected.keys()
              for row in rows:
                  assert all(row[key] == value for key, value in expected[row['case_id']].items())
                  assert row['api'] == 'util.label_points' and row['backend'] == 'native' and row['threads'] == 1
                  assert row['native_accepted'] is True and row['actual_C_returns'] == ['label_points_apply']
                  assert row['max_abs_error'] == 0 and row['output_sha256'] == row['reference_sha256'] == row['oracle_sha256']
                  for record in [*row['inputs'], dict(sha256=row['output_sha256'])]:
                      assert len(record['sha256']) == 64 and int(record['sha256'], 16) >= 0
                  assert row['sample_labels'] == ['scikit-image', 'current']
                  assert list(map(len, row['samples_ms'])) == [7, 7] and len(row['loops']) == 2
                  assert all(isinstance(n, int) and n > 0 for n in row['loops'])
                  assert all(math.isfinite(v) and v > 0 for samples in row['samples_ms'] for v in samples)
                  a, b = map(statistics.median, row['samples_ms'])
                  assert (a, b, a / b) == (row['reference_ms'], row['cpp_ms'], row['speedup'])
              reports.append({r['case_id']: r for r in rows})
          assert all(r.keys() == reports[0].keys() for r in reports)
          def gm(values):
              return math.exp(statistics.mean(math.log(v) for v in values))
          rows = []
          for key, first in reports[0].items():
              values = [r[key] for r in reports]
              for field in ('output_shape', 'coordinate_dtype', 'kind', 'point_count', 'coordinate_layout',
                            'inputs', 'output_metadata', 'output_sha256', 'reference_sha256', 'oracle_sha256'):
                  assert all(v[field] == first[field] for v in values), (key, field)
              b0, c1, c2, b3 = values
              rows.append(dict(case_id=key, coordinate_dtype=first['coordinate_dtype'], kind=first['kind'],
                  direct_gain=math.sqrt(b0['cpp_ms'] * b3['cpp_ms'] / (c1['cpp_ms'] * c2['cpp_ms'])),
                  normalized_gain=math.sqrt(c1['speedup'] * c2['speedup'] / (b0['speedup'] * b3['speedup'])),
                  candidate_original=math.sqrt(c1['speedup'] * c2['speedup']),
                  repeat_direct=min(math.sqrt(b0['cpp_ms'] * b3['cpp_ms']) / c['cpp_ms'] for c in (c1, c2)) > 1.05,
                  repeat_normalized=min(c['speedup'] / math.sqrt(b0['speedup'] * b3['speedup']) for c in (c1, c2)) > 1.05,
                  original_repeat=min(c1['speedup'], c2['speedup']) > 1,
                  baseline_cpp_ms=[b0['cpp_ms'], b3['cpp_ms']], candidate_cpp_ms=[c1['cpp_ms'], c2['cpp_ms']],
                  candidate_original_passes=[c1['speedup'], c2['speedup']],
                  added_ms=math.sqrt(c1['cpp_ms'] * c2['cpp_ms']) - math.sqrt(b0['cpp_ms'] * b3['cpp_ms'])))
          completed = datetime.now(timezone.utc)
          direct = gm(r['direct_gain'] for r in rows)
          normalized = gm(r['normalized_gain'] for r in rows)
          original = gm(r['candidate_original'] for r in rows)
          target_ids = {'sparse-64x64-i64'}
          preserved_ids = set(expected) - target_ids - {'sparse-64x64x64-f32'}
          targets = [r for r in rows if r['case_id'] in target_ids]
          preserved = [r for r in rows if r['case_id'] in preserved_ids]
          others = [r for r in rows if r['case_id'] not in target_ids]
          assert len(targets) == 1 and len(preserved) == 7 and len(others) == 8
          keep = (direct > 1.01 and normalized > 1.01
                  and all(r['repeat_direct'] and r['repeat_normalized'] and r['original_repeat'] for r in targets)
                  and all(r['original_repeat'] for r in preserved)
                  and all(r['direct_gain'] >= 0.97 and r['normalized_gain'] >= 0.97 for r in others)
