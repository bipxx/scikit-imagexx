          summary = dict(status='KEEP' if keep else 'DISCARD', completed_utc=completed.isoformat(),
              deadline_utc=deadline.isoformat(), completed_before_deadline=completed < deadline,
              contract_sha256='2276bdf9fc048b923613f9964c6a096169f7483d1babd9b95c802347cc75b3f9',
              raw_samples=504, direct_gain=direct, normalized_gain=normalized, candidate_original=original,
              target_repeat_wins=sum(r['repeat_direct'] and r['repeat_normalized'] for r in targets),
              cpp_controls_preserved=sum(r['direct_gain'] >= 0.97 and r['normalized_gain'] >= 0.97 for r in others),
              target_original_repeat_wins=sum(r['original_repeat'] for r in targets),
              preserved_original_repeat_wins=sum(r['original_repeat'] for r in preserved),
              direct_losses=[r['case_id'] for r in rows if r['direct_gain'] < 1],
              normalized_losses=[r['case_id'] for r in rows if r['normalized_gain'] < 1],
              balanced_original_losses=[r['case_id'] for r in rows if r['candidate_original'] < 1],
              candidate_pass_original_losses={name: [r['case_id'] for r in report.values() if r['speedup'] < 1]
                                              for name, report in zip(('2-candidate', '3-candidate'), reports[1:3])},
              groups={name: dict(cases=len(group), direct_gain=gm(r['direct_gain'] for r in group),
                  normalized_gain=gm(r['normalized_gain'] for r in group), candidate_original=gm(r['candidate_original'] for r in group))
                  for name, group in [('targets', targets), ('preserved_original_wins', preserved)]
                  + [(kind, [r for r in rows if r['kind'] == kind]) for kind in sorted({r['kind'] for r in rows})]
                  + [(dtype, [r for r in rows if r['coordinate_dtype'] == dtype]) for dtype in sorted({r['coordinate_dtype'] for r in rows})]},
              initial_original_losses=['sparse-64x64-i64','dense-64x64-f64','sparse-1024x1024-i64','sparse-64x64x64-f32','dense-64x64x64-i64','duplicates-1024x1024-f64','strided-1024x1024-f32','strided-64x64x64-i64'],
              balanced_other_floor_failures=[r['case_id'] for r in others if r['direct_gain'] < 0.97 or r['normalized_gain'] < 0.97],
              controls_scope='One binder-only metadata candidate; overall direct and normalized GM>1.01; tiny sparse64 target each candidate pass direct/normalized>1.05 plus original win; preserve7 baseline repeated original wins and all other8 balanced direct/normalized>=.97. Numerical leaf/SDK/Python/harness unchanged. All9/504samples, sparse3D mixed original result and every loss retained; no stage attribution.',
              rows=rows)
          Path('results/comparison.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps({k: v for k, v in summary.items() if k != 'rows'}, indent=2))
