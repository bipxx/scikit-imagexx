name: max-tree-compare
on:
  workflow_dispatch:
    inputs:
      controller_source:
        description: Exact reviewed controller commit
        required: true
        type: string
      certificate_json:
        description: Root accepted public199 certificate with all3 exact artifact pins
        required: true
        type: string
      certificate_sha256:
        description: SHA256 of exact UTF8 certificate bytes
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONNOUSERSITE: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  OMP_DYNAMIC: 'FALSE'
  CERTIFICATE_JSON: ${{ inputs.certificate_json }}
  CERTIFICATE_SHA256: ${{ inputs.certificate_sha256 }}
  CONTROLLER_SOURCE: ${{ inputs.controller_source }}
jobs:
  prepare:
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            profile: windows
          - os: ubuntu-latest
            profile: modern
          - os: ubuntu-latest
            profile: minimum
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.controller_source }}
      - name: Preserve exact certificate and select qualified interpreter
        id: select
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python - <<'PY'
          import hashlib,os,pathlib
          assert os.environ['CONTROLLER_SOURCE']==os.environ['GITHUB_SHA']
          raw=os.environ['CERTIFICATE_JSON'].encode('utf-8')
          assert hashlib.sha256(raw).hexdigest()==os.environ['CERTIFICATE_SHA256']
          pathlib.Path('build/certificate.json').write_bytes(raw)
          PY
          python benchmarks/max_tree_compare.py selectors --profile '${{ matrix.profile }}' --certificate build/certificate.json --certificate-sha256 "$CERTIFICATE_SHA256" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.select.outputs.python }}
      - name: Download exact accepted unchanged product, never build
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/max_tree_compare.py fetch --profile '${{ matrix.profile }}' --certificate build/certificate.json --certificate-sha256 "$CERTIFICATE_SHA256" --output build/product
          python -m pip install --no-index --no-deps --no-compile --only-binary=:all: --force-reinstall --require-hashes --find-links build/product/wheels -r build/product/runtime-lock.txt
      - name: Metadata controls, then full normal and scalar workers1/4 parity
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/test_max_tree_compare.py -q --capture=sys --junitxml build/metadata-guards.xml
          python benchmarks/max_tree_compare.py prepare --profile '${{ matrix.profile }}' --certificate build/certificate.json --certificate-sha256 "$CERTIFICATE_SHA256" --product build/product --output build/preparation
      - uses: actions/upload-artifact@v4
        with:
          name: max-tree-prepared-${{ matrix.profile }}
          include-hidden-files: true
          retention-days: 90
          path: build/product/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: max-tree-receipt-${{ matrix.profile }}
          include-hidden-files: true
          retention-days: 90
          path: |
            build/preparation/
            build/metadata-guards.xml
  measure:
    # Every successful preparation profile gates NEW artifact-only hosts.
    needs: prepare
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            profile: windows
          - os: ubuntu-latest
            profile: modern
          - os: ubuntu-latest
            profile: minimum
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.controller_source }}
      - name: Exact certificate bytes and interpreter selector
        id: select
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python - <<'PY'
          import hashlib,os,pathlib
          assert os.environ['CONTROLLER_SOURCE']==os.environ['GITHUB_SHA']
          raw=os.environ['CERTIFICATE_JSON'].encode('utf-8')
          assert hashlib.sha256(raw).hexdigest()==os.environ['CERTIFICATE_SHA256']
          pathlib.Path('build/certificate.json').write_bytes(raw)
          PY
          python benchmarks/max_tree_compare.py selectors --profile '${{ matrix.profile }}' --certificate build/certificate.json --certificate-sha256 "$CERTIFICATE_SHA256" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.select.outputs.python }}
      - uses: actions/download-artifact@v4
        with:
          name: max-tree-prepared-${{ matrix.profile }}
          path: build/product
      - uses: actions/download-artifact@v4
        with:
          pattern: max-tree-receipt-*
          path: build/barrier
      - name: Install exact prepared offline wheels only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-index --no-deps --no-compile --only-binary=:all: --force-reinstall --require-hashes --find-links build/product/wheels -r build/product/runtime-lock.txt
      - name: All3 fresh barrier before fixtures and seven paired one-worker rounds
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/max_tree_compare.py measure --profile '${{ matrix.profile }}' --certificate build/certificate.json --certificate-sha256 "$CERTIFICATE_SHA256" --product build/product --receipts build/barrier/max-tree-receipt-*/preparation/preparation.json --output build/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: max-tree-performance-${{ matrix.profile }}
          include-hidden-files: true
          retention-days: 90
          path: |
            build/results/
            build/barrier/
            build/certificate.json
