name: phase3-same-host
on:
  workflow_dispatch:
    inputs:
      baseline_run:
        type: string
        required: true
        default: '40266173692'
      baseline_revision:
        type: string
        required: true
        default: '4a78e945a5eccfb14c0887f5187378c5f4d76cf9'
      candidate_run:
        type: string
        required: true
        default: '40267273827'
      candidate_revision:
        type: string
        required: true
        default: 'ac87e239c5c98b96f9703b431a091d79e25bbfa7'
permissions:
  contents: read
  actions: read
env:
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  OMP_WAIT_POLICY: PASSIVE
  PYTHONOPTIMIZE: '0'
  PYTHONNOUSERSITE: '1'
  PYTHONUNBUFFERED: '1'
  PYTEST_ADDOPTS: ''
  PYTEST_PLUGINS: ''
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      BASELINE_RUN: ${{ inputs.baseline_run }}
      BASELINE_REVISION: ${{ inputs.baseline_revision }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - name: Authenticate completed prepared campaigns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          for role in ('baseline', 'candidate'):
              run, revision = (os.environ[role.upper() + suffix] for suffix in ('_RUN', '_REVISION'))
              assert re.fullmatch('[1-9][0-9]*', run) and re.fullmatch('[0-9a-f]{40}', revision)
              base = 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/'
              def api(endpoint):
                  raw = subprocess.check_output(['gh', 'api', base + endpoint])
                  Path('results', role + '-' + endpoint.split('?')[0].split('/')[-1] + '.json').write_bytes(raw)
                  return json.loads(raw)
              record = api('runs/' + run)
              assert str(record['id']) == run and record['head_sha'] == revision
              assert record['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
              assert record['path'] == '.github/workflows/phase3-public-benchmark.yml'
              assert record['status'] == 'completed' and record['conclusion'] == 'success'
              listing = api('runs/' + run + '/artifacts?per_page=100')
              assert listing['total_count'] == len(listing['artifacts'])
              matches = [a for a in listing['artifacts'] if a['name'] == 'phase3-prepared-minimum-linux']
              assert len(matches) == 1
              item = matches[0]
              assert not item['expired'] and 0 < item['size_in_bytes'] < 512 * 1024**2
              assert item['workflow_run']['id'] == int(run) and item['workflow_run']['head_sha'] == revision
              assert re.fullmatch('sha256:[0-9a-f]{64}', item['digest'])
              Path('results', role + '-selection.json').write_text(json.dumps(item, indent=2) + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline_revision }}
          path: snapshots/baseline
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_revision }}
          path: snapshots/candidate
          fetch-depth: 1
      - name: Download exact prepared ZIPs and install both runtimes offline
        shell: bash
        run: |
          set -euo pipefail
          for role in baseline candidate; do
            id=$(python -c "import json; print(json.load(open('results/$role-selection.json'))['id'])")
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/$role-prepared.zip"
            ROLE="$role" python - <<'PY'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path, PurePosixPath
          role = os.environ['ROLE']; folder = Path('snapshots', role, 'build/prepared')
          selected = json.loads(Path('results', role + '-selection.json').read_bytes())
          archive = Path(os.environ['RUNNER_TEMP'], role + '-prepared.zip')
          actual = dict(bytes=archive.stat().st_size, sha256=hashlib.sha256(archive.read_bytes()).hexdigest())
          Path('results', role + '-archive.json').write_text(json.dumps(actual, indent=2) + '\n')
          assert actual['bytes'] == selected['size_in_bytes'] and 'sha256:' + actual['sha256'] == selected['digest']
          with zipfile.ZipFile(archive) as z:
              names = z.namelist(); assert len(names) == len(set(names))
              assert sum(i.file_size for i in z.infolist()) < 2 * 1024**3
              for i in z.infolist():
                  p = PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in i.filename
                  assert not stat.S_ISLNK(i.external_attr >> 16)
              z.extractall(folder)
          with zipfile.ZipFile(folder / 'preparation/source.zip') as z:
              assert z.comment.decode() == os.environ[role.upper() + '_REVISION']
              for name in z.namelist():
                  if not name.endswith('/'): assert z.read(name) == (Path('snapshots', role) / name).read_bytes(), name
          if role == 'candidate':
              old, new = (json.loads(Path('snapshots', r, 'build/prepared/preparation/measurement.json').read_bytes()) for r in ('baseline', 'candidate'))
              for key in ('python', 'implementation', 'cache_tag', 'machine', 'system', 'dependency_libraries_sha256'):
                  assert old['runtime'][key] == new['runtime'][key], key
              assert {k: v for k, v in old['runtime']['versions'].items() if k != 'scikit-imagexx'} == {k: v for k, v in new['runtime']['versions'].items() if k != 'scikit-imagexx'}
              for name in ('numpy', 'scipy', 'skimage'):
                  assert old['runtime']['packages_sha256'][name] == new['runtime']['packages_sha256'][name], name
              assert {k: v for k, v in old['wheels'].items() if v['name'] != 'scikit-imagexx'} == {k: v for k, v in new['wheels'].items() if v['name'] != 'scikit-imagexx'}
          PY
            python -m venv "$RUNNER_TEMP/env-$role"
            "$RUNNER_TEMP/env-$role/bin/python" -m pip install --no-index --no-deps --only-binary=:all: --require-hashes --find-links "snapshots/$role/build/prepared/wheels" -r "snapshots/$role/build/prepared/preparation/runtime-lock.txt" 2>&1 | tee "results/$role-offline-install.log"
          done
          for file in benchmarks/phase3_public.py benchmarks/run.py benchmarks/resize.py benchmarks/provenance.py tools/ci_measurement_artifacts.py tests/footprint_shapes_cases.py tests/colocalization_cases.py; do
            cmp "snapshots/baseline/$file" "snapshots/candidate/$file"
          done
      - name: Measure unchanged full corpus in ABBA order
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME SKIMAGEXX_DISABLE_SIMD
          for pass in 1-baseline 2-candidate 3-candidate 4-baseline; do
            role=${pass#*-}; py="$RUNNER_TEMP/env-$role/bin/python"; output="$GITHUB_WORKSPACE/results/$pass"
            mkdir "$output"
            cd "$GITHUB_WORKSPACE/snapshots/$role"
            "$py" tools/ci_measurement_artifacts.py verify --wheel-dir build/prepared/wheels --artifact build/prepared/preparation/measurement.json 2>&1 | tee "$output/identity-before.log"
            status=0
            "$py" benchmarks/phase3_public.py --wheel build/prepared/wheels/scikit_imagexx-*.whl --prepared-source build/prepared/exact-package/baseline-source.json --output "$output/phase3-public.json" 2>&1 | tee "$output/phase3-public.log" || status=$?
            echo "$status" > "$output/benchmark-exit.txt"
            "$py" tools/ci_measurement_artifacts.py verify --wheel-dir build/prepared/wheels --artifact build/prepared/preparation/measurement.json 2>&1 | tee "$output/identity-after.log"
            test "$status" -eq 0
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-same-host-minimum
          path: results/
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error
