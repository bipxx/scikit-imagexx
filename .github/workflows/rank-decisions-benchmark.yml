name: rank-decisions-benchmark
on:
  workflow_dispatch:
    inputs:
      workers:
        description: Optional global native workers (worker1 is primary)
        type: choice
        options: ['1', '1 4']
        default: '1'
permissions:
  contents: read
jobs:
  prepare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: modern
            python: '3.13'
            numpy: '2.5.4'
            scipy: '1.18.1'
          - os: ubuntu-latest
            runtime: modern
            python: '3.13'
            numpy: '2.5.4'
            scipy: '1.18.1'
          - os: ubuntu-latest
            runtime: minimum
            python: '3.11'
            numpy: '1.24.4'
            scipy: '1.15.3'
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
      RANK_DECISIONS_WORKERS: ${{ inputs.workers }}
    steps:
      # Public acceptance remains pending until the actual complete R7 public package is separately qualified.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build exact complete public wheel
        shell: bash
        run: |
          mkdir -p build/preparation
          python -m pip wheel . --no-deps --wheel-dir build/capsule/wheels --verbose 2>&1 | tee build/preparation/build.log
          python -m pip install numpy==${{ matrix.numpy }} scipy==${{ matrix.scipy }} scikit-image==0.26.0 pytest
          python -m pip install --no-deps build/capsule/wheels/*.whl
      - name: Require actual public R7 before creating test fixtures
        run: python -c "from benchmarks.rank_decisions import admit_native; import skimagexx as xx; admit_native(xx.get_num_threads())"
      - name: Source contracts and harness guards
        run: >-
          python -m pytest -q tests/test_rank_decisions_contracts.py
          tests/test_rank_decisions_benchmark.py
      - name: Scalar source contracts and guards
        run: python -m pytest -q tests/test_rank_decisions_contracts.py tests/test_rank_decisions_benchmark.py
        env:
          SKIMAGEXX_DISABLE_SIMD: '1'
      - name: Freeze complete offline runtime wheelhouse
        shell: bash
        run: |
          python -m pip freeze > build/capsule/runtime-freeze.txt
          python -m pip wheel --find-links build/capsule/wheels --wheel-dir build/capsule/wheels -r build/capsule/runtime-freeze.txt
      - name: Seal current source, complete package, SDK, corpus and runtime; check every case
        shell: bash
        run: python benchmarks/rank_decisions.py --capsule build/capsule --prepare-capsule --check-only --threads 1 4 --output build/preparation/rank-decisions-check.json
      - name: Check scalar paths on the same immutable package
        shell: bash
        run: python benchmarks/rank_decisions.py --capsule build/capsule --check-only --threads 1 4 --output build/preparation/rank-decisions-scalar-check.json
        env:
          SKIMAGEXX_DISABLE_SIMD: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank-decisions-prepared-${{ matrix.os }}-${{ matrix.runtime }}
          include-hidden-files: true
          retention-days: 90
          path: |
            build/capsule/
            build/preparation/
  measure:
    # All3 correctness/preparation jobs complete before fresh measurement VMs.
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: modern
            python: '3.13'
          - os: ubuntu-latest
            runtime: modern
            python: '3.13'
          - os: ubuntu-latest
            runtime: minimum
            python: '3.11'
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      OMP_WAIT_POLICY: PASSIVE
      RANK_DECISIONS_WORKERS: ${{ inputs.workers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: rank-decisions-prepared-${{ matrix.os }}-${{ matrix.runtime }}
          path: build/prepared
      - name: Install only exact prepared runtime/product wheels
        shell: bash
        run: |
          python -m pip install --no-index --no-deps --require-hashes --find-links build/prepared/capsule/wheels -r build/prepared/capsule/runtime-lock.txt
      - name: Preflight full fixed corpus before paired one-worker-primary samples
        shell: bash
        run: python benchmarks/rank_decisions.py --capsule build/prepared/capsule --threads $RANK_DECISIONS_WORKERS --repeat 7 --output build/results/rank-decisions-performance.json
      - name: Verify complete source runtime and capsule after measurement
        if: always()
        run: python -c "from pathlib import Path; from benchmarks.rank_decisions import verify; verify(Path('build/prepared/capsule'))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank-decisions-performance-${{ matrix.os }}-${{ matrix.runtime }}
          include-hidden-files: true
          retention-days: 90
          path: |
            build/results/
            build/prepared/capsule/
            build/prepared/preparation/
