name: map-array-same-host
on:
  workflow_dispatch:
    inputs:
      baseline_run:
        type: string
        required: true
        default: '40685511797'
      baseline_revision:
        type: string
        required: true
        default: 'b08aef5fb21cb7bfe87ffa04c35767eab1727d8e'
      candidate_run:
        type: string
        required: true
        default: '40688421947'
      candidate_revision:
        type: string
        required: true
        default: 'ef5d9ae4647c844ab948a2a36ddfdb86de665ea3'
permissions:
  contents: read
  actions: read
env:
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  OMP_WAIT_POLICY: PASSIVE
  PYTHONOPTIMIZE: '0'
  PYTHONNOUSERSITE: '1'
  PYTHONUNBUFFERED: '1'
  PYTEST_ADDOPTS: ''
  PYTEST_PLUGINS: ''
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      BASELINE_RUN: ${{ inputs.baseline_run }}
      BASELINE_REVISION: ${{ inputs.baseline_revision }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - name: Authenticate successful CI products
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          lscpu > results/cpu.txt
          uname -a > results/platform.txt
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          assert os.environ['CANDIDATE_RUN'] == '40688421947'
          assert os.environ['CANDIDATE_REVISION'] == 'ef5d9ae4647c844ab948a2a36ddfdb86de665ea3'
          assert os.environ['BASELINE_RUN'] == '40685511797'
          assert os.environ['BASELINE_REVISION'] == 'b08aef5fb21cb7bfe87ffa04c35767eab1727d8e'
          for role in ('baseline', 'candidate'):
              run, revision = (os.environ[role.upper() + suffix] for suffix in ('_RUN', '_REVISION'))
              assert re.fullmatch('[1-9][0-9]*', run) and re.fullmatch('[0-9a-f]{40}', revision)
              base = 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/'
              def api(endpoint):
                  raw = subprocess.check_output(['gh', 'api', base + endpoint])
                  Path('results', role + '-' + endpoint.split('?')[0].split('/')[-1] + '.json').write_bytes(raw)
                  return json.loads(raw)
              record = api('runs/' + run)
              assert str(record['id']) == run and record['head_sha'] == revision
              assert record['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
              assert record['path'] == '.github/workflows/ci.yml'
              assert record['status'] == 'completed' and record['conclusion'] == 'success'
              listing = api('runs/' + run + '/artifacts?per_page=100')
              assert listing['total_count'] == len(listing['artifacts'])
              matches = [a for a in listing['artifacts'] if a['name'] == 'ci-performance-minimum']
              assert len(matches) == 1
              item = matches[0]
              assert not item['expired'] and 0 < item['size_in_bytes'] < 512 * 1024**2
              assert item['workflow_run']['id'] == int(run) and item['workflow_run']['head_sha'] == revision
              assert re.fullmatch('sha256:[0-9a-f]{64}', item['digest'])
              if role == 'baseline':
                  assert item['id'] == 12814229633
                  assert item['digest'] == 'sha256:b006fa18d41fdb350d0e754829b13bad9a1fe09687df84f807e4a1ff72e5ee8d'
              Path('results', role + '-selection.json').write_text(json.dumps(item, indent=2) + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline_revision }}
          path: snapshots/baseline
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_revision }}
          path: snapshots/candidate
          fetch-depth: 1
      - name: Download exact CI ZIPs and install both runtimes offline
        shell: bash
        run: |
          set -euo pipefail
          for role in baseline candidate; do
            id=$(python -c "import json; print(json.load(open('results/$role-selection.json'))['id'])")
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/$role-prepared.zip"
            ROLE="$role" python - <<'PY'
          import ast, hashlib, json, os, re, stat, zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path, PurePosixPath
          def assert_existing_sources():
              def read(role, name):
                  return Path('snapshots', role, name).read_text(encoding='utf-8')
              old, new = (read(role, 'src/map_array.hpp') for role in ('baseline', 'candidate'))
              for pattern in (r'struct MapArrayInput\s*\{[^}]*\};', r'struct MapArrayOutput\s*\{[^}]*\};',
                              r'void map_array_into\([^;]+;'):
                  left, right = (re.search(pattern, value) for value in (old, new))
                  assert left and right
                  assert re.sub(r'\s+', '', left.group()) == re.sub(r'\s+', '', right.group()), 'public prepared map ABI remains exact'
          role = os.environ['ROLE']; folder = Path('snapshots', role, 'build')
          selected = json.loads(Path('results', role + '-selection.json').read_bytes())
          archive = Path(os.environ['RUNNER_TEMP'], role + '-prepared.zip')
          actual = dict(bytes=archive.stat().st_size, sha256=hashlib.sha256(archive.read_bytes()).hexdigest())
          Path('results', role + '-archive.json').write_text(json.dumps(actual, indent=2) + '\n')
          assert actual['bytes'] == selected['size_in_bytes'] and 'sha256:' + actual['sha256'] == selected['digest']
          with zipfile.ZipFile(archive) as z:
              names = z.namelist(); assert len(names) == len(set(names))
              assert sum(i.file_size for i in z.infolist()) < 2 * 1024**3
              for i in z.infolist():
                  p = PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in i.filename
                  assert not stat.S_ISLNK(i.external_attr >> 16)
              z.extractall(folder)
          prepared = folder / 'prepared/ci-artifacts'
          # latest_only baselines and prepare_only candidates need no standalone timing JSONs here.
          manifest = json.loads((prepared / 'measurement.json').read_bytes())
          assert manifest['schema'] == 'ci-offline-measurement-v1'
          assert manifest['source']['revision'] == os.environ[role.upper() + '_REVISION']
          assert len(manifest['wheels']) == 14
          for family, count in (('inertia-tensor', 115), ('inertia-eigvals', 69), ('moments', 203), ('window', 179),
                                ('lpi', 161), ('butterworth', 175), ('moments-derived', 155),
                                ('normalized-layouts', 22), ('immutable-bytes', 134),
                                ('moments-coords', 98), ('shannon-entropy', 61), ('rgb2yuv-storage', 37),
                                ('block-reduce', 145), ('perimeter-crofton', 101), ('perimeter', 111), ('euler-number', 91),
                                ('polygon', 86), ('mesh-surface-area', 89), ('profile-line', 93), ('blur-effect', 121), ('compare-images', 109), ('profile-coordinates', 51),
                                ('level-set', 161), ('level-set-pipeline', 163), ('map-array', 103), ('map-array-pipeline', 103),
                                ('color-transforms-regression', 1848)):
              for mode in ('normal', 'scalar'):
                  tree = ET.fromstring((prepared / (family + '-' + mode + '.xml')).read_bytes())
                  assert len(tree.findall('.//testcase')) == count
                  assert not any(tree.findall('.//' + tag) for tag in ('failure', 'error', 'skipped'))
          for family, count in (('blur-effect-intake', 4), ('polygon-intake', 4), ('euler-number-intake', 4), ('block-reduce-integer-width', 9)):
              tree = ET.fromstring((prepared / (family + '.xml')).read_bytes())
              assert len(tree.findall('.//testcase')) == count
              assert not any(tree.findall('.//' + tag) for tag in ('failure', 'error', 'skipped'))
          smoke = json.loads((prepared / 'feature-smoke.json').read_bytes())
          assert smoke['status'] == 'passed' and smoke['exit_code'] == 0
          assert smoke['outcomes'] == {'passed': 1423} and len(smoke['results']) == 1423
          assert smoke['implementations']['native-partial'] + smoke['implementations']['metadata'] == 242
          if role == 'candidate':
              old, new = (json.loads(Path('snapshots', r, 'build/prepared/ci-artifacts/measurement.json').read_bytes()) for r in ('baseline', 'candidate'))
              for key in ('python', 'implementation', 'cache_tag', 'machine', 'system', 'dependency_libraries_sha256'):
                  assert old['runtime'][key] == new['runtime'][key], key
              assert {k: v for k, v in old['runtime']['versions'].items() if k != 'scikit-imagexx'} == {k: v for k, v in new['runtime']['versions'].items() if k != 'scikit-imagexx'}
              for name in ('numpy', 'scipy', 'skimage'):
                  assert old['runtime']['packages_sha256'][name] == new['runtime']['packages_sha256'][name], name
              assert {k: v for k, v in old['wheels'].items() if v['name'] != 'scikit-imagexx'} == {k: v for k, v in new['wheels'].items() if v['name'] != 'scikit-imagexx'}, 'all13 runtime dependency wheels exact; no normalization authorized'
              mutable = {'src/map_array.cpp', 'src/map_array.hpp', 'src/simd_map_array_avx2.cpp', 'tests/test_map_array_native.cpp'}
              contract = 'coverage/contracts/map-array-small-native-candidate.json'
              assert contract not in old['source']['files_sha256']
              assert new['source']['files_sha256'][contract] == '771727f45957ea0f021f9afc0811b9245dcfe723ea2fd2bc97cf59760486de01'
              assert hashlib.sha256(Path('snapshots/candidate', contract).read_bytes()).hexdigest() == 'eb9305a7ec836e79899c9ad8558a4e588beb2a1d1eeff885b75f7c2faad32dad'
              old_fixed, new_fixed = ({k: v for k, v in value['source']['files_sha256'].items()
                                      if k not in mutable | {contract}} for value in (old, new))
              assert old_fixed == new_fixed, 'every other repository blob including frontend/binder/CMake/science/harness/frozen50 exact'
              assert all(mutable <= value['source']['files_sha256'].keys() for value in (old, new))
              assert_existing_sources()
          PY
            python -m venv "$RUNNER_TEMP/env-$role"
            "$RUNNER_TEMP/env-$role/bin/python" -m pip install --no-index --no-deps --only-binary=:all: --require-hashes --find-links "snapshots/$role/build/prepared/wheels" -r "snapshots/$role/build/prepared/ci-artifacts/runtime-lock.txt" 2>&1 | tee "results/$role-offline-install.log"
            "$RUNNER_TEMP/env-$role/bin/python" "snapshots/$role/tools/ci_measurement_artifacts.py" verify --wheel-dir "snapshots/$role/build/prepared/wheels" --artifact "snapshots/$role/build/prepared/ci-artifacts/measurement.json" 2>&1 | tee "results/$role-original-identity.log"
          done
      - name: Measure the fixed9 MapArray cases in ABBA order
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME SKIMAGEXX_DISABLE_SIMD
          for pass in 1-baseline 2-candidate 3-candidate 4-baseline; do
            role=${pass#*-}; py="$RUNNER_TEMP/env-$role/bin/python"; output="$GITHUB_WORKSPACE/results/$pass"
            mkdir "$output"
            cd "$GITHUB_WORKSPACE/snapshots/$role"
            "$py" tools/ci_measurement_artifacts.py verify --wheel-dir build/prepared/wheels --artifact build/prepared/ci-artifacts/measurement.json 2>&1 | tee "$output/identity-before.log"
            status=0
            "$py" benchmarks/map_array.py --threads 1 --repeat 7 --output "$output/map-array.json" 2>&1 | tee "$output/map-array.log" || status=$?
            echo "$status" > "$output/benchmark-exit.txt"
            "$py" tools/ci_measurement_artifacts.py verify --wheel-dir build/prepared/wheels --artifact build/prepared/ci-artifacts/measurement.json 2>&1 | tee "$output/identity-after.log"
            test "$status" -eq 0
          done
      - name: Check all four complete raw reports
        shell: bash
        run: |
          python - <<'PY'
          import json, math, runpy, statistics
          from pathlib import Path
          from datetime import datetime, timezone
          deadline = datetime.fromisoformat('2026-10-28T14:27:11.951171+00:00')
          contract = json.loads(Path('snapshots/baseline/coverage/contracts/map-array-benchmark.json').read_bytes())
          expected = {r['case_id']: r for r in contract['cases']}
          assert len(expected) == 9
          reports = []
          for name in ('1-baseline', '2-candidate', '3-candidate', '4-baseline'):
              source = Path('snapshots', name.split('-', 1)[1])
              fingerprint = runpy.run_path(str(source / 'benchmarks/provenance.py'))['source_fingerprint'](source)
              manifest_raw = (source / 'build/prepared/ci-artifacts/measurement.json').read_bytes()
              manifest = json.loads(manifest_raw)
              import hashlib
              identity = dict(status='verify', revision=manifest['source']['revision'], wheel_count=14,
                              artifact_sha256=hashlib.sha256(manifest_raw).hexdigest())
              for when in ('before', 'after'):
                  assert json.loads(Path('results', name, 'identity-' + when + '.log').read_bytes()) == identity
              report = json.loads(Path('results', name, 'map-array.json').read_bytes())
              meta, rows = report['metadata'], report['results']
              assert all(meta[key] == value for key, value in fingerprint.items()) and meta['source_before'] == fingerprint
              assert meta['repeat'] == 7 and meta['threads'] == 1 and meta['raw_samples'] == 126
              assert meta['fallback_enabled'] is False and meta['avx2'] is True
              assert meta['reference'] == '0.26.0' and meta['numpy'] == '1.24.4' and meta['scipy'] == '1.15.3'
              assert meta['python'] == manifest['runtime']['python']
              cores = [(n, v) for n, v in manifest['runtime']['packages_sha256']['skimagexx'].items() if n.endswith('.so')]
              assert len(cores) == 1 and meta['core_sha256'] == cores[0][1]
              assert meta['numpy_error_policy'] == dict(divide='warn', over='warn', under='ignore', invalid='warn')
              assert meta['numpy_buffer_elements'] == 8192
              assert meta['selected_apis'] == ['util.map_array']
              assert meta['harness_sha256'] == 'a6f25c1e7fe60ab9a86cb38406a2a49054a052d1b0e29dc555545a1cb021667b'
              assert meta['reference_pool_limits'] == {n: '1' for n in ('OPENBLAS_NUM_THREADS', 'MKL_NUM_THREADS', 'OMP_NUM_THREADS', 'BLIS_NUM_THREADS')}
              assert meta['contract_sha256'] == '360e96314eb6e4ddbbab566acd23790ab8e8dfe38e7a1525242132f980dc17b8'
              assert meta['original_source_sha256'] == 'aaca3e8ec753ab84d793a39e7aa71db991d5d39dd457cba96d11b4aba1f2cfe2'
              assert meta['primitive_sha256'] == 'ec8b4ba7dc6b98f9e248b297ef194aae22396d96d145f9417dbe32858b22885e'
              assert meta['target_ms'] == 19 and meta['seed'] == 2026
              assert len(rows) == 9 and {r['case_id'] for r in rows} == expected.keys()
              for row in rows:
                  assert all(row[key] == value for key, value in expected[row['case_id']].items())
                  assert row['api'] == 'util.map_array' and row['backend'] == 'native' and row['threads'] == 1
                  assert row['native_accepted'] is True and row['actual_C_returns'] == ['map_array_apply']
                  assert row['max_abs_error'] == 0 and row['output_sha256'] == row['reference_sha256'] == row['oracle_sha256']
                  for record in [*row['inputs'], dict(sha256=row['output_sha256'])]:
                      assert len(record['sha256']) == 64 and int(record['sha256'], 16) >= 0
                  assert row['result_is_out'] == row['reference_result_is_out'] == row['preallocated_out']
                  assert row['sample_labels'] == ['scikit-image', 'current']
                  assert list(map(len, row['samples_ms'])) == [7, 7] and len(row['loops']) == 2
                  assert all(isinstance(n, int) and n > 0 for n in row['loops'])
                  assert all(math.isfinite(v) and v > 0 for samples in row['samples_ms'] for v in samples)
                  a, b = map(statistics.median, row['samples_ms'])
                  assert (a, b, a / b) == (row['reference_ms'], row['cpp_ms'], row['speedup'])
              reports.append({r['case_id']: r for r in rows})
          assert all(r.keys() == reports[0].keys() for r in reports)
          def gm(values):
              return math.exp(statistics.mean(math.log(v) for v in values))
          rows = []
          for key, first in reports[0].items():
              values = [r[key] for r in reports]
              for field in ('shape', 'input_dtype', 'output_dtype', 'kind', 'key_count', 'preallocated_out',
                            'inputs', 'output_metadata', 'output_sha256', 'reference_sha256', 'oracle_sha256',
                            'result_is_out', 'reference_result_is_out'):
                  assert all(v[field] == first[field] for v in values), (key, field)
              b0, c1, c2, b3 = values
              rows.append(dict(case_id=key, input_dtype=first['input_dtype'], output_dtype=first['output_dtype'], kind=first['kind'],
                  direct_gain=math.sqrt(b0['cpp_ms'] * b3['cpp_ms'] / (c1['cpp_ms'] * c2['cpp_ms'])),
                  normalized_gain=math.sqrt(c1['speedup'] * c2['speedup'] / (b0['speedup'] * b3['speedup'])),
                  candidate_original=math.sqrt(c1['speedup'] * c2['speedup']),
                  repeat_direct=min(math.sqrt(b0['cpp_ms'] * b3['cpp_ms']) / c['cpp_ms'] for c in (c1, c2)) > 1.03,
                  repeat_normalized=min(c['speedup'] / math.sqrt(b0['speedup'] * b3['speedup']) for c in (c1, c2)) > 1.03,
                  original_repeat=min(c1['speedup'], c2['speedup']) > 1,
                  baseline_cpp_ms=[b0['cpp_ms'], b3['cpp_ms']], candidate_cpp_ms=[c1['cpp_ms'], c2['cpp_ms']],
                  candidate_original_passes=[c1['speedup'], c2['speedup']],
                  added_ms=math.sqrt(c1['cpp_ms'] * c2['cpp_ms']) - math.sqrt(b0['cpp_ms'] * b3['cpp_ms'])))
          completed = datetime.now(timezone.utc)
          direct = gm(r['direct_gain'] for r in rows)
          normalized = gm(r['normalized_gain'] for r in rows)
          original = gm(r['candidate_original'] for r in rows)
          target_ids = {'signed64-sparse-f64-256', 'signed64-sparse-f64-1024', 'strided-out-u8-f32-65536'}
          preserved_ids = {'dense-u8-u16-64', 'dense-u8-u16-256', 'dense-u8-u16-1024', 'uint64-wide-c128-1024', 'strided-u16-u32-512'}
          targets = [r for r in rows if r['case_id'] in target_ids]
          preserved = [r for r in rows if r['case_id'] in preserved_ids]
          assert len(targets) == 3 and len(preserved) == 5
          keep = (direct > 1.03 and normalized > 1.03
                  and all(r['repeat_direct'] and r['repeat_normalized'] for r in targets)
                  and all(r['original_repeat'] for r in preserved) and completed < deadline)
          summary = dict(status='KEEP' if keep else 'DISCARD', completed_utc=completed.isoformat(),
              deadline_utc=deadline.isoformat(), completed_before_deadline=completed < deadline,
              contract_sha256='eb9305a7ec836e79899c9ad8558a4e588beb2a1d1eeff885b75f7c2faad32dad',
              raw_samples=504, direct_gain=direct, normalized_gain=normalized, candidate_original=original,
              target_repeat_wins=sum(r['repeat_direct'] and r['repeat_normalized'] for r in targets),
              preserved_original_repeat_wins=sum(r['original_repeat'] for r in preserved),
              direct_losses=[r['case_id'] for r in rows if r['direct_gain'] < 1],
              normalized_losses=[r['case_id'] for r in rows if r['normalized_gain'] < 1],
              balanced_original_losses=[r['case_id'] for r in rows if r['candidate_original'] < 1],
              candidate_pass_original_losses={name: [r['case_id'] for r in report.values() if r['speedup'] < 1]
                                              for name, report in zip(('2-candidate', '3-candidate'), reports[1:3])},
              groups={name: dict(cases=len(group), direct_gain=gm(r['direct_gain'] for r in group),
                  normalized_gain=gm(r['normalized_gain'] for r in group), candidate_original=gm(r['candidate_original'] for r in group))
                  for name, group in [('targets', targets), ('preserved_original_wins', preserved)]
                  + [(kind, [r for r in rows if r['kind'] == kind]) for kind in sorted({r['kind'] for r in rows})]
                  + [(dtype, [r for r in rows if r['output_dtype'] == dtype]) for dtype in sorted({r['output_dtype'] for r in rows})]},
              controls_scope='All9 results retained. Five original wins are preservation gates; three sparse/strided targets require each candidate pass to improve over baseline geometric means by more than3percent. Dense-strided gather and small-map selection are one candidate bundle, no stage causality.',
              rows=rows)
          Path('results/comparison.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps({k: v for k, v in summary.items() if k != 'rows'}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-array-same-host-minimum
          path: results/
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error
