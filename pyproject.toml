[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13", "numpy>=2,<3"]
build-backend = "scikit_build_core.build"

[project]
name = "scikit-imagexx"
version = "0.1.0"
description = "A measured, incremental C++ image processing library"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = "BSD-3-Clause"
license-files = ["LICENSE", "third_party/scikit-image-LICENSE.txt", "third_party/svml-LICENSE.txt", "third_party/numpy-LICENSE.txt", "third_party/scipy-ndimage-LICENSE.txt", "third_party/scipy-rank1d-LICENSE.txt", "third_party/lapack-LICENSE.txt"]

[project.optional-dependencies]
compat = ["scikit-image==0.26.0"]
test = ["pytest>=8", "scikit-image==0.26.0", "scipy>=1.11"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/skimagexx"]
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
SKIMAGEXX_BUILD_PYTHON = "ON"
BUILD_TESTING = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests"]
